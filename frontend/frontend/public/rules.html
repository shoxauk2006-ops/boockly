<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bookly Rules of Use"><title>Bookly — Rules of Use</title><style>:root{--ink:#111318;--muted:#69707d;--line:#e7e9ee;--soft:#f5f6f8;--accent:#5b5cf0}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}.wrap{width:min(860px,calc(100% - 36px));margin:auto}.top{padding:28px 0 18px;display:flex;align-items:center;justify-content:space-between;gap:14px}.logo{font-size:22px;font-weight:850;letter-spacing:-.06em;text-decoration:none;color:var(--ink)}.top-right{display:flex;align-items:center;gap:10px}.back{font-size:13px;color:#626976;text-decoration:none}.lang{height:38px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 8px;font:inherit;font-size:12px;font-weight:750}.hero{padding:46px 0 34px}.eyebrow{font-size:11px;font-weight:850;letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}h1{font-size:clamp(40px,7vw,64px);line-height:1;letter-spacing:-.06em;margin:12px 0 16px}.intro{font-size:17px;line-height:1.6;color:var(--muted);max-width:680px;margin:0}.updated{font-size:12px;color:#9096a0;margin-top:14px}.rules{padding:8px 0 80px}.rule{padding:28px 0;border-top:1px solid var(--line)}.rule h2{font-size:20px;letter-spacing:-.03em;margin:0 0 9px}.rule p{font-size:14px;line-height:1.65;color:#5f6672;margin:0}.contact{margin-top:20px;background:var(--soft);border-radius:22px;padding:22px}.contact strong{display:block;margin-bottom:6px}.contact a{color:var(--ink);font-weight:800;text-decoration:none}@media(max-width:560px){.wrap{width:min(100% - 28px,860px)}.top{padding-top:20px}.hero{padding-top:36px}.top-right{gap:7px}.back{font-size:12px}}
</style></head><body><header class="wrap top"><a class="logo" href="/landing.html">BOOKLY</a><div class="top-right"><select id="lang" class="lang" aria-label="Language"><option value="en">English</option><option value="ru">Русский</option><option value="uz">O‘zbek</option><option value="tr">Türkçe</option><option value="ar">العربية</option></select><a class="back" href="/account.html" id="back">Back to Bookly</a></div></header><main class="wrap"><section class="hero"><div class="eyebrow">Bookly</div><h1 id="title">Rules of Use</h1><p class="intro" id="intro">These rules are intended to keep Bookly useful, safe and fair for businesses and their customers.</p><p class="updated" id="updated">Effective: September 15, 2026</p></section><section class="rules" id="rules"></section></main><script>(function(){var K='bookly_language';var C={en:{back:'Back to Bookly',title:'Rules of Use',intro:'These rules are intended to keep Bookly useful, safe and fair for businesses and their customers.',effective:'Effective: September 15, 2026',support:'Bookly Support',rules:[['Use Bookly for legitimate business activity','Bookly may only be used for lawful services and legitimate business purposes. Do not use the platform to facilitate fraud, scams, illegal activity or services prohibited by applicable law.'],['Keep business information accurate','Business owners are responsible for keeping business name, services, specialists, schedules and booking information accurate and up to date.'],['Do not mislead customers','Do not publish false, deceptive or materially incomplete information about your business, services, availability, prices or identity.'],['Respect customer information','Only collect and use customer information reasonably necessary for providing and managing bookings. Handle customer data responsibly and in accordance with applicable privacy requirements.'],['No spam or abusive use','Do not use Bookly or its Telegram integrations to send spam, harassment, threats, malicious content or unsolicited messages.'],['Bookings and cancellations','Businesses are responsible for honoring the availability they publish and communicating changes or cancellations. Customers should provide accurate booking information and respect stated booking and cancellation conditions.'],['Account security','Keep your Bookly and connected Telegram account secure. Do not share passwords, authentication codes or other credentials.'],['Service availability','Bookly provides technical tools for online booking and business management. Bookly does not guarantee the quality, safety or legality of services offered by businesses using the platform.'],['Violations','We may restrict, suspend or terminate access when necessary to protect Bookly, its users or third parties, or when an account is used in violation of these rules or applicable law.'],['Support','For questions about these rules, your account or Bookly, contact the support team.']]},ru:{back:'Назад в Bookly',title:'Правила использования',intro:'Эти правила помогают сохранять Bookly полезным, безопасным и справедливым для бизнеса и клиентов.',effective:'Действует с 15 сентября 2026',support:'Поддержка Bookly',rules:[['Используйте Bookly для законной деятельности','Bookly можно использовать только для законных услуг и легитимных бизнес-целей. Запрещено содействовать мошенничеству, незаконной деятельности или запрещённым услугам.'],['Поддерживайте информацию о бизнесе в актуальном состоянии','Владелец бизнеса отвечает за актуальность названия, услуг, специалистов, графика и данных для записи.'],['Не вводите клиентов в заблуждение','Не публикуйте ложную, вводящую в заблуждение или существенно неполную информацию о бизнесе, услугах, доступности, ценах или личности.'],['Уважайте информацию о клиентах','Собирайте и используйте только ту информацию о клиентах, которая разумно необходима для предоставления и управления записями.'],['Без спама и злоупотреблений','Не используйте Bookly или его Telegram-интеграции для спама, угроз, преследования, вредоносного контента или нежелательных сообщений.'],['Записи и отмены','Бизнес отвечает за соблюдение опубликованной доступности и информирование клиентов об изменениях и отменах. Клиенты должны указывать точные данные и соблюдать условия записи и отмены.'],['Безопасность аккаунта','Защищайте аккаунт Bookly и подключённый Telegram-аккаунт. Не передавайте пароли, коды авторизации и другие учётные данные.'],['Работа сервиса','Bookly предоставляет технические инструменты для онлайн-записи и управления бизнесом, но не гарантирует качество, безопасность или законность услуг конкретного бизнеса.'],['Нарушения','Мы можем ограничить, приостановить или прекратить доступ для защиты Bookly, пользователей и третьих лиц либо при нарушении правил или закона.'],['Поддержка','По вопросам правил, аккаунта или Bookly обратитесь в поддержку.']]},uz:{back:'Bookly’ga qaytish',title:'Foydalanish qoidalari',intro:'Ushbu qoidalar Bookly’ni bizneslar va mijozlar uchun foydali, xavfsiz va adolatli saqlashga yordam beradi.',effective:'2026-yil 15-sentabrdan amal qiladi',support:'Bookly qo‘llab-quvvatlashi',rules:[['Bookly’dan qonuniy faoliyat uchun foydalaning','Bookly faqat qonuniy xizmatlar va qonuniy biznes maqsadlari uchun ishlatilishi mumkin. Firibgarlik yoki noqonuniy faoliyatni amalga oshirish taqiqlanadi.'],['Biznes ma’lumotlarini aniq saqlang','Biznes egasi nom, xizmatlar, mutaxassislar, ish jadvali va bron ma’lumotlari dolzarb bo‘lishi uchun javob beradi.'],['Mijozlarni chalg‘itmang','Biznes, xizmatlar, mavjud vaqtlar, narxlar yoki shaxs haqida yolg‘on yoki chalg‘ituvchi ma’lumot joylamang.'],['Mijoz ma’lumotlarini hurmat qiling','Bronlarni taqdim etish va boshqarish uchun zarur bo‘lgan ma’lumotlardan foydalaning va ularni mas’uliyat bilan saqlang.'],['Spam va suiiste’mol taqiqlanadi','Bookly yoki Telegram integratsiyalaridan spam, tahdid, ta’qib yoki zararli kontent uchun foydalanmang.'],['Bronlar va bekor qilish','Biznes e’lon qilgan mavjud vaqtlariga rioya qilish va o‘zgarishlarni mijozlarga yetkazish uchun javob beradi.'],['Hisob xavfsizligi','Bookly va Telegram hisobingizni himoya qiling. Parol va autentifikatsiya kodlarini ulashmang.'],['Xizmat mavjudligi','Bookly bronlash va biznes boshqaruvi uchun texnik vositalarni beradi, lekin biznes xizmatining sifati yoki qonuniyligi uchun javob bermaydi.'],['Qoidabuzarliklar','Qoidalar yoki qonun buzilganda Bookly’dan foydalanishni cheklash, to‘xtatish yoki bekor qilishimiz mumkin.'],['Qo‘llab-quvvatlash','Qoidalar, hisob yoki Bookly bo‘yicha savollar uchun qo‘llab-quvvatlash xizmatiga murojaat qiling.']]},tr:{back:'Bookly’ye dön',title:'Kullanım Kuralları',intro:'Bu kurallar Bookly’yi işletmeler ve müşteriler için faydalı, güvenli ve adil tutmak için hazırlanmıştır.',effective:'15 Eylül 2026 itibarıyla geçerlidir',support:'Bookly Destek',rules:[['Bookly’yi yasal işletme faaliyetleri için kullanın','Bookly yalnızca yasal hizmetler ve meşru işletme amaçları için kullanılabilir. Dolandırıcılık veya yasa dışı faaliyetler yasaktır.'],['İşletme bilgilerini güncel tutun','İşletme sahibi ad, hizmetler, uzmanlar, çalışma programı ve rezervasyon bilgilerinin güncel olmasından sorumludur.'],['Müşterileri yanıltmayın','İşletmeniz, hizmetleriniz, uygunluk, fiyatlar veya kimliğiniz hakkında yanlış ya da yanıltıcı bilgiler yayınlamayın.'],['Müşteri bilgilerine saygı gösterin','Rezervasyonları sağlamak ve yönetmek için makul ölçüde gerekli müşteri bilgilerini kullanın.'],['Spam ve kötüye kullanım yasaktır','Bookly veya Telegram entegrasyonlarını spam, tehdit, taciz veya zararlı içerik göndermek için kullanmayın.'],['Rezervasyonlar ve iptaller','İşletmeler yayınladıkları uygunluk bilgilerine uymaktan ve değişiklikleri müşterilere bildirmekten sorumludur.'],['Hesap güvenliği','Bookly ve bağlı Telegram hesabınızı koruyun. Şifreleri ve doğrulama kodlarını paylaşmayın.'],['Hizmet kullanılabilirliği','Bookly rezervasyon ve işletme yönetimi için teknik araçlar sağlar; işletmelerin sunduğu hizmetlerin kalitesini veya yasallığını garanti etmez.'],['İhlaller','Kurallar veya yürürlükteki yasa ihlal edildiğinde erişimi kısıtlayabilir, askıya alabilir veya sonlandırabiliriz.'],['Destek','Kurallarınız, hesabınız veya Bookly hakkında sorularınız için destek ekibiyle iletişime geçin.']]},ar:{back:'العودة إلى Bookly',title:'قواعد الاستخدام',intro:'تهدف هذه القواعد إلى إبقاء Bookly مفيدًا وآمنًا وعادلًا للأنشطة التجارية وعملائها.',effective:'سارية من 15 سبتمبر 2026',support:'دعم Bookly',rules:[['استخدم Bookly لنشاط تجاري قانوني','لا يجوز استخدام Bookly إلا للخدمات والأنشطة التجارية المشروعة. يُحظر الاحتيال والأنشطة غير القانونية والخدمات المحظورة.'],['حافظ على دقة معلومات النشاط','يتحمل صاحب النشاط مسؤولية تحديث الاسم والخدمات والموظفين والجدول ومعلومات الحجز.'],['لا تضلل العملاء','لا تنشر معلومات كاذبة أو مضللة عن النشاط أو الخدمات أو الأسعار أو المواعيد أو الهوية.'],['احترم معلومات العملاء','استخدم فقط المعلومات اللازمة بشكل معقول لتقديم الحجوزات وإدارتها وتعامل معها بمسؤولية.'],['يُحظر البريد العشوائي وإساءة الاستخدام','لا تستخدم Bookly أو تكاملات Telegram لإرسال الرسائل المزعجة أو التهديدات أو المحتوى الضار.'],['الحجوزات والإلغاءات','تتحمل الأنشطة مسؤولية الالتزام بالمواعيد المنشورة وإبلاغ العملاء بأي تغييرات أو إلغاءات.'],['أمان الحساب','حافظ على أمان حساب Bookly وحساب Telegram المرتبط. لا تشارك كلمات المرور أو رموز التحقق.'],['توفر الخدمة','يوفر Bookly أدوات تقنية للحجز وإدارة النشاط ولا يضمن جودة أو قانونية الخدمات التي تقدمها الأنشطة.'],['المخالفات','قد نقيّد أو نعلّق أو ننهي الوصول عند مخالفة هذه القواعد أو القانون لحماية Bookly ومستخدميه والجهات الأخرى.'],['الدعم','للاستفسارات حول القواعد أو الحساب أو Bookly، تواصل مع فريق الدعم.']]}};function lang(){try{var s=localStorage.getItem(K);if(C[s])return s}catch(e){}var b=(navigator.language||'').toLowerCase();if(b.indexOf('ru')===0)return'ru';if(b.indexOf('uz')===0)return'uz';if(b.indexOf('tr')===0)return'tr';if(b.indexOf('ar')===0)return'ar';return'en'}function render(){var l=lang(),d=C[l]||C.en;document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';document.getElementById('lang').value=l;document.getElementById('back').textContent=d.back;document.getElementById('title').textContent=d.title;document.getElementById('intro').textContent=d.intro;document.getElementById('updated').textContent=d.effective;var root=document.getElementById('rules');root.innerHTML='';d.rules.forEach(function(x,i){var a=document.createElement('article');a.className='rule';a.innerHTML='<h2>'+(i+1)+'. '+x[0]+'</h2><p>'+x[1]+'</p>';root.appendChild(a)});var c=document.createElement('div');c.className='contact';c.innerHTML='<strong>'+d.support+'</strong><a href="mailto:booklyminiapp@gmail.com">booklyminiapp@gmail.com</a>';root.appendChild(c)}document.getElementById('lang').onchange=function(){try{localStorage.setItem(K,this.value)}catch(e){}location.reload()};render();})();</script></body></html>
