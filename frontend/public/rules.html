en:{back:'Back to Skedwoo',title:'Terms of Use',intro:'These Terms govern access to and use of Skedwoo, including the website, account workspace and Telegram Mini App.',effective:'Effective: September 18, 2026',support:'Skedwoo Support',rules:[
['Acceptance of these Terms','By creating an account, connecting Telegram, purchasing a subscription or otherwise using Skedwoo, you agree to these Terms. If you use Skedwoo for a business or organization, you confirm that you are authorized to act on its behalf.'],
['Accounts and eligibility','You are responsible for providing accurate account information and keeping your login credentials secure. You must not share authentication codes or knowingly allow unauthorized access to your Skedwoo account or connected Telegram account.'],
['Business information and responsibilities','Business owners are responsible for the accuracy of business names, services, prices, specialists, schedules, availability and other information shown to customers. Skedwoo provides booking tools but does not operate or control the underlying business.'],
['Acceptable use','Skedwoo may only be used for lawful services and legitimate business activity. You must not use Skedwoo for fraud, scams, unlawful services, harassment, spam, malicious activity, deceptive content or attempts to interfere with the service.'],
['Bookings, changes and cancellations','Businesses are responsible for honoring the availability and booking conditions they publish and for communicating changes or cancellations. Customers are responsible for providing accurate booking information and following any conditions set by the business. Skedwoo is not a party to the service transaction between a business and its customer.'],
['Customer data','When booking, a customer may provide a name and phone number. This information is made available to the selected business only to process and manage that booking. Skedwoo does not provide the business with additional personal customer data beyond what the customer enters during booking.'],
['Subscriptions, trials and service limits','Skedwoo may offer paid subscriptions, service-limit packages and, where stated, a limited free trial. Trial eligibility, billing periods, included limits and current prices are shown on the Skedwoo website at the time of purchase. Features and limits may differ between plans.'],
['Payments, renewals and cancellation','Payments are processed by Paddle. A paid subscription automatically renews for the next billing period according to the selected plan until it is cancelled. You can cancel future renewal through the available billing controls. Cancellation stops future billing and does not automatically create a refund for a completed billing period.'],
['Refunds and payment disputes','Refunds, chargebacks and payment disputes are handled in accordance with applicable law and the policies and procedures of Paddle. Where a mandatory consumer right applies, those rights are not excluded by these Terms.'],
['Availability and changes to Skedwoo','We aim to keep Skedwoo available and reliable, but uninterrupted or error-free operation is not guaranteed. We may maintain, modify, add or remove features where reasonably necessary for security, reliability, legal compliance or product development.'],
['Suspension and termination','We may restrict, suspend or terminate access where an account violates these Terms, applicable law, creates security or abuse risks, or threatens Skedwoo, its users or third parties. You may stop using Skedwoo at any time, subject to any active billing obligations.'],
['Intellectual property','Skedwoo software, branding, interface, design and related materials are owned by Skedwoo or its licensors and may not be copied, sold, reverse engineered or redistributed except where permitted by law. Businesses retain responsibility for content and information they upload to Skedwoo.'],
['Disclaimers and limitation of responsibility','Skedwoo provides software tools for booking and business management. Skedwoo does not guarantee the quality, safety, legality or performance of services provided by businesses using the platform. To the extent permitted by law, Skedwoo is not responsible for indirect losses arising from disputes between businesses and customers or from events outside Skedwoo’s reasonable control.'],
['Changes to these Terms','We may update these Terms when the service, pricing structure, legal requirements or operational needs change. Material updates will be published with a new effective date. Continued use of Skedwoo after updated Terms take effect constitutes acceptance where permitted by law.'],
['Contact','For questions about these Terms, your account or Skedwoo, contact the support team.']
]},
ru:{back:'Назад в Skedwoo',title:'Условия использования',intro:'Эти Условия регулируют доступ к Skedwoo и его использование, включая сайт, кабинет аккаунта и Telegram Mini App.',effective:'Действует с 18 сентября 2026',support:'Поддержка Skedwoo',rules:[
['Принятие условий','Создавая аккаунт, подключая Telegram, покупая подписку или иным образом используя Skedwoo, вы соглашаетесь с этими Условиями. Если вы используете Skedwoo от имени бизнеса или организации, вы подтверждаете, что имеете право действовать от их имени.'],
['Аккаунт и доступ','Вы отвечаете за достоверность данных аккаунта и сохранность данных входа. Не передавайте коды авторизации и не допускайте заведомо несанкционированного доступа к аккаунту Skedwoo или подключённому Telegram-аккаунту.'],
['Информация о бизнесе и ответственность','Владелец бизнеса отвечает за точность названия, услуг, цен, специалистов, графика, доступности и другой информации, показываемой клиентам. Skedwoo предоставляет инструменты записи, но не управляет самим бизнесом и его услугами.'],
['Допустимое использование','Skedwoo можно использовать только для законных услуг и легитимной деятельности. Запрещены мошенничество, незаконные услуги, угрозы, спам, вредоносная деятельность, вводящий в заблуждение контент и попытки нарушить работу сервиса.'],
['Записи, изменения и отмены','Бизнес отвечает за соблюдение опубликованной доступности и условий записи, а также за информирование клиентов об изменениях и отменах. Клиент отвечает за точность данных при записи и соблюдение условий бизнеса. Skedwoo не является стороной сделки между бизнесом и клиентом.'],
['Данные клиентов','При бронировании клиент может указать имя и номер телефона. Эти данные доступны выбранному бизнесу только для обработки и управления конкретной записью. Skedwoo не предоставляет бизнесу дополнительные персональные данные клиента, кроме информации, которую клиент сам указал при бронировании.'],
['Подписки, пробный период и лимиты','Skedwoo может предлагать платные подписки, пакеты лимитов услуг и, когда это указано, ограниченный бесплатный пробный период. Право на пробный период, период оплаты, включённые лимиты и актуальные цены отображаются на сайте Skedwoo во время покупки.'],
['Оплата, продление и отмена','Платежи обрабатываются через Paddle. Платная подписка автоматически продлевается на следующий платёжный период в соответствии с выбранным тарифом, пока пользователь не отменит её. Будущее продление можно отменить через доступные инструменты биллинга. После отмены автоматическое продление прекращается. Отмена не означает автоматический возврат средств за уже оплаченный период.'],
['Возвраты и платёжные споры','Возвраты, чарджбэки и платёжные споры рассматриваются в соответствии с применимым законодательством и процедурами Paddle. Если закон предоставляет обязательные права потребителю, эти Условия их не отменяют.'],
['Доступность и изменения Skedwoo','Мы стремимся поддерживать стабильную работу Skedwoo, но не гарантируем отсутствие перерывов или ошибок. Мы можем проводить обслуживание, изменять, добавлять или удалять функции, когда это разумно необходимо для безопасности, стабильности, соблюдения закона или развития продукта.'],
['Ограничение и прекращение доступа','Мы можем ограничить, приостановить или прекратить доступ, если аккаунт нарушает Условия или закон, создаёт угрозу безопасности, используется для злоупотреблений или представляет риск для Skedwoo, пользователей или третьих лиц. Вы можете прекратить использование Skedwoo в любое время с учётом действующих платёжных обязательств.'],
['Интеллектуальная собственность','Программное обеспечение, бренд, интерфейс, дизайн и связанные материалы Skedwoo принадлежат Skedwoo или его правообладателям. Их нельзя копировать, продавать, декомпилировать или распространять иначе, чем разрешено законом. Бизнес отвечает за контент и данные, которые он загружает в Skedwoo.'],
['Отказ от гарантий и предел ответственности','Skedwoo предоставляет программные инструменты для записи и управления бизнесом. Skedwoo не гарантирует качество, безопасность, законность или результат услуг, оказываемых бизнесами. В пределах, разрешённых законом, Skedwoo не отвечает за косвенные убытки из-за споров между бизнесом и клиентом или событий вне разумного контроля Skedwoo.'],
['Изменения условий','Мы можем обновлять эти Условия при изменении сервиса, ценовой модели, законодательства или операционных требований. Существенные изменения публикуются с новой датой вступления в силу. Продолжение использования после вступления обновлений в силу означает их принятие, если это допускается законом.'],
['Контакты','По вопросам этих Условий, аккаунта или Skedwoo обратитесь в поддержку.']
]},
uz:{back:'Skedwoo’ga qaytish',title:'Foydalanish shartlari',intro:'Ushbu Shartlar Skedwoo, jumladan sayt, hisob kabineti va Telegram Mini App’dan foydalanishni tartibga soladi.',effective:'2026-yil 18-sentabrdan amal qiladi',support:'Skedwoo qo‘llab-quvvatlashi',rules:[
['Shartlarni qabul qilish','Hisob yaratish, Telegram’ni ulash, obuna sotib olish yoki Skedwoo’dan boshqa tarzda foydalanish orqali siz ushbu Shartlarga rozilik bildirasiz. Agar Skedwoo’dan biznes yoki tashkilot nomidan foydalansangiz, uning nomidan harakat qilish vakolatiga ega ekaningizni tasdiqlaysiz.'],
['Hisob va kirish','Hisob ma’lumotlarining to‘g‘riligi va kirish ma’lumotlarining xavfsizligi uchun siz javobgarsiz. Autentifikatsiya kodlarini ulashmang va Skedwoo yoki ulangan Telegram hisobiga ruxsatsiz kirishga yo‘l qo‘ymang.'],
['Biznes ma’lumotlari va javobgarlik','Biznes egasi nom, xizmatlar, narxlar, mutaxassislar, jadval, mavjud vaqtlar va mijozlarga ko‘rsatiladigan boshqa ma’lumotlarning to‘g‘riligi uchun javobgardir. Skedwoo bronlash vositalarini beradi, lekin biznesning o‘zini boshqarmaydi.'],
['Ruxsat etilgan foydalanish','Skedwoo faqat qonuniy xizmatlar va qonuniy biznes faoliyati uchun ishlatilishi mumkin. Firibgarlik, noqonuniy xizmatlar, tahdid, spam, zararli faoliyat, chalg‘ituvchi kontent va xizmat ishiga xalaqit berishga urinish taqiqlanadi.'],
['Bronlar, o‘zgarishlar va bekor qilish','Biznes e’lon qilgan mavjud vaqtlar va bron shartlariga rioya qilish hamda o‘zgarish yoki bekor qilish haqida mijozlarga xabar berish uchun javobgardir. Mijoz bron ma’lumotlarining to‘g‘riligi va biznes shartlariga rioya qilish uchun javobgardir. Skedwoo biznes va mijoz o‘rtasidagi xizmat bitimining tomoni emas.'],
['Mijoz ma’lumotlari','Bron qilishda mijoz ism va telefon raqamini kiritishi mumkin. Bu ma’lumotlar faqat shu bronni qayta ishlash va boshqarish uchun tanlangan biznesga ko‘rsatiladi. Skedwoo mijoz bron vaqtida o‘zi kiritgan ma’lumotlardan tashqari biznesga qo‘shimcha shaxsiy ma’lumot bermaydi.'],
['Obunalar, sinov muddati va limitlar','Skedwoo pullik obunalar, xizmat limitlari paketlari va ko‘rsatilgan hollarda cheklangan bepul sinov muddatini taklif qilishi mumkin. Sinov huquqi, billing davri, kiritilgan limitlar va amaldagi narxlar xarid vaqtida Skedwoo saytida ko‘rsatiladi.'],
['To‘lov, uzaytirish va bekor qilish','To‘lovlar Paddle orqali qayta ishlanadi. Pullik obuna foydalanuvchi uni bekor qilmaguncha tanlangan tarifga muvofiq keyingi billing davriga avtomatik ravishda uzaytiriladi. Kelajakdagi uzaytirishni mavjud billing vositalari orqali bekor qilish mumkin. Bekor qilingandan so‘ng avtomatik uzaytirish to‘xtaydi. Bekor qilish avval to‘langan davr uchun avtomatik pul qaytarishni anglatmaydi.'],
['Qaytarish va to‘lov nizolari','Pulni qaytarish, chargeback va to‘lov nizolari amaldagi qonunchilik hamda Paddle siyosatlari va tartiblariga muvofiq ko‘rib chiqiladi. Qonunda majburiy iste’molchi huquqlari mavjud bo‘lsa, ushbu Shartlar ularni bekor qilmaydi.'],
['Skedwoo mavjudligi va o‘zgarishlar','Skedwoo’ni barqaror ishlatishga harakat qilamiz, ammo uzluksiz yoki xatosiz ishlashni kafolatlamaymiz. Xavfsizlik, barqarorlik, qonuniy talablar yoki mahsulot rivoji uchun zarur bo‘lganda xizmatni texnik xizmatdan o‘tkazish, o‘zgartirish, funksiyalar qo‘shish yoki olib tashlashimiz mumkin.'],
['Kirishni cheklash va tugatish','Hisob ushbu Shartlar yoki qonunni buzsa, xavfsizlik yoki suiiste’mol xavfi tug‘dirsa yoki Skedwoo, foydalanuvchilar yoki uchinchi tomonlarga zarar yetkazish xavfi bo‘lsa, kirishni cheklash, to‘xtatish yoki tugatishimiz mumkin. Siz faol billing majburiyatlarini hisobga olgan holda Skedwoo’dan foydalanishni istalgan vaqtda to‘xtatishingiz mumkin.'],
['Intellektual mulk','Skedwoo dasturi, brendi, interfeysi, dizayni va tegishli materiallar Skedwoo yoki uning huquq egalariga tegishli. Qonunda ruxsat berilmagan hollarda ularni nusxalash, sotish, teskari muhandislik qilish yoki tarqatish mumkin emas. Biznes Skedwoo’ga yuklagan kontent va ma’lumotlar uchun o‘zi javobgardir.'],
['Kafolatlar va javobgarlik chegarasi','Skedwoo bronlash va biznes boshqaruvi uchun dasturiy vositalarni taqdim etadi. Skedwoo bizneslar ko‘rsatadigan xizmatlarning sifati, xavfsizligi, qonuniyligi yoki natijasini kafolatlamaydi. Qonunda ruxsat etilgan darajada, Skedwoo biznes va mijoz o‘rtasidagi nizolar yoki Skedwoo nazoratidan tashqaridagi hodisalardan kelib chiqadigan bilvosita zararlar uchun javob bermaydi.'],
['Shartlardagi o‘zgarishlar','Xizmat, narx tuzilmasi, qonuniy yoki operatsion talablar o‘zgarganda ushbu Shartlarni yangilashimiz mumkin. Muhim o‘zgarishlar yangi amal qilish sanasi bilan e’lon qilinadi. Yangilangan Shartlar kuchga kirgandan keyin Skedwoo’dan foydalanishni davom ettirish, qonunda ruxsat etilgan hollarda, ularni qabul qilishni anglatadi.'],
['Aloqa','Ushbu Shartlar, hisob yoki Skedwoo bo‘yicha savollar uchun qo‘llab-quvvatlash xizmatiga murojaat qiling.']
]},
tr:{back:'Skedwoo’ye dön',title:'Kullanım Şartları',intro:'Bu Şartlar, web sitesi, hesap çalışma alanı ve Telegram Mini App dahil olmak üzere Skedwoo’ye erişimi ve kullanımı düzenler.',effective:'18 Eylül 2026 itibarıyla geçerlidir',support:'Skedwoo Destek',rules:[
['Şartların kabulü','Hesap oluşturarak, Telegram’ı bağlayarak, abonelik satın alarak veya Skedwoo’yi başka şekilde kullanarak bu Şartları kabul edersiniz. Skedwoo’yi bir işletme veya kuruluş adına kullanıyorsanız, onun adına hareket etmeye yetkili olduğunuzu onaylarsınız.'],
['Hesaplar ve erişim','Hesap bilgilerinizin doğruluğundan ve giriş bilgilerinizin güvenliğinden siz sorumlusunuz. Doğrulama kodlarını paylaşmayın ve Skedwoo hesabınıza veya bağlı Telegram hesabınıza yetkisiz erişime bilerek izin vermeyin.'],
['İşletme bilgileri ve sorumluluk','İşletme sahipleri ad, hizmetler, fiyatlar, uzmanlar, program, uygunluk ve müşterilere gösterilen diğer bilgilerin doğruluğundan sorumludur. Skedwoo rezervasyon araçları sağlar ancak işletmenin kendisini yönetmez.'],
['Kabul edilebilir kullanım','Skedwoo yalnızca yasal hizmetler ve meşru işletme faaliyeti için kullanılabilir. Dolandırıcılık, yasa dışı hizmetler, taciz, spam, kötü amaçlı faaliyet, yanıltıcı içerik ve hizmete müdahale girişimleri yasaktır.'],
['Rezervasyonlar, değişiklikler ve iptaller','İşletmeler yayımladıkları uygunluk ve rezervasyon koşullarına uymaktan ve değişiklik veya iptalleri müşterilere bildirmekten sorumludur. Müşteriler doğru rezervasyon bilgileri vermeli ve işletmenin belirlediği koşullara uymalıdır. Skedwoo, işletme ile müşteri arasındaki hizmet işleminin tarafı değildir.'],
['Müşteri verileri','Rezervasyon sırasında müşteri adını ve telefon numarasını girebilir. Bu bilgiler yalnızca ilgili rezervasyonun işlenmesi ve yönetilmesi için seçilen işletmeye gösterilir. Skedwoo, müşterinin rezervasyon sırasında kendisinin girdiği bilgiler dışında işletmeye ek kişisel müşteri verisi sağlamaz.'],
['Abonelikler, deneme ve hizmet limitleri','Skedwoo ücretli abonelikler, hizmet limiti paketleri ve belirtildiği durumlarda sınırlı ücretsiz deneme sunabilir. Deneme uygunluğu, faturalandırma dönemi, dahil edilen limitler ve güncel fiyatlar satın alma sırasında Skedwoo web sitesinde gösterilir.'],
['Ödemeler, yenileme ve iptal','Ödemeler Paddle tarafından işlenir. Ücretli abonelik, kullanıcı iptal edene kadar seçilen plana göre bir sonraki faturalandırma dönemi için otomatik olarak yenilenir. Gelecekteki yenilemeyi mevcut faturalandırma kontrolleri üzerinden iptal edebilirsiniz. İptalden sonra otomatik yenileme durur. İptal, tamamlanmış bir faturalandırma dönemi için otomatik iade oluşturmaz.'],
['İadeler ve ödeme uyuşmazlıkları','İadeler, chargeback işlemleri ve ödeme uyuşmazlıkları geçerli hukuk ile Paddle’ın politika ve prosedürlerine göre ele alınır. Zorunlu tüketici hakları uygulanıyorsa bu Şartlar söz konusu hakları ortadan kaldırmaz.'],
['Skedwoo’nin kullanılabilirliği ve değişiklikler','Skedwoo’yi güvenilir tutmayı hedefleriz ancak kesintisiz veya hatasız çalışmayı garanti etmeyiz. Güvenlik, güvenilirlik, yasal uyum veya ürün geliştirme için makul ölçüde gerekli olduğunda bakım yapabilir, özellikleri değiştirebilir, ekleyebilir veya kaldırabiliriz.'],
['Askıya alma ve sona erdirme','Bir hesap bu Şartları veya geçerli hukuku ihlal ederse, güvenlik ya da kötüye kullanım riski yaratırsa veya Skedwoo, kullanıcılar ya da üçüncü taraflar için tehdit oluşturursa erişimi kısıtlayabilir, askıya alabilir veya sonlandırabiliriz. Aktif faturalandırma yükümlülüklerine tabi olarak Skedwoo kullanımını istediğiniz zaman bırakabilirsiniz.'],
['Fikri mülkiyet','Skedwoo yazılımı, markası, arayüzü, tasarımı ve ilgili materyaller Skedwoo’ye veya lisans verenlerine aittir. Kanunun izin verdiği durumlar dışında kopyalanamaz, satılamaz, tersine mühendislik yapılamaz veya yeniden dağıtılamaz. İşletmeler Skedwoo’ye yükledikleri içerik ve bilgilerden sorumludur.'],
