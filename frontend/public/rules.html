en:{back:'Back to Bookly',title:'Terms of Use',intro:'These Terms govern access to and use of Bookly, including the website, account workspace and Telegram Mini App.',effective:'Effective: September 18, 2026',support:'Bookly Support',rules:[

['Accounts and eligibility','You are responsible for providing accurate account information and keeping your login credentials secure. You must not share authentication codes or knowingly allow unauthorized access to your Bookly account or connected Telegram account.'],
['Business information and responsibilities','Business owners are responsible for the accuracy of business names, services, prices, specialists, schedules, availability and other information shown to customers. Bookly provides booking tools but does not operate or control the underlying business.'],
['Acceptable use','Bookly may only be used for lawful services and legitimate business activity. You must not use Bookly for fraud, scams, unlawful services, harassment, spam, malicious activity, deceptive content or attempts to interfere with the service.'],
['Bookings, changes and cancellations','Businesses are responsible for honoring the availability and booking conditions they publish and for communicating changes or cancellations. Customers are responsible for providing accurate booking information and following any conditions set by the business. Bookly is not a party to the service transaction between a business and its customer.'],
['Customer data','When booking, a customer may provide a name and phone number. This information is made available to the selected business only to process and manage that booking. Bookly does not provide the business with additional personal customer data beyond what the customer enters during booking.'],
['Subscriptions, trials and service limits','Bookly may offer paid subscriptions, service-limit packages and, where stated, a limited free trial. Trial eligibility, billing periods, included limits and current prices are shown on the Bookly website at the time of purchase. Features and limits may differ between plans.'],
['Payments, renewals and cancellation','Payments are processed by Paddle. A paid subscription automatically renews for the next billing period according to the selected plan until it is cancelled. You can cancel future renewal through the available billing controls. Cancellation stops future billing and does not automatically create a refund for a completed billing period.'],
['Refunds and payment disputes','Refunds, chargebacks and payment disputes are handled in accordance with applicable law and the policies and procedures of Paddle. Where a mandatory consumer right applies, those rights are not excluded by these Terms.'],
['Availability and changes to Bookly','We aim to keep Bookly available and reliable, but uninterrupted or error-free operation is not guaranteed. We may maintain, modify, add or remove features where reasonably necessary for security, reliability, legal compliance or product development.'],
['Suspension and termination','We may restrict, suspend or terminate access where an account violates these Terms, applicable law, creates security or abuse risks, or threatens Bookly, its users or third parties. You may stop using Bookly at any time, subject to any active billing obligations.'],
['Intellectual property','Bookly software, branding, interface, design and related materials are owned by Bookly or its licensors and may not be copied, sold, reverse engineered or redistributed except where permitted by law. Businesses retain responsibility for content and information they upload to Bookly.'],
['Disclaimers and limitation of responsibility','Bookly provides software tools for booking and business management. Bookly does not guarantee the quality, safety, legality or performance of services provided by businesses using the platform. To the extent permitted by law, Bookly is not responsible for indirect losses arising from disputes between businesses and customers or from events outside Bookly’s reasonable control.'],
['Changes to these Terms','We may update these Terms when the service, pricing structure, legal requirements or operational needs change. Material updates will be published with a new effective date. Continued use of Bookly after updated Terms take effect constitutes acceptance where permitted by law.'],
['Contact','For questions about these Terms, your account or Bookly, contact the support team.']

ru:{back:'Назад в Bookly',title:'Условия использования',intro:'Эти Условия регулируют доступ к Bookly и его использование, включая сайт, кабинет аккаунта и Telegram Mini App.',effective:'Действует с 18 сентября 2026',support:'Поддержка Bookly',rules:[

['Подписки, пробный период и лимиты','Bookly может предлагать платные подписки, пакеты лимитов услуг и, когда это указано, ограниченный бесплатный пробный период. Право на пробный период, период оплаты, включённые лимиты и актуальные цены отображаются на сайте Bookly во время покупки.'],
['Оплата, продление и отмена','Платежи обрабатываются через Paddle. Платная подписка автоматически продлевается на следующий платёжный период в соответствии с выбранным тарифом, пока пользователь не отменит её. Будущее продление можно отменить через доступные инструменты биллинга. После отмены автоматическое продление прекращается. Отмена не означает автоматический возврат средств за уже оплаченный период.'],
['Возвраты и платёжные споры','Возвраты, чарджбэки и платёжные споры рассматриваются в соответствии с применимым законодательством и процедурами Paddle. Если закон предоставляет обязательные права потребителю, эти Условия их не отменяют.'],
['Доступность и изменения Bookly','Мы стремимся поддерживать стабильную работу Bookly, но не гарантируем отсутствие перерывов или ошибок. Мы можем проводить обслуживание, изменять, добавлять или удалять функции, когда это разумно необходимо для безопасности, стабильности, соблюдения закона или развития продукта.'],
['Ограничение и прекращение доступа','Мы можем ограничить, приостановить или прекратить доступ, если аккаунт нарушает Условия или закон, создаёт угрозу безопасности, используется для злоупотреблений или представляет риск для Bookly, пользователей или третьих лиц. Вы можете прекратить использование Bookly в любое время с учётом действующих платёжных обязательств.'],
['Интеллектуальная собственность','Программное обеспечение, бренд, интерфейс, дизайн и связанные материалы Bookly принадлежат Bookly или его правообладателям. Их нельзя копировать, продавать, декомпилировать или распространять иначе, чем разрешено законом. Бизнес отвечает за контент и данные, которые он загружает в Bookly.'],
['Отказ от гарантий и предел ответственности','Bookly предоставляет программные инструменты для записи и управления бизнесом. Bookly не гарантирует качество, безопасность, законность или результат услуг, оказываемых бизнесами. В пределах, разрешённых законом, Bookly не отвечает за косвенные убытки из-за споров между бизнесом и клиентом или событий вне разумного контроля Bookly.'],

['Контакты','По вопросам этих Условий, аккаунта или Bookly обратитесь в поддержку.']

uz:{back:'Bookly’ga qaytish',title:'Foydalanish shartlari',intro:'Ushbu Shartlar Bookly, jumladan sayt, hisob kabineti va Telegram Mini App’dan foydalanishni tartibga soladi.',effective:'2026-yil 18-sentabrdan amal qiladi',support:'Bookly qo‘llab-quvvatlashi',rules:[
['Shartlarni qabul qilish','Hisob yaratish, Telegram’ni ulash, obuna sotib olish yoki Bookly’dan boshqa tarzda foydalanish orqali siz ushbu Shartlarga rozilik bildirasiz. Agar Bookly’dan biznes yoki tashkilot nomidan foydalansangiz, uning nomidan harakat qilish vakolatiga ega ekaningizni tasdiqlaysiz.'],
['Hisob va kirish','Hisob ma’lumotlarining to‘g‘riligi va kirish ma’lumotlarining xavfsizligi uchun siz javobgarsiz. Autentifikatsiya kodlarini ulashmang va Bookly yoki ulangan Telegram hisobiga ruxsatsiz kirishga yo‘l qo‘ymang.'],
['Biznes ma’lumotlari va javobgarlik','Biznes egasi nom, xizmatlar, narxlar, mutaxassislar, jadval, mavjud vaqtlar va mijozlarga ko‘rsatiladigan boshqa ma’lumotlarning to‘g‘riligi uchun javobgardir. Bookly bronlash vositalarini beradi, lekin biznesning o‘zini boshqarmaydi.'],
['Ruxsat etilgan foydalanish','Bookly faqat qonuniy xizmatlar va qonuniy biznes faoliyati uchun ishlatilishi mumkin. Firibgarlik, noqonuniy xizmatlar, tahdid, spam, zararli faoliyat, chalg‘ituvchi kontent va xizmat ishiga xalaqit berishga urinish taqiqlanadi.'],
['Bronlar, o‘zgarishlar va bekor qilish','Biznes e’lon qilgan mavjud vaqtlar va bron shartlariga rioya qilish hamda o‘zgarish yoki bekor qilish haqida mijozlarga xabar berish uchun javobgardir. Mijoz bron ma’lumotlarining to‘g‘riligi va biznes shartlariga rioya qilish uchun javobgardir. Bookly biznes va mijoz o‘rtasidagi xizmat bitimining tomoni emas.'],
['Mijoz ma’lumotlari','Bron qilishda mijoz ism va telefon raqamini kiritishi mumkin. Bu ma’lumotlar faqat shu bronni qayta ishlash va boshqarish uchun tanlangan biznesga ko‘rsatiladi. Bookly mijoz bron vaqtida o‘zi kiritgan ma’lumotlardan tashqari biznesga qo‘shimcha shaxsiy ma’lumot bermaydi.'],
['Obunalar, sinov muddati va limitlar','Bookly pullik obunalar, xizmat limitlari paketlari va ko‘rsatilgan hollarda cheklangan bepul sinov muddatini taklif qilishi mumkin. Sinov huquqi, billing davri, kiritilgan limitlar va amaldagi narxlar xarid vaqtida Bookly saytida ko‘rsatiladi.'],
['To‘lov, uzaytirish va bekor qilish','To‘lovlar Paddle orqali qayta ishlanadi. Pullik obuna foydalanuvchi uni bekor qilmaguncha tanlangan tarifga muvofiq keyingi billing davriga avtomatik ravishda uzaytiriladi. Kelajakdagi uzaytirishni mavjud billing vositalari orqali bekor qilish mumkin. Bekor qilingandan so‘ng avtomatik uzaytirish to‘xtaydi. Bekor qilish avval to‘langan davr uchun avtomatik pul qaytarishni anglatmaydi.'],
['Qaytarish va to‘lov nizolari','Pulni qaytarish, chargeback va to‘lov nizolari amaldagi qonunchilik hamda Paddle siyosatlari va tartiblariga muvofiq ko‘rib chiqiladi. Qonunda majburiy iste’molchi huquqlari mavjud bo‘lsa, ushbu Shartlar ularni bekor qilmaydi.'],
['Bookly mavjudligi va o‘zgarishlar','Bookly’ni barqaror ishlatishga harakat qilamiz, ammo uzluksiz yoki xatosiz ishlashni kafolatlamaymiz. Xavfsizlik, barqarorlik, qonuniy talablar yoki mahsulot rivoji uchun zarur bo‘lganda xizmatni texnik xizmatdan o‘tkazish, o‘zgartirish, funksiyalar qo‘shish yoki olib tashlashimiz mumkin.'],
['Kirishni cheklash va tugatish','Hisob ushbu Shartlar yoki qonunni buzsa, xavfsizlik yoki suiiste’mol xavfi tug‘dirsa yoki Bookly, foydalanuvchilar yoki uchinchi tomonlarga zarar yetkazish xavfi bo‘lsa, kirishni cheklash, to‘xtatish yoki tugatishimiz mumkin. Siz faol billing majburiyatlarini hisobga olgan holda Bookly’dan foydalanishni istalgan vaqtda to‘xtatishingiz mumkin.'],
['Intellektual mulk','Bookly dasturi, brendi, interfeysi, dizayni va tegishli materiallar Bookly yoki uning huquq egalariga tegishli. Qonunda ruxsat berilmagan hollarda ularni nusxalash, sotish, teskari muhandislik qilish yoki tarqatish mumkin emas. Biznes Bookly’ga yuklagan kontent va ma’lumotlar uchun o‘zi javobgardir.'],
['Kafolatlar va javobgarlik chegarasi','Bookly bronlash va biznes boshqaruvi uchun dasturiy vositalarni taqdim etadi. Bookly bizneslar ko‘rsatadigan xizmatlarning sifati, xavfsizligi, qonuniyligi yoki natijasini kafolatlamaydi. Qonunda ruxsat etilgan darajada, Bookly biznes va mijoz o‘rtasidagi nizolar yoki Bookly nazoratidan tashqaridagi hodisalardan kelib chiqadigan bilvosita zararlar uchun javob bermaydi.'],
['Shartlardagi o‘zgarishlar','Xizmat, narx tuzilmasi, qonuniy yoki operatsion talablar o‘zgarganda ushbu Shartlarni yangilashimiz mumkin. Muhim o‘zgarishlar yangi amal qilish sanasi bilan e’lon qilinadi. Yangilangan Shartlar kuchga kirgandan keyin Bookly’dan foydalanishni davom ettirish, qonunda ruxsat etilgan hollarda, ularni qabul qilishni anglatadi.'],
['Aloqa','Ushbu Shartlar, hisob yoki Bookly bo‘yicha savollar uchun qo‘llab-quvvatlash xizmatiga murojaat qiling.']
]},
tr:{back:'Bookly’ye dön',title:'Kullanım Şartları',intro:'Bu Şartlar, web sitesi, hesap çalışma alanı ve Telegram Mini App dahil olmak üzere Bookly’ye erişimi ve kullanımı düzenler.',effective:'18 Eylül 2026 itibarıyla geçerlidir',support:'Bookly Destek',rules:[
['Şartların kabulü','Hesap oluşturarak, Telegram’ı bağlayarak, abonelik satın alarak veya Bookly’yi başka şekilde kullanarak bu Şartları kabul edersiniz. Bookly’yi bir işletme veya kuruluş adına kullanıyorsanız, onun adına hareket etmeye yetkili olduğunuzu onaylarsınız.'],
['Hesaplar ve erişim','Hesap bilgilerinizin doğruluğundan ve giriş bilgilerinizin güvenliğinden siz sorumlusunuz. Doğrulama kodlarını paylaşmayın ve Bookly hesabınıza veya bağlı Telegram hesabınıza yetkisiz erişime bilerek izin vermeyin.'],
['İşletme bilgileri ve sorumluluk','İşletme sahipleri ad, hizmetler, fiyatlar, uzmanlar, program, uygunluk ve müşterilere gösterilen diğer bilgilerin doğruluğundan sorumludur. Bookly rezervasyon araçları sağlar ancak işletmenin kendisini yönetmez.'],
['Kabul edilebilir kullanım','Bookly yalnızca yasal hizmetler ve meşru işletme faaliyeti için kullanılabilir. Dolandırıcılık, yasa dışı hizmetler, taciz, spam, kötü amaçlı faaliyet, yanıltıcı içerik ve hizmete müdahale girişimleri yasaktır.'],
['Rezervasyonlar, değişiklikler ve iptaller','İşletmeler yayımladıkları uygunluk ve rezervasyon koşullarına uymaktan ve değişiklik veya iptalleri müşterilere bildirmekten sorumludur. Müşteriler doğru rezervasyon bilgileri vermeli ve işletmenin belirlediği koşullara uymalıdır. Bookly, işletme ile müşteri arasındaki hizmet işleminin tarafı değildir.'],
['Müşteri verileri','Rezervasyon sırasında müşteri adını ve telefon numarasını girebilir. Bu bilgiler yalnızca ilgili rezervasyonun işlenmesi ve yönetilmesi için seçilen işletmeye gösterilir. Bookly, müşterinin rezervasyon sırasında kendisinin girdiği bilgiler dışında işletmeye ek kişisel müşteri verisi sağlamaz.'],
['Abonelikler, deneme ve hizmet limitleri','Bookly ücretli abonelikler, hizmet limiti paketleri ve belirtildiği durumlarda sınırlı ücretsiz deneme sunabilir. Deneme uygunluğu, faturalandırma dönemi, dahil edilen limitler ve güncel fiyatlar satın alma sırasında Bookly web sitesinde gösterilir.'],
['Ödemeler, yenileme ve iptal','Ödemeler Paddle tarafından işlenir. Ücretli abonelik, kullanıcı iptal edene kadar seçilen plana göre bir sonraki faturalandırma dönemi için otomatik olarak yenilenir. Gelecekteki yenilemeyi mevcut faturalandırma kontrolleri üzerinden iptal edebilirsiniz. İptalden sonra otomatik yenileme durur. İptal, tamamlanmış bir faturalandırma dönemi için otomatik iade oluşturmaz.'],
['İadeler ve ödeme uyuşmazlıkları','İadeler, chargeback işlemleri ve ödeme uyuşmazlıkları geçerli hukuk ile Paddle’ın politika ve prosedürlerine göre ele alınır. Zorunlu tüketici hakları uygulanıyorsa bu Şartlar söz konusu hakları ortadan kaldırmaz.'],
['Bookly’nin kullanılabilirliği ve değişiklikler','Bookly’yi güvenilir tutmayı hedefleriz ancak kesintisiz veya hatasız çalışmayı garanti etmeyiz. Güvenlik, güvenilirlik, yasal uyum veya ürün geliştirme için makul ölçüde gerekli olduğunda bakım yapabilir, özellikleri değiştirebilir, ekleyebilir veya kaldırabiliriz.'],
['Askıya alma ve sona erdirme','Bir hesap bu Şartları veya geçerli hukuku ihlal ederse, güvenlik ya da kötüye kullanım riski yaratırsa veya Bookly, kullanıcılar ya da üçüncü taraflar için tehdit oluşturursa erişimi kısıtlayabilir, askıya alabilir veya sonlandırabiliriz. Aktif faturalandırma yükümlülüklerine tabi olarak Bookly kullanımını istediğiniz zaman bırakabilirsiniz.'],
['Fikri mülkiyet','Bookly yazılımı, markası, arayüzü, tasarımı ve ilgili materyaller Bookly’ye veya lisans verenlerine aittir. Kanunun izin verdiği durumlar dışında kopyalanamaz, satılamaz, tersine mühendislik yapılamaz veya yeniden dağıtılamaz. İşletmeler Bookly’ye yükledikleri içerik ve bilgilerden sorumludur.'],
['Feragatler ve sorumluluğun sınırı','Bookly rezervasyon ve işletme yönetimi için yazılım araçları sağlar. Bookly, platformu kullanan işletmelerin sunduğu hizmetlerin kalitesini, güvenliğini, yasallığını veya sonucunu garanti etmez. Kanunun izin verdiği ölçüde Bookly, işletmeler ile müşteriler arasındaki uyuşmazlıklardan veya Bookly’nin makul kontrolü dışındaki olaylardan doğan dolaylı zararlardan sorumlu değildir.'],
['Bu Şartlardaki değişiklikler','Hizmet, fiyatlandırma yapısı, yasal gereklilikler veya operasyonel ihtiyaçlar değiştiğinde bu Şartları güncelleyebiliriz. Önemli güncellemeler yeni bir yürürlük tarihi ile yayımlanacaktır. Güncellenmiş Şartlar yürürlüğe girdikten sonra Bookly kullanımına devam etmek, hukuken izin verildiği ölçüde kabul anlamına gelir.'],

['توفر Bookly والتغييرات','نسعى للحفاظ على Bookly موثوقًا، لكننا لا نضمن التشغيل المتواصل أو الخالي من الأخطاء. قد نجري صيانة أو نغيّر أو نضيف أو نزيل ميزات عندما يكون ذلك ضروريًا بشكل معقول للأمان أو الموثوقية أو الامتثال القانوني أو تطوير المنتج.'],
