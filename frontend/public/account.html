<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f8fa">
<title>Bookly — Account</title>
<style>
html,body{margin:0;min-height:100%;background:#f7f8fa}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.loader{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f7f8fa;color:#111}.loader-mark{width:52px;height:52px;border-radius:16px;background:#111;color:#fff;display:grid;place-items:center;font-weight:850;font-size:22px;box-shadow:0 16px 35px rgba(17,19,24,.12)}
</style>
</head>
<body><div class="loader"><div class="loader-mark">B</div></div>
<script>
(async function(){
  try{
    var response=await fetch('account-core.html',{cache:'no-store'});
    if(!response.ok)throw new Error('Unable to load account workspace');
    var html=await response.text();
    var polish=`<style>
      body.logged-in{background:#fff!important;position:relative!important}
      body.logged-in::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 92% 7%,rgba(91,92,240,.11),transparent 24%),radial-gradient(circle at 7% 92%,rgba(139,124,255,.08),transparent 22%);z-index:0}
      body.logged-in .page{position:relative;z-index:1}
      body.logged-in .nav{max-width:1160px;height:82px;padding:0;margin:auto}
      body.logged-in .brand{font-size:24px;letter-spacing:-.06em;color:#111318}
      body.logged-in .nav-link{display:inline-flex;align-items:center;padding:11px 15px;border-radius:12px;color:#555c68;background:transparent;border:1px solid transparent;font-size:14px;font-weight:750;transition:.2s ease}
      body.logged-in .nav-link:hover{background:#f5f6f8;border-color:#e4e7ec;color:#111318}
      body.logged-in .shell{width:min(1160px,calc(100% - 40px));max-width:none;padding:42px 0 70px;margin:auto}
      body.logged-in .workspace-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin:0 0 24px;padding:0 2px}
      body.logged-in .workspace-kicker{color:#5b5cf0;font-size:9px;font-weight:850;letter-spacing:.14em;margin-bottom:8px}
      body.logged-in .workspace-head h2{font-size:46px;letter-spacing:-.06em;margin:0;color:#111318}
      body.logged-in .workspace-head p{max-width:700px;font-size:14px;color:#69717e;margin:8px 0 0}
      body.logged-in .ready{padding:9px 13px;border:1px solid #dce9df;border-radius:999px;background:#f4faf5;color:#397044;font-size:11px;font-weight:800;white-space:nowrap}
      body.logged-in .workspace-nav{display:flex;gap:4px;margin:0 0 20px;padding:5px;border-radius:16px;background:#f0f2f5;border:1px solid #e4e7ec;box-shadow:0 6px 20px rgba(17,19,24,.04)}
      body.logged-in .workspace-nav-item{min-height:46px;border-radius:11px;font-size:12px;font-weight:800;transition:.2s ease;background:transparent;color:#707680}
      body.logged-in .workspace-nav-item:hover{background:#fafbfc;color:#111318}
      body.logged-in .workspace-nav-item.active{background:#111318;color:#fff;box-shadow:0 8px 18px rgba(17,19,24,.13)}
      body.logged-in .workspace-grid{display:block!important;width:100%}
      body.logged-in .workspace-card{padding:27px;border-radius:24px;background:rgba(255,255,255,.95);border:1px solid #e4e7ec;box-shadow:0 18px 55px rgba(17,19,24,.055)}
      body.logged-in #overviewView.active{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
      body.logged-in #overviewView .account-details{grid-column:1/-1}
      body.logged-in #overviewView .workspace-card:first-child{background:linear-gradient(135deg,#fff,#f7f7fb)}
      body.logged-in #overviewView .workspace-card:nth-child(2){background:#111318;border-color:#111318;color:#fff}
      body.logged-in #overviewView .workspace-card:nth-child(2) h3{color:#fff}
      body.logged-in #overviewView .workspace-card:nth-child(2) p{color:#aeb3bd}
      body.logged-in #overviewView .workspace-card:nth-child(2) .card-label{color:#9ea4ff}
      body.logged-in button.primary{height:52px;border-radius:13px;background:#111318;font-size:13px;box-shadow:0 10px 24px rgba(17,19,24,.10)}
      body.logged-in #overviewView .workspace-card:nth-child(2) button.primary{background:#5b5cf0;box-shadow:0 12px 28px rgba(91,92,240,.24)}
      body.logged-in .detail-row{min-height:56px;border-top:1px solid #edf0f2;margin:0;padding:0}
      body.logged-in .businesses-card,body.logged-in .billing-card{background:linear-gradient(135deg,#fff,#f7f7fb)}
      body.logged-in .business-item{border-radius:15px;background:#fff;border-color:#e5e8ed;box-shadow:0 6px 18px rgba(17,19,24,.025)}
      body.logged-in .business-item.is-current{box-shadow:0 10px 24px rgba(17,19,24,.06);border-color:#d8dce5}
      body.logged-in .business-select{border-radius:11px}
      body.logged-in .profile-support-card{grid-column:1/-1;margin-top:0;background:linear-gradient(135deg,#fff,#f7f7fb)!important}
      body.logged-in .profile-support-head{display:flex;align-items:center;gap:14px}
      body.logged-in .profile-support-avatar{width:52px;height:52px;border-radius:16px;background:#111318;color:#fff;display:grid;place-items:center;font-size:22px;font-weight:850;box-shadow:0 10px 22px rgba(17,19,24,.10)}
      body.logged-in .profile-support-card h3{font-size:23px;letter-spacing:-.04em;margin:3px 0 5px}
      body.logged-in .profile-support-card p{margin:0;color:#69717e;font-size:13px;line-height:1.55}
      body.logged-in .profile-support-email{margin-top:20px;padding-top:16px;border-top:1px solid #edf0f2;font-size:12px;color:#777e87}
      body.logged-in .profile-support-email a{color:#111318;font-weight:800;text-decoration:none}
      body.logged-in .profile-support-links{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
      body.logged-in .profile-support-links a{display:flex;align-items:center;justify-content:center;min-height:44px;padding:0 12px;border:1px solid #dfe3e8;border-radius:12px;background:#fff;color:#17191d;text-decoration:none;font-size:11px;font-weight:800;transition:.15s ease}
      body.logged-in .profile-support-links a:hover{background:#f5f6f8;border-color:#cfd4da}
      body.logged-in .profile-support-note{margin-top:12px!important;color:#9298a1!important;font-size:11px!important}
      body.logged-in .foot{margin-top:30px;color:#9298a1}
      body.logged-in .foot a{color:#69717e;text-decoration:none}
      @media(max-width:820px){body.logged-in .shell{width:min(100% - 28px,720px)}body.logged-in .workspace-head h2{font-size:38px}body.logged-in #overviewView.active{grid-template-columns:1fr!important}body.logged-in #overviewView .account-details,body.logged-in .profile-support-card{grid-column:auto}.profile-support-links{grid-template-columns:1fr 1fr!important}}
      @media(max-width:560px){body.logged-in .nav{height:70px;padding:0 18px}body.logged-in .shell{width:calc(100% - 24px);padding-top:24px}body.logged-in .workspace-head{display:block;margin-bottom:16px}body.logged-in .workspace-head h2{font-size:32px}body.logged-in .workspace-head p{font-size:12px}body.logged-in .ready{display:inline-flex;margin-top:12px}body.logged-in .workspace-nav{border-radius:14px}body.logged-in .workspace-nav-item{min-height:40px;padding:0 6px;font-size:10px}body.logged-in .workspace-card{padding:20px;border-radius:19px}.profile-support-links{grid-template-columns:1fr!important}}
    </style>`;
    var injected=`<script>(function(){function enhance(){try{var view=document.getElementById('overviewView');if(view&&!document.getElementById('profileSupportCard')){var card=document.createElement('section');card.id='profileSupportCard';card.className='workspace-card profile-support-card';card.innerHTML='<div class="profile-support-head"><div class="profile-support-avatar">B</div><div><span class="card-label">PROFILE &amp; SUPPORT</span><h3>Bookly profile</h3><p>Your account, legal information and support.</p></div></div><div class="profile-support-email">Support email: <a href="mailto:booklyminiapp@gmail.com">booklyminiapp@gmail.com</a></div><div class="profile-support-links"><a href="rules.html" target="_blank" rel="noreferrer">Rules of use</a><a href="privacy.html" target="_blank" rel="noreferrer">Privacy</a><a href="mailto:booklyminiapp@gmail.com">Contact support</a></div><p class="profile-support-note">Use Bookly only for legitimate business activity. Full rules and privacy information are available separately.</p>';view.appendChild(card)}var foot=document.querySelector('.foot');if(foot){foot.innerHTML='Bookly · Simple online booking · <a href="landing.html">Learn more</a> · <a href="rules.html" target="_blank" rel="noreferrer">Rules</a> · <a href="privacy.html" target="_blank" rel="noreferrer">Privacy</a> · <a href="mailto:booklyminiapp@gmail.com">Contact</a>'}}catch(e){}}if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',enhance)}else{enhance()}setInterval(enhance,1200)})();<\/script>`;
    html=html.replace('</head>',polish+'\n</head>');
    html=html.replace('</body>',injected+'\n</body>');
    document.open();document.write(html);document.close();
  }catch(error){
    document.body.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;font-family:system-ui;color:#555">Unable to load Bookly account.</div>';
  }
})();
</script>
</body>
</html>
