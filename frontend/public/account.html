<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#f6f5fb">
    <title>Bookly — Account</title>
    <link rel="stylesheet" href="/account-loader.css">
  </head>
  <body class="bookly-loader-page">
    <main class="wake-shell" id="wakeShell" hidden>
      <div class="wake-glow wake-glow-one" aria-hidden="true"></div>
      <div class="wake-glow wake-glow-two" aria-hidden="true"></div>

      <section class="wake-layout" aria-labelledby="wakeTitle">
        <div class="wake-copy">
          <a class="wake-brand" href="/landing.html" aria-label="Bookly home">
            <span class="wake-brand-mark">B</span>
            <span>BOOKLY</span>
          </a>

          <div class="wake-kicker" id="wakeKicker">BOOKLY WORKSPACE</div>
          <h1 id="wakeTitle">Preparing Bookly</h1>
          <p class="wake-status" id="wakeStatus" role="status" aria-live="polite">
            Loading Bookly…
          </p>

          <div class="wake-progress" aria-hidden="true"><span></span></div>

          <button class="wake-retry" id="wakeRetry" type="button" hidden>
            Try again
          </button>
        </div>

        <div class="booking-demo" aria-hidden="true">
          <div class="booking-demo-top">
            <span class="booking-demo-brand">BOOKLY</span>
            <span class="booking-demo-live">
              <i></i>
              <span id="demoLive">Loading</span>
            </span>
          </div>

          <div class="booking-demo-body">
            <div class="booking-demo-rail">
              <span></span><span></span><span></span><span></span><span></span>
            </div>

            <div class="booking-scene booking-scene-service">
              <div class="scene-icon scene-icon-purple">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M5 7.5h14M5 12h9M5 16.5h6" stroke-linecap="round"/>
                </svg>
              </div>
              <div class="scene-copy">
                <small id="demoServiceLabel">SERVICE</small>
                <strong id="demoService">Choose a service</strong>
                <span id="demoDuration">45 min</span>
              </div>
              <div class="scene-check">✓</div>
            </div>

            <div class="booking-scene booking-scene-specialist">
              <div class="scene-avatar">A</div>
              <div class="scene-copy">
                <small id="demoSpecialistLabel">SPECIALIST</small>
                <strong id="demoSpecialist">Available specialist</strong>
                <span id="demoAvailable">Available today</span>
              </div>
              <div class="scene-status-dot"></div>
            </div>

            <div class="booking-scene booking-scene-date">
              <div class="mini-calendar">
                <span>18</span><span>19</span><span class="selected">20</span><span>21</span><span>22</span>
              </div>
              <div class="scene-copy scene-copy-centered">
                <small id="demoDateLabel">DATE</small>
                <strong id="demoDate">Choose a date</strong>
              </div>
            </div>

            <div class="booking-scene booking-scene-time">
              <div class="scene-copy scene-copy-wide">
                <small id="demoTimeLabel">AVAILABLE TIME</small>
                <strong id="demoTime">Choose a time</strong>
                <div class="time-chips">
                  <span>09:30</span><span class="selected">10:30</span><span>11:15</span>
                </div>
              </div>
            </div>

            <div class="booking-scene booking-scene-success">
              <div class="success-ring"><span>✓</span></div>
              <div class="scene-copy scene-copy-centered">
                <small>BOOKLY</small>
                <strong id="demoConfirmed">Booking confirmed</strong>
                <span id="demoReady">Everything is ready</span>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="/account-loader.js"></script>
  </body>
</html>
