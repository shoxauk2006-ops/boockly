<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bookly Account</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#f6f7f9}
*{box-sizing:border-box}body{margin:0;min-height:100vh}.wrap{max-width:520px;margin:0 auto;padding:48px 18px}.brand{text-align:center;font-weight:900;letter-spacing:.14em;font-size:14px;margin-bottom:10px}h1{text-align:center;margin:0;font-size:32px}.sub{text-align:center;color:#707780;line-height:1.5;margin:10px 0 24px}.card{background:#fff;border:1px solid #e4e7eb;border-radius:22px;padding:22px;box-shadow:0 12px 35px rgba(17,17,17,.06)}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#f1f3f5;padding:5px;border-radius:14px;margin-bottom:20px}.tabs button{border:0;background:transparent;border-radius:10px;padding:11px;font:inherit;font-weight:700;cursor:pointer}.tabs button.active{background:#111;color:#fff}label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}input{width:100%;border:1px solid #d9dde2;border-radius:12px;padding:13px;font:inherit}button.primary{width:100%;border:0;border-radius:13px;background:#111;color:#fff;padding:14px;font:inherit;font-weight:800;cursor:pointer;margin-top:18px}button.primary:disabled{opacity:.5;cursor:not-allowed}.error{background:#fff0f0;border:1px solid #ffd4d4;color:#a40000;padding:12px;border-radius:12px;margin-top:14px;line-height:1.4}.account{display:none}.account p{color:#626a73}.link{border:1px solid #dfe3e7;background:#fff;border-radius:12px;padding:13px;width:100%;font:inherit;font-weight:700;cursor:pointer;margin-top:10px}
</style>
</head>
<body>
<main class="wrap">
<div class="brand">BOOKLY</div><h1>Bookly Account</h1><p class="sub">Manage your Bookly subscription and connect your Telegram account.</p>
<section class="card">
<div id="auth">
<div class="tabs"><button id="loginTab" class="active">Sign in</button><button id="registerTab">Create account</button></div>
<form id="form"><label>Email</label><input id="email" type="email" autocomplete="email" required><label>Password</label><input id="password" type="password" minlength="8" autocomplete="current-password" required><button id="submit" class="primary" type="submit">Sign in</button></form>
<div id="error" class="error" hidden></div>
</div>
<div id="account" class="account"><h2>Account ready</h2><p id="accountText"></p><button id="checkout" class="primary">Choose a plan</button><button id="logout" class="link">Sign out</button></div>
</section>
</main>
<script>
(function(){'use strict';
var qs=new URLSearchParams(location.search);
// The standalone account page is served by Vercel, while the Bookly API is hosted separately.
// Keep the API URL overridable with ?api=, but use the current public API by default.
var api=(qs.get('api')||'https://boockly-3.onrender.com').replace(/\/$/,'');
var mode='login';var session=localStorage.getItem('bookly_session')||'';var auth=document.getElementById('auth'),account=document.getElementById('account'),form=document.getElementById('form'),submit=document.getElementById('submit'),error=document.getElementById('error');
function err(msg){error.textContent=msg;error.hidden=false}function clearErr(){error.hidden=true;error.textContent=''}
function call(path,options){return fetch(api+path,options||{}).then(function(r){return r.json().catch(function(){return null}).then(function(d){if(!r.ok)throw new Error((d&&d.detail)||('Request failed ('+r.status+')'));return d})}).catch(function(e){if(e instanceof TypeError)throw new Error('Cannot connect to Bookly API: '+api);throw e})}
function showAccount(data){auth.style.display='none';account.style.display='block';document.getElementById('accountText').textContent='Signed in as '+data.account.email+'. Your Bookly business is ready.'}
function check(){if(!session)return;call('/account/me',{headers:{Authorization:'Bearer '+session}}).then(showAccount).catch(function(){localStorage.removeItem('bookly_session');session=''})}
document.getElementById('loginTab').onclick=function(){mode='login';this.classList.add('active');document.getElementById('registerTab').classList.remove('active');submit.textContent='Sign in';document.getElementById('password').autocomplete='current-password';clearErr()};
document.getElementById('registerTab').onclick=function(){mode='register';this.classList.add('active');document.getElementById('loginTab').classList.remove('active');submit.textContent='Create account';document.getElementById('password').autocomplete='new-password';clearErr()};
form.onsubmit=function(e){e.preventDefault();clearErr();submit.disabled=true;var body={email:document.getElementById('email').value.trim(),password:document.getElementById('password').value};call('/account/'+(mode==='register'?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(d){session=d.token;localStorage.setItem('bookly_session',session);showAccount(d)}).catch(function(e){err(e.message)}).finally(function(){submit.disabled=false})};
document.getElementById('checkout').onclick=function(){clearErr();this.disabled=true;call('/account/paddle/checkout-token',{headers:{Authorization:'Bearer '+session}}).then(function(d){location.href='pricing-v2.html?token='+encodeURIComponent(d.checkout_token)+'&api='+encodeURIComponent(api)}).catch(function(e){err(e.message)}).finally(function(){document.getElementById('checkout').disabled=false})};
document.getElementById('logout').onclick=function(){localStorage.removeItem('bookly_session');location.reload()};
check();
})();
</script>
</body></html>
