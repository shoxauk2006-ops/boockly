<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#f6f5fb">
    <title>Skedwoo — Account</title>
    <link rel="stylesheet" href="/account-loader.css">
  </head>
  <body class="bookly-loader-page">
    <main class="wake-shell" id="wakeShell" hidden>
      <div class="wake-glow wake-glow-one" aria-hidden="true"></div>
      <div class="wake-glow wake-glow-two" aria-hidden="true"></div>

      <section class="wake-layout" aria-labelledby="wakeTitle">
        <div class="wake-copy">
          <a class="wake-brand" href="/landing.html" aria-label="Skedwoo home">
            <span class="wake-brand-mark">S</span>
            <span>SKEDWOO</span>
          </a>

          <div class="wake-kicker" id="wakeKicker">SKEDWOO WORKSPACE</div>
          <h1 id="wakeTitle">Preparing Skedwoo</h1>
          <p class="wake-status" id="wakeStatus" role="status" aria-live="polite">
            Loading Skedwoo…
          </p>

          <div class="wake-progress" aria-hidden="true"><span></span></div>

          <button class="wake-retry" id="wakeRetry" type="button" hidden>
            Try again
          </button>
        </div>

        <div class="booking-demo" aria-hidden="true">
          <div class="booking-demo-top">
            <span class="booking-demo-brand">SKEDWOO</span>
            <span class="booking-demo-live">
              <i></i>
              <span id="demoLive">Loading</span>
            </span>
          </div>

          <div class="booking-demo-body">
            <div class="booking-demo-rail">
              <span></span><span></span><span></span><span></span><span></span>
            </div>

            <div class="booking-scene booking-scene-service">
              <div class="scene-icon scene-icon-purple">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M5 7.5h14M5 12h9M5 16.5h6" stroke-linecap="round"/>
                </svg>
              </div>
              <div class="scene-copy">
                <small id="demoServiceLabel">SERVICE</small>
                <strong id="demoService">Choose a service</strong>
                <span id="demoDuration">45 min</span>
              </div>
              <div class="scene-check">✓</div>
            </div>

            <div class="booking-scene booking-scene-specialist">
              <div class="scene-avatar">A</div>
              <div class="scene-copy">
                <small id="demoSpecialistLabel">SPECIALIST</small>
                <strong id="demoSpecialist">Available specialist</strong>
                <span id="demoAvailable">Available today</span>
              </div>
              <div class="scene-status-dot"></div>
            </div>

            <div class="booking-scene booking-scene-date">
              <div class="mini-calendar">
                <span>18</span><span>19</span><span class="selected">20</span><span>21</span><span>22</span>
              </div>
              <div class="scene-copy scene-copy-centered">
                <small id="demoDateLabel">DATE</small>
                <strong id="demoDate">Choose a date</strong>
              </div>
            </div>

            <div class="booking-scene booking-scene-time">
              <div class="scene-copy scene-copy-wide">
                <small id="demoTimeLabel">AVAILABLE TIME</small>
                <strong id="demoTime">Choose a time</strong>
                <div class="time-chips">
                  <span>09:30</span><span class="selected">10:30</span><span>11:15</span>
                </div>
              </div>
            </div>

            <div class="booking-scene booking-scene-success">
              <div class="success-ring"><span>✓</span></div>
              <div class="scene-copy scene-copy-centered">
                <small>SKEDWOO</small>
                <strong id="demoConfirmed">Booking confirmed</strong>
                <span id="demoReady">Everything is ready</span>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script>
      (function () {
        var query = new URLSearchParams(window.location.search);
        if (query.has('oauth_code') || query.has('oauth_error') || query.has('terms_required')) return;

        try {
          if (!localStorage.getItem('bookly_session')) return;
        } catch (_) {
          return;
        }

        var copies = {
          en: {
            kicker: 'SKEDWOO WORKSPACE', title: 'Preparing Skedwoo', status: 'Loading Skedwoo…', live: 'Loading',
            serviceLabel: 'SERVICE', service: 'Choose a service', duration: '45 min',
            specialistLabel: 'SPECIALIST', specialist: 'Available specialist', available: 'Available today',
            dateLabel: 'DATE', date: 'Choose a date', timeLabel: 'AVAILABLE TIME', time: 'Choose a time',
            confirmed: 'Booking confirmed', ready: 'Everything is ready'
          },
          ru: {
            kicker: 'РАБОЧЕЕ ПРОСТРАНСТВО', title: 'Готовим Skedwoo', status: 'Загружаем Skedwoo…', live: 'Загрузка',
            serviceLabel: 'УСЛУГА', service: 'Выберите услугу', duration: '45 мин',
            specialistLabel: 'СПЕЦИАЛИСТ', specialist: 'Доступный специалист', available: 'Свободен сегодня',
            dateLabel: 'ДАТА', date: 'Выберите дату', timeLabel: 'СВОБОДНОЕ ВРЕМЯ', time: 'Выберите время',
            confirmed: 'Запись подтверждена', ready: 'Всё готово'
          },
          uz: {
            kicker: 'SKEDWOO ISH MAYDONI', title: 'Skedwoo tayyorlanmoqda', status: 'Skedwoo yuklanmoqda…', live: 'Yuklanmoqda',
            serviceLabel: 'XIZMAT', service: 'Xizmatni tanlang', duration: '45 daq',
            specialistLabel: 'MUTAXASSIS', specialist: 'Mavjud mutaxassis', available: 'Bugun bo‘sh',
            dateLabel: 'SANA', date: 'Sanani tanlang', timeLabel: 'BO‘SH VAQT', time: 'Vaqtni tanlang',
            confirmed: 'Bron tasdiqlandi', ready: 'Hammasi tayyor'
          },
          tr: {
            kicker: 'SKEDWOO ÇALIŞMA ALANI', title: 'Skedwoo hazırlanıyor', status: 'Skedwoo yükleniyor…', live: 'Yükleniyor',
            serviceLabel: 'HİZMET', service: 'Hizmet seçin', duration: '45 dk',
            specialistLabel: 'UZMAN', specialist: 'Uygun uzman', available: 'Bugün uygun',
            dateLabel: 'TARİH', date: 'Tarih seçin', timeLabel: 'UYGUN SAAT', time: 'Saat seçin',
            confirmed: 'Rezervasyon onaylandı', ready: 'Her şey hazır'
          },
          ar: {
            kicker: 'مساحة عمل SKEDWOO', title: 'جارٍ تجهيز Skedwoo', status: 'جارٍ تحميل Skedwoo…', live: 'جارٍ التحميل',
            serviceLabel: 'الخدمة', service: 'اختر الخدمة', duration: '45 دقيقة',
            specialistLabel: 'المختص', specialist: 'مختص متاح', available: 'متاح اليوم',
            dateLabel: 'التاريخ', date: 'اختر التاريخ', timeLabel: 'الوقت المتاح', time: 'اختر الوقت',
            confirmed: 'تم تأكيد الحجز', ready: 'كل شيء جاهز'
          }
        };

        var lang = 'en';
        try {
          var stored = String(localStorage.getItem('bookly_language') || '').toLowerCase();
          if (copies[stored]) lang = stored;
          else {
            var browser = String(navigator.language || 'en').toLowerCase();
            if (/^ru/.test(browser)) lang = 'ru';
            else if (/^uz/.test(browser)) lang = 'uz';
            else if (/^tr/.test(browser)) lang = 'tr';
            else if (/^ar/.test(browser)) lang = 'ar';
          }
        } catch (_) {}

        var copy = copies[lang] || copies.en;
        var fields = {
          wakeKicker: 'kicker', wakeTitle: 'title', wakeStatus: 'status', demoLive: 'live',
          demoServiceLabel: 'serviceLabel', demoService: 'service', demoDuration: 'duration',
          demoSpecialistLabel: 'specialistLabel', demoSpecialist: 'specialist', demoAvailable: 'available',
          demoDateLabel: 'dateLabel', demoDate: 'date', demoTimeLabel: 'timeLabel', demoTime: 'time',
          demoConfirmed: 'confirmed', demoReady: 'ready'
        };

        Object.keys(fields).forEach(function (id) {
          var element = document.getElementById(id);
          if (element) element.textContent = copy[fields[id]];
        });

        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.getElementById('wakeShell').hidden = false;
      })();
    </script>
    <script src="/account-loader.js"></script>
  </body>
</html>
