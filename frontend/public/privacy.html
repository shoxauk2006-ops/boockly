en:{back:'Back to Skedwoo',title:'Privacy Policy — Skedwoo',effective:'Effective date: September 18, 2026',sections:[
['Information we collect','We may process account details such as name and email address, Google account identifiers when Google sign-in is used, Telegram identifiers and connection data, business information such as services, specialists, schedules and booking settings, and customer information submitted during a booking such as name and contact details.'],
['How we use information','We use information to create and manage accounts, operate the booking service, display services and available times, manage appointments and schedules, connect businesses with Telegram, send booking-related notifications, provide support, maintain security and improve the reliability of Skedwoo.'],
['Booking and customer data','When booking, a customer may provide a name and phone number. This information is shown to the selected business only for processing and managing that booking. Skedwoo does not provide the business with additional personal customer data beyond the information the customer enters during booking.'],
['Authentication and connected services','Skedwoo may use Google authentication and Telegram integration to identify users, connect accounts and provide the service. Information received from these services is used only as needed for Skedwoo functionality.'],
['Payments and billing','Payments and subscription billing are processed through Paddle. Skedwoo does not store full payment-card numbers or security codes. Payment processing is subject to Paddle’s own privacy and payment terms.'],
['Service providers and infrastructure','Skedwoo may rely on third-party providers for hosting, databases, authentication, messaging, payment processing and related infrastructure. These providers may process limited information on our behalf where necessary to operate the service.'],
['Local storage and technical data','Skedwoo may use browser local storage or similar technologies to remember preferences such as language, session state and interface settings. Technical information such as browser type, device information, request metadata and error data may be processed for security and reliability.'],
['Data retention','We keep personal and business information only for as long as reasonably necessary to provide the service, comply with legal obligations, resolve disputes and protect the security of Skedwoo. Retention periods may vary depending on the type of information and the status of an account.'],
['Your choices and rights','Depending on applicable law, you may request access to, correction of, or deletion of personal information associated with your Skedwoo account. Some information may need to be retained where required by law, for security, fraud prevention or legitimate record-keeping.'],
['Security','We use reasonable technical and organizational measures intended to protect information. No online service can guarantee absolute security, and users are responsible for protecting their account credentials and connected Telegram or Google accounts.'],
['Changes to this policy','We may update this Privacy Policy when Skedwoo changes or when legal or operational requirements change. The effective date shown above will be updated when material changes are published.']
],note:'Skedwoo is a software platform for online booking. Businesses using Skedwoo are independent from Skedwoo and may have their own privacy obligations toward their customers.',contact:'For privacy questions, account-data requests or deletion requests, contact skedwoo@gmail.com.'},
ru:{back:'Назад в Skedwoo',title:'Политика конфиденциальности — Skedwoo',effective:'Дата вступления в силу: 18 сентября 2026',sections:[
['Какие данные мы собираем','Мы можем обрабатывать данные аккаунта, например имя и адрес электронной почты, идентификаторы Google при входе через Google, идентификаторы Telegram и данные подключения, информацию о бизнесе — услуги, специалистов, графики и настройки записи, а также данные клиентов, указанные при бронировании, например имя и контактные данные.'],
['Как мы используем данные','Данные используются для создания и управления аккаунтами, работы системы бронирования, отображения услуг и свободного времени, управления записями и графиками, подключения бизнеса к Telegram, отправки уведомлений о записях, поддержки пользователей, обеспечения безопасности и повышения стабильности Skedwoo.'],
['Данные клиентов и бронирований','При бронировании клиент может указать имя и номер телефона. Эти данные показываются выбранному бизнесу только для обработки и управления конкретной записью. Skedwoo не предоставляет бизнесу дополнительные персональные данные клиента, кроме информации, которую клиент сам указал при бронировании.'],
['Авторизация и подключённые сервисы','Skedwoo может использовать авторизацию Google и интеграцию Telegram для идентификации пользователей, подключения аккаунтов и предоставления функций сервиса. Полученные от этих сервисов данные используются только в объёме, необходимом для работы Skedwoo.'],
['Платежи и биллинг','Оплата и подписки обрабатываются через Paddle. Skedwoo не хранит полные номера банковских карт или коды безопасности. Обработка платежей также регулируется условиями и политикой конфиденциальности Paddle.'],
['Поставщики и инфраструктура','Skedwoo может использовать сторонних поставщиков для хостинга, баз данных, авторизации, сообщений, обработки платежей и другой инфраструктуры. Такие поставщики могут обрабатывать ограниченный объём данных от нашего имени, когда это необходимо для работы сервиса.'],
['Локальное хранилище и технические данные','Skedwoo может использовать localStorage браузера и похожие технологии для сохранения языка, состояния сессии и настроек интерфейса. Технические данные, включая тип браузера, сведения об устройстве, метаданные запросов и ошибки, могут обрабатываться для безопасности и стабильности.'],
['Срок хранения данных','Мы храним персональные и бизнес-данные только столько, сколько разумно необходимо для предоставления сервиса, выполнения юридических обязательств, разрешения споров и защиты Skedwoo. Сроки могут отличаться в зависимости от типа данных и статуса аккаунта.'],
['Ваши права и выбор','В зависимости от применимого законодательства вы можете запросить доступ, исправление или удаление персональных данных, связанных с аккаунтом Skedwoo. Некоторые сведения могут сохраняться, если этого требует закон, безопасность, предотвращение мошенничества или законное ведение учёта.'],
['Безопасность','Мы применяем разумные технические и организационные меры для защиты данных. Ни один онлайн-сервис не может гарантировать абсолютную безопасность, а пользователь отвечает за защиту своих данных входа и подключённых аккаунтов Telegram или Google.'],
['Изменения политики','Мы можем обновлять Политику конфиденциальности при изменении Skedwoo, законодательства или операционных требований. При существенных изменениях дата вступления в силу выше будет обновлена.']
],note:'Skedwoo — это программная платформа для онлайн-записи. Бизнесы, использующие Skedwoo, являются независимыми от Skedwoo и могут иметь собственные обязанности по защите данных своих клиентов.',contact:'По вопросам конфиденциальности, запросам данных аккаунта или удаления данных: skedwoo@gmail.com.'},
uz:{back:'Skedwoo’ga qaytish',title:'Maxfiylik siyosati — Skedwoo',effective:'Amal qilish sanasi: 2026-yil 18-sentabr',sections:[
['Biz yig‘adigan ma’lumotlar','Biz hisob ma’lumotlari, masalan ism va email, Google orqali kirishda Google identifikatorlari, Telegram identifikatorlari va ulanish ma’lumotlari, xizmatlar, mutaxassislar, jadvallar va bron sozlamalari kabi biznes ma’lumotlari hamda bron vaqtida kiritilgan mijoz ismi va aloqa ma’lumotlarini qayta ishlashimiz mumkin.'],
['Ma’lumotlardan qanday foydalanamiz','Ma’lumotlar hisob yaratish va boshqarish, bronlash xizmatini ishlatish, xizmatlar va bo‘sh vaqtlarni ko‘rsatish, bronlar va jadvallarni boshqarish, biznesni Telegram bilan ulash, bron bildirishnomalarini yuborish, yordam ko‘rsatish, xavfsizlik va barqarorlik uchun ishlatiladi.'],
['Bron va mijoz ma’lumotlari','Bron qilishda mijoz ism va telefon raqamini kiritishi mumkin. Bu ma’lumotlar faqat shu bronni qayta ishlash va boshqarish uchun tanlangan biznesga ko‘rsatiladi. Skedwoo mijoz bron vaqtida o‘zi kiritgan ma’lumotlardan tashqari qo‘shimcha shaxsiy ma’lumotlarni biznesga bermaydi.'],
['Autentifikatsiya va ulangan xizmatlar','Skedwoo foydalanuvchilarni aniqlash, hisoblarni ulash va xizmatni taqdim etish uchun Google autentifikatsiyasi va Telegram integratsiyasidan foydalanishi mumkin. Ushbu xizmatlardan olingan ma’lumotlar faqat Skedwoo ishlashi uchun zarur hajmda ishlatiladi.'],
['To‘lovlar va billing','To‘lovlar va obunalar Paddle orqali qayta ishlanadi. Skedwoo bank kartalarining to‘liq raqamlari yoki xavfsizlik kodlarini saqlamaydi. To‘lovlarni qayta ishlash Paddle shartlari va maxfiylik siyosatiga ham bo‘ysunadi.'],
['Xizmat ko‘rsatuvchilar va infratuzilma','Skedwoo hosting, ma’lumotlar bazasi, autentifikatsiya, xabar almashish, to‘lovlar va boshqa infratuzilma uchun uchinchi tomon xizmatlaridan foydalanishi mumkin. Ular xizmatni ishlatish uchun zarur bo‘lgan cheklangan ma’lumotlarni bizning nomimizdan qayta ishlashi mumkin.'],
['Mahalliy saqlash va texnik ma’lumotlar','Skedwoo til, sessiya holati va interfeys sozlamalarini eslab qolish uchun brauzer localStorage yoki o‘xshash texnologiyalardan foydalanishi mumkin. Brauzer turi, qurilma, so‘rov metama’lumotlari va xatoliklar xavfsizlik va barqarorlik uchun qayta ishlanishi mumkin.'],
['Ma’lumotlarni saqlash muddati','Shaxsiy va biznes ma’lumotlarini xizmatni taqdim etish, qonuniy majburiyatlarni bajarish, nizolarni hal qilish va Skedwoo xavfsizligini ta’minlash uchun zarur bo‘lgan muddatgacha saqlaymiz. Muddat ma’lumot turi va hisob holatiga qarab farq qilishi mumkin.'],
['Huquqlaringiz va tanlovingiz','Amaldagi qonunchilikka qarab siz Skedwoo hisobingizga tegishli shaxsiy ma’lumotlarni ko‘rish, tuzatish yoki o‘chirishni so‘rashingiz mumkin. Qonun, xavfsizlik, firibgarlikning oldini olish yoki qonuniy hisob yuritish sababli ayrim ma’lumotlar saqlanishi mumkin.'],
['Xavfsizlik','Biz ma’lumotlarni himoya qilish uchun oqilona texnik va tashkiliy choralarni qo‘llaymiz. Hech bir onlayn xizmat mutlaq xavfsizlikni kafolatlay olmaydi. Foydalanuvchi o‘z hisob ma’lumotlari hamda ulangan Telegram yoki Google hisoblarini himoya qilish uchun javobgardir.'],
['Siyosatdagi o‘zgarishlar','Skedwoo, qonun yoki operatsion talablar o‘zgarganda ushbu siyosatni yangilashimiz mumkin. Muhim o‘zgarishlar e’lon qilinganda yuqoridagi amal qilish sanasi yangilanadi.']
],note:'Skedwoo onlayn bronlash uchun dasturiy platformadir. Skedwoo’dan foydalanuvchi bizneslar Skedwoo’dan mustaqil bo‘lib, o‘z mijozlari ma’lumotlari bo‘yicha alohida majburiyatlarga ega bo‘lishi mumkin.',contact:'Maxfiylik, hisob ma’lumotlari yoki ma’lumotlarni o‘chirish bo‘yicha so‘rovlar uchun: skedwoo@gmail.com.'},
tr:{back:'Skedwoo’ye dön',title:'Gizlilik Politikası — Skedwoo',effective:'Yürürlük tarihi: 18 Eylül 2026',sections:[

['Bilgileri nasıl kullanıyoruz','Bilgiler; hesap oluşturmak ve yönetmek, rezervasyon hizmetini çalıştırmak, hizmetleri ve uygun saatleri göstermek, randevu ve programları yönetmek, işletmeleri Telegram’a bağlamak, rezervasyon bildirimleri göndermek, destek sağlamak, güvenliği ve hizmet güvenilirliğini korumak için kullanılır.'],

['Kimlik doğrulama ve bağlı hizmetler','Skedwoo, kullanıcıları tanımlamak, hesapları bağlamak ve hizmeti sunmak için Google kimlik doğrulamasını ve Telegram entegrasyonunu kullanabilir. Bu hizmetlerden alınan bilgiler yalnızca Skedwoo işlevleri için gerekli ölçüde kullanılır.'],
['Ödemeler ve faturalandırma','Ödemeler ve abonelikler Paddle tarafından işlenir. Skedwoo tam kart numaralarını veya güvenlik kodlarını saklamaz. Ödeme işlemleri ayrıca Paddle’ın kendi şartlarına ve gizlilik politikasına tabidir.'],
['Hizmet sağlayıcılar ve altyapı','Skedwoo barındırma, veritabanı, kimlik doğrulama, mesajlaşma, ödeme işlemleri ve diğer altyapı için üçüncü taraf sağlayıcılardan yararlanabilir. Bu sağlayıcılar hizmeti işletmek için gerekli sınırlı bilgileri bizim adımıza işleyebilir.'],
['Yerel depolama ve teknik veriler','Skedwoo dil, oturum durumu ve arayüz tercihlerini hatırlamak için tarayıcı localStorage veya benzeri teknolojileri kullanabilir. Tarayıcı türü, cihaz bilgileri, istek meta verileri ve hata verileri güvenlik ve güvenilirlik amacıyla işlenebilir.'],
['Veri saklama','Kişisel ve işletme bilgilerini hizmeti sunmak, yasal yükümlülükleri yerine getirmek, uyuşmazlıkları çözmek ve Skedwoo güvenliğini korumak için makul ölçüde gerekli olduğu sürece saklarız. Süreler veri türüne ve hesap durumuna göre değişebilir.'],
['Haklarınız ve seçenekleriniz','Geçerli hukuka bağlı olarak Skedwoo hesabınıza ilişkin kişisel bilgilere erişim, düzeltme veya silme talep edebilirsiniz. Yasal zorunluluklar, güvenlik, dolandırıcılığı önleme veya meşru kayıt tutma nedeniyle bazı bilgiler saklanabilir.'],
['Güvenlik','Bilgileri korumak için makul teknik ve organizasyonel önlemler kullanırız. Hiçbir çevrimiçi hizmet mutlak güvenliği garanti edemez. Kullanıcılar kendi hesap bilgilerini ve bağlı Telegram veya Google hesaplarını korumaktan sorumludur.'],
['Bu politikadaki değişiklikler','Skedwoo, yasal veya operasyonel gereksinimler değiştiğinde bu politikayı güncelleyebiliriz. Önemli değişiklikler yayımlandığında yukarıdaki yürürlük tarihi güncellenir.']
],note:'Skedwoo çevrimiçi rezervasyon için bir yazılım platformudur. Skedwoo kullanan işletmeler Skedwoo’den bağımsızdır ve müşterilerine karşı kendi gizlilik yükümlülükleri olabilir.',contact:'Gizlilik, hesap verileri veya veri silme talepleri için: skedwoo@gmail.com.'},
ar:{back:'العودة إلى Skedwoo',title:'سياسة الخصوصية — Skedwoo',effective:'تاريخ السريان: 18 سبتمبر 2026',sections:[
['المعلومات التي نجمعها','قد نعالج بيانات الحساب مثل الاسم والبريد الإلكتروني، ومعرّفات Google عند استخدام تسجيل الدخول عبر Google، ومعرّفات Telegram وبيانات الربط، وبيانات النشاط مثل الخدمات والمتخصصين والجداول وإعدادات الحجز، إضافة إلى اسم العميل وبيانات الاتصال التي يقدمها أثناء الحجز.'],
['كيفية استخدام المعلومات','نستخدم المعلومات لإنشاء الحسابات وإدارتها، وتشغيل خدمة الحجز، وعرض الخدمات والأوقات المتاحة، وإدارة الحجوزات والجداول، وربط الأنشطة بـ Telegram، وإرسال إشعارات الحجز، وتقديم الدعم، والحفاظ على الأمان وموثوقية Skedwoo.'],
['بيانات الحجز والعملاء','أثناء الحجز قد يقدّم العميل اسمه ورقم هاتفه. تُعرض هذه المعلومات للنشاط المختار فقط لمعالجة الحجز وإدارته. لا يزوّد Skedwoo النشاط بأي بيانات شخصية إضافية عن العميل بخلاف المعلومات التي أدخلها العميل بنفسه أثناء الحجز.'],
['المصادقة والخدمات المرتبطة','قد يستخدم Skedwoo مصادقة Google وتكامل Telegram للتعرّف على المستخدمين وربط الحسابات وتقديم الخدمة. تُستخدم المعلومات الواردة من هذه الخدمات فقط بالقدر اللازم لوظائف Skedwoo.'],
['المدفوعات والفوترة','تتم معالجة المدفوعات والاشتراكات عبر Paddle. لا يخزن Skedwoo أرقام البطاقات الكاملة أو رموز الأمان. كما تخضع معالجة المدفوعات لشروط وسياسة الخصوصية الخاصة بـ Paddle.'],
['مزودو الخدمة والبنية التحتية','قد يعتمد Skedwoo على مزودين خارجيين للاستضافة وقواعد البيانات والمصادقة والرسائل ومعالجة المدفوعات والبنية التحتية الأخرى. وقد يعالج هؤلاء المزودون معلومات محدودة نيابة عنا عند الحاجة لتشغيل الخدمة.'],
['التخزين المحلي والبيانات التقنية','قد يستخدم Skedwoo التخزين المحلي في المتصفح أو تقنيات مشابهة لتذكر اللغة وحالة الجلسة وتفضيلات الواجهة. وقد تتم معالجة نوع المتصفح ومعلومات الجهاز وبيانات الطلب والأخطاء لأغراض الأمان والموثوقية.'],
['الاحتفاظ بالبيانات','نحتفظ بالمعلومات الشخصية وبيانات النشاط للمدة المعقولة اللازمة لتقديم الخدمة والوفاء بالالتزامات القانونية وحل النزاعات وحماية Skedwoo. وقد تختلف المدة حسب نوع البيانات وحالة الحساب.'],
