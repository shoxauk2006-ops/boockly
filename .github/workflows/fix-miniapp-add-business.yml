name: Fix Mini App business creation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[miniapp-create-business]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch creation policy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/public/miniapp-policy.js')
          s = p.read_text()
          old = r"  var CREATE_RE = /создать\s+бизнес|create\s+business|biznes\s+yaratish|işletme\s+oluştur|إنشاء\s+نشاط/i;"
          new = r"  var CREATE_RE = /создать\s+бизнес|создание\s+бизнеса|добавить\s+бизнес|add\s+business|create\s+business|biznes\s+yaratish|işletme\s+oluştur|إنشاء\s+نشاط/i;"
          if old not in s:
              raise SystemExit('CREATE_RE line not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/public/miniapp-policy.js
          git commit -m 'fix: route mini app business creation to website [miniapp-create-business]'
          git push
          git rm .github/workflows/fix-miniapp-add-business.yml
          git commit -m 'chore: remove temporary mini app creation workflow [miniapp-create-business]'
          git push
