name: Implement Paddle addon billing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Implement Paddle addon billing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch backend
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          p = Path('backend/app.py')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              'from urllib.error import URLError',
              'from urllib.error import URLError, HTTPError',
              1
          )

          old_service = dedent('''
          SERVICE_ADDONS = {
              20: 4.99,
              30: 7.99,
              50: 11.99,
              100: 19.99,
          }
          ''').strip()

          new_service = dedent('''
          SERVICE_ADDONS = {
              20: 4.99,
              30: 7.99,
              50: 11.99,
              100: 19.99,
          }

          PADDLE_BOOKLY_BASE_PRICE_ID = os.getenv(
              "PADDLE_BOOKLY_BASE_PRICE_ID",
              "pri_01m0mgjzfy19gn941zebpa9vn"
          )

          PADDLE_SERVICE_ADDON_PRICE_IDS = {
              20: os.getenv(
                  "PADDLE_SERVICE_ADDON_10_PRICE_ID",
                  "pri_01m0mhcv9673d4xm8tf3yh5bph"
              ),
              30: os.getenv(
                  "PADDLE_SERVICE_ADDON_20_PRICE_ID",
                  "pri_01m0mhf9rdee684tyd3mg3xp8p"
              ),
              50: os.getenv(
                  "PADDLE_SERVICE_ADDON_40_PRICE_ID",
                  "pri_01m0mhhh2k5cts13j9h3agt7bj"
              ),
              100: os.getenv(
                  "PADDLE_SERVICE_ADDON_90_PRICE_ID",
                  "pri_01m0mhk1wq5brdkew92q3gvk9r"
              ),
          }

          PADDLE_SERVICE_ADDON_IDS = set(
              PADDLE_SERVICE_ADDON_PRICE_IDS.values()
          )
          ''').strip()

          if old_service not in s:
              raise SystemExit('SERVICE_ADDONS block not found')
          s = s.replace(old_service, new_service, 1)

          marker = '# ---------- subscription management ----------\n'
          cancel_marker = '@app.post("/admin/subscription/cancel")'
          start = s.find(marker)
          end = s.find(cancel_marker, start + len(marker))
          if start < 0 or end < 0:
              raise SystemExit('subscription section markers not found')

          new_section = dedent('''
          # ---------- subscription management ----------

          PADDLE_API_KEY = os.getenv(
              "PADDLE_API_KEY",
              ""
          )

          PADDLE_API_BASE = os.getenv(
              "PADDLE_API_BASE",
              "https://api.paddle.com"
          )

          def _paddle_request(
              method: str,
              path: str,
              payload: Optional[dict] = None
          ):
              if not PADDLE_API_KEY:
                  raise HTTPException(
                      500,
                      "Paddle API key is not configured"
                  )

              body = (
                  json.dumps(payload).encode("utf-8")
                  if payload is not None
                  else None
              )

              req = urllib_request.Request(
                  f"{PADDLE_API_BASE}{path}",
                  data=body,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {PADDLE_API_KEY}",
                      "Content-Type": "application/json",
                      "Accept": "application/json"
                  }
              )

              try:
                  with urllib_request.urlopen(
                      req,
                      timeout=20
                  ) as response:
                      raw = response.read().decode("utf-8")
                      return json.loads(raw) if raw else {}
              except HTTPError as exc:
                  try:
                      raw = exc.read().decode("utf-8")
                      data = json.loads(raw) if raw else {}
                  except Exception:
                      data = {}

                  detail = (
                      data.get("error", {}).get("detail")
                      or data.get("error", {}).get("code")
                      or f"Paddle API error {exc.code}"
                  )

                  raise HTTPException(
                      502,
                      f"Paddle: {detail}"
                  )
              except URLError as exc:
                  raise HTTPException(
                      502,
                      f"Paddle connection error: {exc.reason}"
                  )

          def _paddle_update_bookly_subscription(
              subscription_id: str,
              new_limit: int,
              old_limit: int
          ):
              if not subscription_id.startswith("sub_"):
                  raise HTTPException(
                      400,
                      "Paddle subscription ID is missing"
                  )

              current = _paddle_request(
                  "GET",
                  f"/subscriptions/{subscription_id}"
              )

              items = (
                  current
                  .get("data", {})
                  .get("items", [])
              )

              new_items = []
              base_replaced = False

              for item in items:
                  price = item.get("price") or {}
                  price_id = (
                      item.get("price_id")
                      or price.get("id")
                  )

                  if price_id in PADDLE_SERVICE_ADDON_IDS:
                      continue

                  if not base_replaced:
                      new_items.append({
                          "price_id": PADDLE_BOOKLY_BASE_PRICE_ID,
                          "quantity": 1
                      })
                      base_replaced = True
                      continue

                  new_items.append({
                      "price_id": price_id,
                      "quantity": item.get("quantity") or 1
                  })

              if not base_replaced:
                  new_items.insert(
                      0,
                      {
                          "price_id": PADDLE_BOOKLY_BASE_PRICE_ID,
                          "quantity": 1
                      }
                  )

              addon_price_id = (
                  PADDLE_SERVICE_ADDON_PRICE_IDS.get(
                      new_limit
                  )
              )

              if addon_price_id:
                  new_items.append({
                      "price_id": addon_price_id,
                      "quantity": 1
                  })

              proration_mode = (
                  "prorated_immediately"
                  if new_limit > old_limit
                  else "prorated_next_billing_period"
              )

              return _paddle_request(
                  "PATCH",
                  f"/subscriptions/{subscription_id}",
                  {
                      "items": new_items,
                      "proration_billing_mode": proration_mode,
                      "on_payment_failure": "prevent_change"
                  }
              )

          @app.post("/admin/subscription/change-limit")
          def change_subscription_limit(
              x: SubscriptionLimitChangeIn,
              x_telegram_init_data: str = Header(default="")
          ):
              user = telegram_user(
                  x_telegram_init_data
              )

              owner_id = int(
                  user["id"]
              )

              allowed_limits = {
                  10,
                  20,
                  30,
                  50,
                  100
              }

              if x.services_limit not in allowed_limits:
                  raise HTTPException(
                      400,
                      "Недопустимый лимит услуг"
                  )

              with SessionLocal() as db:
                  business = owner_business(
                      db,
                      owner_id
                  )

                  if not business:
                      business = (
                          db.query(Business)
                          .filter(
                              Business.owner_telegram_id == owner_id
                          )
                          .order_by(Business.id.asc())
                          .first()
                      )

                  if not business:
                      raise HTTPException(
                          404,
                          "Business not found"
                      )

                  subscription = owner_subscription(
                      db,
                      business.id
                  )

                  if not subscription:
                      raise HTTPException(
                          400,
                          "Subscription not found"
                      )

                  if not subscription.active:
                      raise HTTPException(
                          400,
                          "Active subscription required"
                      )

                  current_limit = (
                      subscription.current_services_limit
                      or 10
                  )

                  if x.services_limit == current_limit:
                      return {
                          "ok": True,
                          "current_services_limit": current_limit,
                          "current_price": float(
                              subscription.current_price
                              or 7.99
                          ),
                          "pending_services_limit": None,
                          "pending_price": None
                      }

                  price_by_limit = {
                      10: 7.99,
                      20: 12.98,
                      30: 15.98,
                      50: 19.98,
                      100: 27.98
                  }

                  new_price = price_by_limit[
                      x.services_limit
                  ]

                  _paddle_update_bookly_subscription(
                      subscription.external_subscription_id,
                      x.services_limit,
                      current_limit
                  )

                  subscription.current_services_limit = (
                      x.services_limit
                  )
                  subscription.current_price = new_price
                  subscription.pending_services_limit = None
                  subscription.pending_price = None

                  db.commit()

                  return {
                      "ok": True,
                      "current_services_limit": (
                          subscription.current_services_limit
                      ),
                      "current_price": float(
                          subscription.current_price
                      ),
                      "pending_services_limit": None,
                      "pending_price": None
                  }

          ''').strip() + '\n'

          s = s[:start] + new_section + s[end:]
          p.write_text(s, encoding='utf-8')

      - name: Validate Python syntax
        run: python -m py_compile backend/app.py

      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/implement-paddle-addons.yml
          git add backend/app.py
          git commit -m 'Implement Paddle addon billing'
          git push
