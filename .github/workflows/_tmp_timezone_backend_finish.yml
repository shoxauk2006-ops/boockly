name: Finish Bookly timezone backend

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[bookly-timezone-backend-finalize]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch backend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('backend/app.py')
          s = p.read_text(encoding='utf-8')

          # Existing business: timezone is immutable after creation.
          old = '''        else:\n            for k, v in x.model_dump().items(): setattr(b, k, v)'''
          new = '''        else:\n            payload = x.model_dump()\n            payload.pop("timezone", None)\n            for k, v in payload.items(): setattr(b, k, v)'''
          if old in s:
              s = s.replace(old, new, 1)

          # Blocks cleanup must use the business timezone.
          s = s.replace('''        today = datetime.now().date()''', '''        today = datetime.now(_bookly_zone(b.timezone)).date()''', 1)

          # Statistics must use business-local date/time, including completion.
          s = s.replace('''        now = datetime.now()\n        today = now.date()''', '''        business_zone = _bookly_zone(business.timezone)\n        now = datetime.now(business_zone).replace(tzinfo=None)\n        today = now.date()''', 1)

          # Manual admin booking past-time check must use business timezone.
          s = s.replace('''        from zoneinfo import ZoneInfo\n\n        now_tashkent = datetime.now(\n            ZoneInfo("Asia/Tashkent")\n        ).replace(tzinfo=None)\n\n        start_dt = datetime.combine(\n            x.day,\n            x.start\n        )''', '''        business_zone = _bookly_zone(business.timezone)\n        now_business = datetime.now(business_zone).replace(tzinfo=None)\n\n        start_dt = datetime.combine(\n            x.day,\n            x.start\n        )''', 1)
          s = s.replace('''        if start_dt <= now_tashkent:''', '''        if start_dt <= now_business:''', 1)

          # Admin cancellation notification must be rendered in the client's timezone.
          old = '''        if booking.client_telegram_id:\n            telegram_api(\n                "sendMessage",\n                {\n                    "chat_id": booking.client_telegram_id,\n                    "text": (\n                        "❌ <b>Ваша запись отменена бизнесом</b>\\n\\n"\n                        f"📅 {booking.day.isoformat()}\\n"\n                        f"🕐 {booking.start.strftime('%H:%M')}–"\n                        f"{booking.end.strftime('%H:%M')}\\n"'''
          if old in s:
              new = '''        if booking.client_telegram_id:\n            client_zone = _bookly_zone(booking.client_timezone)\n            if booking.start_at_utc and booking.end_at_utc:\n                client_start = _bookly_from_utc(booking.start_at_utc, booking.client_timezone or "UTC")\n                client_end = _bookly_from_utc(booking.end_at_utc, booking.client_timezone or "UTC")\n                display_day = client_start.date().isoformat() if client_start else booking.day.isoformat()\n                display_start = client_start.strftime('%H:%M') if client_start else booking.start.strftime('%H:%M')\n                display_end = client_end.strftime('%H:%M') if client_end else booking.end.strftime('%H:%M')\n            else:\n                display_day = booking.day.isoformat()\n                display_start = booking.start.strftime('%H:%M')\n                display_end = booking.end.strftime('%H:%M')\n            telegram_api(\n                "sendMessage",\n                {\n                    "chat_id": booking.client_telegram_id,\n                    "text": (\n                        "❌ <b>Ваша запись отменена бизнесом</b>\\n\\n"\n                        f"📅 {display_day}\\n"\n                        f"🕐 {display_start}–"\n                        f"{display_end}\\n"'''
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        run: python3 -m py_compile backend/app.py

      - name: Commit and clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/_tmp_timezone_backend_finish.yml .timezone-finalize-trigger
          git add backend/app.py .github/workflows/_tmp_timezone_backend_finish.yml .timezone-finalize-trigger
          git commit -m 'fix: finish timezone backend handling [bookly-timezone-backend-finalize]'
          git push
