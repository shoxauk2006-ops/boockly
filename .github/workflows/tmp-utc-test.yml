name: tmp-utc-test
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -c "from pathlib import Path; p=Path('backend/app.py'); s=p.read_text(); s=s.replace('class Booking(Base):','class Booking(Base):',1); p.write_text(s)"
