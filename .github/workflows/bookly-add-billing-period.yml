name: Bookly add subscription billing period

on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch billing period
        shell: python
        run: |
          from pathlib import Path

          # Backend: expose the real Paddle billing interval for the active subscription.
          p = Path('backend/paddle_app.py')
          s = p.read_text()
          s = s.replace(
              'from fastapi import HTTPException\n',
              'from fastapi import HTTPException, Header\n',
              1,
          )
          marker = '@app.get("/payments/external/checkout-config")\n'
          endpoint = '''@app.get("/admin/subscription/billing-period")\ndef subscription_billing_period(\n    x_telegram_init_data: str = Header(default=""),\n):\n    _, _, business_id, subscription_id = _current_subscription(\n        x_telegram_init_data\n    )\n    return {\n        "business_id": business_id,\n        "billing_period": _subscription_interval(subscription_id),\n    }\n\n\n'''
          if endpoint not in s:
              if marker not in s:
                  raise SystemExit('billing-period insertion marker not found in paddle_app.py')
              s = s.replace(marker, endpoint + marker, 1)
          p.write_text(s)

          # Frontend: fetch and display the actual interval in the subscription card.
          p = Path('frontend/src/main.tsx')
          s = p.read_text()
          anchor = '''  const currentPrice = Number(\n    business?.current_price || 7.99\n  );\n'''
          state = anchor + '''  const [billingPeriod, setBillingPeriod] =\n    useState<'month' | 'year' | null>(null);\n\n  useEffect(() => {\n    let cancelled = false;\n\n    const loadBillingPeriod = async () => {\n      if (!business?.subscription_active || !business?.external_subscription_id) {\n        setBillingPeriod(null);\n        return;\n      }\n\n      try {\n        const response = await fetch(\n          API + '/admin/subscription/billing-period',\n          { headers: headers() }\n        );\n\n        if (!response.ok) {\n          throw new Error('billing period request failed');\n        }\n\n        const data = await response.json();\n        if (cancelled) return;\n\n        setBillingPeriod(\n          data?.billing_period === 'year' ? 'year' : 'month'\n        );\n      } catch {\n        if (!cancelled) {\n          setBillingPeriod(null);\n        }\n      }\n    };\n\n    loadBillingPeriod();\n\n    return () => {\n      cancelled = true;\n    };\n  }, [business?.id, business?.subscription_active, business?.external_subscription_id]);\n'''
          if 'const [billingPeriod, setBillingPeriod]' not in s:
              if anchor not in s:
                  raise SystemExit('billing state anchor not found in main.tsx')
              s = s.replace(anchor, state, 1)

          old = '''            <p>\n              <b>${displayedMonthlyPrice.toFixed(2)} {t('owner.perMonth')}</b>\n            </p>\n'''
          new = old + '''            <p>\n              <span>{t('owner.billingPeriod', 'Период')}</span>{' '}\n              <strong>\n                {billingPeriod === 'year'\n                  ? ({ ru: 'Ежегодно', en: 'Yearly', uz: 'Yillik', tr: 'Yıllık', ar: 'سنوي' } as Record<Language, string>)[getStoredLanguage()]\n                  : billingPeriod === 'month'\n                    ? ({ ru: 'Ежемесячно', en: 'Monthly', uz: 'Oylik', tr: 'Aylık', ar: 'شهري' } as Record<Language, string>)[getStoredLanguage()]\n                    : '—'}\n              </strong>\n            </p>\n'''
          if 'billingPeriod === \'year\'' not in s:
              if old not in s:
                  raise SystemExit('subscription price anchor not found in main.tsx')
              s = s.replace(old, new, 1)
          p.write_text(s)

          # Remove this temporary workflow after the patch commit.
          Path('.github/workflows/bookly-add-billing-period.yml').unlink()
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/paddle_app.py frontend/src/main.tsx .github/workflows/bookly-add-billing-period.yml
          git diff --cached --quiet && exit 0
          git commit -m "Show active subscription billing period"
          git push origin main
