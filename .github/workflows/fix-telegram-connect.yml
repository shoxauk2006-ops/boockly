name: Fix Telegram connection flow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Telegram connection flow
        shell: python
        run: |
          from pathlib import Path
          import re

          # Backend: create short, one-time Telegram connection links.
          p = Path('backend/account_routes.py')
          s = p.read_text()
          if 'class BooklyTelegramLink' not in s:
              s = s.replace(
                  'class BooklySession(Base):\n',
                  '''class BooklyTelegramLink(Base):\n    __tablename__ = "bookly_telegram_links"\n\n    id: Mapped[int] = mapped_column(Integer, primary_key=True)\n    token_hash: Mapped[str] = mapped_column(String(64), unique=True, index=True)\n    account_id: Mapped[int] = mapped_column(Integer, index=True)\n    business_id: Mapped[int] = mapped_column(Integer, index=True)\n    expires_at: Mapped[datetime] = mapped_column(DateTime, index=True)\n    used_at: Mapped[datetime | None] = mapped_column(DateTime, nullable=True)\n    created_at: Mapped[datetime] = mapped_column(DateTime, default=datetime.utcnow)\n\n\nclass BooklySession(Base):\n'''
              )

          marker = '@app.get("/account/paddle/checkout-token")'
          if '/account/telegram-link' not in s:
              block = '''class TelegramLinkIn(BaseModel):\n    token: str = Field(min_length=20, max_length=80)\n\n\n@app.get("/account/telegram-link")\ndef account_telegram_link(authorization: str = Header(default="")):\n    with SessionLocal() as db:\n        account = _account_from_header(db, authorization)\n        business = db.get(Business, account.business_id) if account.business_id else None\n        if not business:\n            raise HTTPException(400, "Bookly business not found")\n\n        raw = secrets.token_urlsafe(32)\n        db.add(BooklyTelegramLink(\n            token_hash=hashlib.sha256(raw.encode("utf-8")).hexdigest(),\n            account_id=account.id,\n            business_id=business.id,\n            expires_at=datetime.utcnow() + timedelta(minutes=10),\n        ))\n        db.commit()\n\n        from . import paddle_original\n        bot_username = os.getenv("BOT_USERNAME", "BooklyBot").lstrip("@").strip()\n        start_parameter = "bookly-connect-" + raw\n        if len(start_parameter) > 64:\n            raise HTTPException(500, "Telegram connection parameter is too long")\n\n        return {\n            "ok": True,\n            "business_id": business.id,\n            "telegram_url": f"https://t.me/{bot_username}?startapp={start_parameter}",\n            "expires_in": 600,\n        }\n\n\n@app.post("/account/connect-telegram-from-web")\ndef account_connect_telegram_from_web(\n    x: TelegramLinkIn,\n    x_telegram_init_data: str = Header(default=""),\n):\n    user = telegram_user(x_telegram_init_data)\n    telegram_id = int(user["id"])\n    prefix = "bookly-connect-"\n    if not x.token.startswith(prefix):\n        raise HTTPException(400, "Invalid Telegram connection token")\n\n    raw = x.token[len(prefix):]\n    token_hash = hashlib.sha256(raw.encode("utf-8")).hexdigest()\n\n    with SessionLocal() as db:\n        link = (\n            db.query(BooklyTelegramLink)\n            .filter(BooklyTelegramLink.token_hash == token_hash)\n            .filter(BooklyTelegramLink.used_at.is_(None))\n            .filter(BooklyTelegramLink.expires_at > datetime.utcnow())\n            .first()\n        )\n        if not link:\n            raise HTTPException(400, "Telegram connection link is invalid or expired")\n\n        account = db.get(BooklyAccount, link.account_id)\n        business = db.get(Business, link.business_id)\n        if not account or not business or account.business_id != business.id:\n            raise HTTPException(400, "Bookly account or business not found")\n\n        existing = (\n            db.query(BooklyAccount)\n            .filter(BooklyAccount.telegram_user_id == telegram_id)\n            .filter(BooklyAccount.id != account.id)\n            .first()\n        )\n        if existing:\n            raise HTTPException(409, "This Telegram account is already connected to another Bookly account")\n\n        from . import paddle_original\n        web_owner_id = -int(account.id)\n        if paddle_original._profile_trial_used(db, web_owner_id):\n            paddle_original._mark_profile_trial_used(db, telegram_id)\n\n        business.owner_telegram_id = telegram_id\n        account.telegram_user_id = telegram_id\n        link.used_at = datetime.utcnow()\n        db.commit()\n\n        return {\n            "ok": True,\n            "telegram_user_id": telegram_id,\n            "business_id": business.id,\n            "next": "open_admin",\n        }\n\n\n'''
              # The generated block imports os lazily at call time.
              block = block.replace('        from . import paddle_original\n        bot_username', '        import os\n        bot_username')
              s = s.replace(marker, block + marker)
          p.write_text(s)

          # Frontend: a connection start parameter must connect the Telegram
          # identity and then enter Admin, not the public client page.
          p = Path('frontend/src/main.tsx')
          s = p.read_text()
          old = '''  useEffect(()=>{\n    const telegram = tg();\n\ntelegram?.ready();\n\n    const startParam =\n      tg()?.initDataUnsafe?.start_param ||\n      new URLSearchParams(window.location.search).get('startapp') ||\n      '';\n\n    if(startParam){\n      setClientSlug(startParam);\n      setMode('client');\n    }\n  },[]);'''
          new = '''  useEffect(()=>{\n    const telegram = tg();\n    telegram?.ready();\n\n    const startParam =\n      tg()?.initDataUnsafe?.start_param ||\n      new URLSearchParams(window.location.search).get('startapp') ||\n      '';\n\n    if (startParam.startsWith('bookly-connect-')) {\n      fetch(API + '/account/connect-telegram-from-web', {\n        method: 'POST',\n        headers: {\n          'Content-Type': 'application/json',\n          'X-Telegram-Init-Data': initData()\n        },\n        body: JSON.stringify({ token: startParam })\n      })\n        .then(async (response) => {\n          const data = await response.json().catch(() => ({}));\n          if (!response.ok) {\n            throw new Error(data?.detail || 'Telegram connection failed');\n          }\n          return data;\n        })\n        .then((data) => {\n          if (data?.business_id) {\n            localStorage.setItem('bookly_active_business_id', String(data.business_id));\n          }\n          setAdminTab('home');\n          setMode('admin');\n        })\n        .catch((error) => {\n          console.error('Bookly Telegram connection error:', error);\n          alert(error?.message || 'Telegram connection failed');\n        });\n      return;\n    }\n\n    if(startParam){\n      setClientSlug(startParam);\n      setMode('client');\n    }\n  },[]);'''
          if old in s and "bookly-connect-" not in s:
              s = s.replace(old, new)
          p.write_text(s)

          # Index: no extra script is needed; main.tsx handles the start param.

          # Account page: show the generated Telegram URL by navigating there.
          p = Path('frontend/public/account.html')
          s = p.read_text()
          s = s.replace("var mode='login';", "var mode='login';")
          if "function connectTelegram" not in s:
              s = s.replace(
                  "function check(){if(!session)return;call('/account/me',{headers:{Authorization:'Bearer '+session}}).then(showAccount).catch(function(){localStorage.removeItem('bookly_session');session=''})}",
                  "function check(){if(!session)return;call('/account/me',{headers:{Authorization:'Bearer '+session}}).then(showAccount).catch(function(){localStorage.removeItem('bookly_session');session=''})}\nfunction connectTelegram(){clearErr();var btn=document.getElementById('connectTelegram');btn.disabled=true;call('/account/telegram-link',{headers:{Authorization:'Bearer '+session}}).then(function(d){if(!d.telegram_url)throw new Error('Telegram link was not created');location.href=d.telegram_url}).catch(function(e){err(e.message)}).finally(function(){btn.disabled=false})}"
              )
          p.write_text(s)

          print('Patched Bookly Telegram connection flow')

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git add backend/account_routes.py frontend/src/main.tsx frontend/public/account.html
          git commit -m "fix: complete Telegram account connection flow"
          git push
