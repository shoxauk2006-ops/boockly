name: Apply Bookly UI fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[bookly-ui-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('frontend/src/main.tsx')
          s = p.read_text(encoding='utf-8')

          # Add map picker component once.
          if 'function MapPicker({' not in s:
              marker = 'function Settings({'
              component = r'''function MapPicker({
            latitude,
            longitude,
            onSelect,
            onClose,
            t
          }: {
            latitude: number | null;
            longitude: number | null;
            onSelect: (lat: number, lng: number, address?: string) => void;
            onClose: () => void;
            t: (key: string, fallback?: string) => string;
          }) {
            const mapRef = useRef<HTMLDivElement | null>(null);
            const mapInstanceRef = useRef<any>(null);
            const markerRef = useRef<any>(null);
            const selectedRef = useRef<{ lat: number; lng: number; address?: string } | null>(
              latitude != null && longitude != null ? { lat: latitude, lng: longitude } : null
            );
            const [selected, setSelected] = useState<{ lat: number; lng: number; address?: string } | null>(selectedRef.current);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
              let cancelled = false;

              const loadLeaflet = () => new Promise<void>((resolve, reject) => {
                if ((window as any).L) {
                  resolve();
                  return;
                }
                const existing = document.querySelector('script[data-bookly-leaflet]') as HTMLScriptElement | null;
                if (existing) {
                  existing.addEventListener('load', () => resolve(), { once: true });
                  existing.addEventListener('error', () => reject(new Error('Leaflet failed')), { once: true });
                  return;
                }
                const link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
                link.dataset.booklyLeaflet = '1';
                document.head.appendChild(link);
                const script = document.createElement('script');
                script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
                script.async = true;
                script.dataset.booklyLeaflet = '1';
                script.onload = () => resolve();
                script.onerror = () => reject(new Error('Leaflet failed'));
                document.body.appendChild(script);
              });

              const init = async () => {
                try {
                  await loadLeaflet();
                  if (cancelled || !mapRef.current) return;
                  const L = (window as any).L;
                  const defaultLat = latitude ?? 41.3111;
                  const defaultLng = longitude ?? 69.2797;
                  const map = L.map(mapRef.current).setView(
                    [defaultLat, defaultLng],
                    latitude != null && longitude != null ? 16 : 12
                  );
                  mapInstanceRef.current = map;
                  L.tileLayer(
                    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
                    { attribution: '&copy; OpenStreetMap contributors' }
                  ).addTo(map);

                  const updatePoint = async (lat: number, lng: number) => {
                    if (!markerRef.current) {
                      markerRef.current = L.marker([lat, lng], { draggable: true }).addTo(map);
                      markerRef.current.on('dragend', () => {
                        const point = markerRef.current.getLatLng();
                        void updatePoint(point.lat, point.lng);
                      });
                    } else {
                      markerRef.current.setLatLng([lat, lng]);
                    }
                    map.panTo([lat, lng]);
                    const next = { lat, lng };
                    selectedRef.current = next;
                    setSelected(next);

                    try {
                      const response = await fetch(
                        `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lng)}&accept-language=${encodeURIComponent(getStoredLanguage())}`
                      );
                      const data = await response.json();
                      if (data?.display_name && !cancelled) {
                        const withAddress = { lat, lng, address: data.display_name };
                        selectedRef.current = withAddress;
                        setSelected(withAddress);
                      }
                    } catch {}
                  };

                  if (latitude != null && longitude != null) {
                    markerRef.current = L.marker([latitude, longitude], { draggable: true }).addTo(map);
                    markerRef.current.on('dragend', () => {
                      const point = markerRef.current.getLatLng();
                      void updatePoint(point.lat, point.lng);
                    });
                  }

                  map.on('click', (event: any) => {
                    void updatePoint(event.latlng.lat, event.latlng.lng);
                  });

                  setLoading(false);
                  setTimeout(() => map.invalidateSize(), 100);
                } catch (error) {
                  console.error('MAP PICKER ERROR:', error);
                  setLoading(false);
                }
              };

              void init();

              return () => {
                cancelled = true;
                if (mapInstanceRef.current) {
                  mapInstanceRef.current.remove();
                  mapInstanceRef.current = null;
                }
                markerRef.current = null;
              };
            }, []);

            const confirm = () => {
              if (selectedRef.current) {
                onSelect(
                  selectedRef.current.lat,
                  selectedRef.current.lng,
                  selectedRef.current.address
                );
              }
              onClose();
            };

            return (
              <div className="subscription-modal-overlay" onClick={onClose}>
                <div
                  className="subscription-modal"
                  onClick={e => e.stopPropagation()}
                  style={{ maxWidth: 620 }}
                >
                  <button type="button" className="subscription-modal-close" onClick={onClose}>×</button>
                  <span className="personal-eyebrow">BOOKLY</span>
                  <h2>{t('settings.mapTitle', 'Выберите адрес на карте')}</h2>
                  <p className="muted">
                    {t('settings.mapHint', 'Нажмите на карту или перетащите метку в нужное место.')}
                  </p>
                  <div
                    ref={mapRef}
                    style={{
                      width: '100%',
                      height: 360,
                      borderRadius: 14,
                      overflow: 'hidden',
                      marginTop: 12,
                      background: '#eee'
                    }}
                  />
                  {loading && <p className="muted" style={{ marginTop: 10 }}>{t('common.loading', 'Загрузка…')}</p>}
                  {selected && (
                    <p className="muted" style={{ marginTop: 10 }}>
                      {selected.address || `${selected.lat.toFixed(6)}, ${selected.lng.toFixed(6)}`}
                    </p>
                  )}
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, marginTop: 14 }}>
                    <button type="button" onClick={onClose}>{t('common.cancel', 'Отмена')}</button>
                    <button type="button" className="primary" disabled={!selected} onClick={confirm}>{t('common.confirm', 'Готово')}</button>
                  </div>
                </div>
              </div>
            );
          }

          '''
              if marker not in s:
                  raise SystemExit('Settings marker not found')
              s = s.replace(marker, component + marker, 1)

          if 'const [mapPickerOpen, setMapPickerOpen]' not in s:
              anchor = '  const [settingsTimezone, setSettingsTimezone] ='
              pos = s.find(anchor)
              if pos < 0:
                  raise SystemExit('Settings state anchor not found')
              s = s[:pos] + "  const [mapPickerOpen, setMapPickerOpen] = useState(false);\n" + s[pos:]

          old_map = '''        <div className="two">
          <input
            placeholder={t('settings.latitudeOptional')}
            value={latitude}
            onChange={e =>
              setLatitude(
                e.target.value
              )
            }
          />

          <input
            placeholder={t('settings.longitudeOptional')}
            value={longitude}
            onChange={e =>
              setLongitude(
                e.target.value
              )
            }
          />
        </div>'''
          new_map = '''        <button
          type="button"
          className="ghost full"
          onClick={() => setMapPickerOpen(true)}
        >
          {latitude !== '' && longitude !== ''
            ? t('settings.changeMapLocation', 'Изменить точку на карте')
            : t('settings.chooseMapLocation', 'Выбрать адрес на карте')}
        </button>

        {latitude !== '' && longitude !== '' && (
          <p className="muted">
            {Number(latitude).toFixed(6)}, {Number(longitude).toFixed(6)}
          </p>
        )}

        {mapPickerOpen && (
          <MapPicker
            latitude={latitude === '' ? null : Number(latitude)}
            longitude={longitude === '' ? null : Number(longitude)}
            onSelect={(lat, lng, selectedAddress) => {
              setLatitude(String(lat));
              setLongitude(String(lng));
              if (selectedAddress) setAddress(selectedAddress);
            }}
            onClose={() => setMapPickerOpen(false)}
            t={t}
          />
        )}'''
          if old_map in s:
              s = s.replace(old_map, new_map, 1)

          # Remove Services business contacts card and supporting state/function.
          start_fn = s.find('function Services(')
          if start_fn >= 0:
              card_start = s.find('      <div className="card">\n        <h2>\n          {t(\n            \'owner.businessContacts\'', start_fn)
              if card_start >= 0:
                  form_start = s.find('      <div\n  className="card"\n  ref={serviceFormRef}', card_start)
                  if form_start >= 0:
                      s = s[:card_start] + s[form_start:]

          state_block = '''  const [businessPhone, setBusinessPhone] =
    useState(business?.phone || '');

  const [businessAddress, setBusinessAddress] =
    useState(business?.address || '');

  const [savingBusiness, setSavingBusiness] =
    useState(false);
'''
          if state_block in s:
              s = s.replace(state_block, '', 1)

          effect_block = '''  useEffect(() => {
    setBusinessPhone(
      business?.phone || ''
    );

    setBusinessAddress(
      business?.address || ''
    );
  }, [business]);

'''
          if effect_block in s:
              s = s.replace(effect_block, '', 1)

          fn_start = s.find('  const saveBusinessContacts =')
          if fn_start >= 0:
              fn_end = s.find('  const saveService =', fn_start)
              if fn_end >= 0:
                  s = s[:fn_start] + s[fn_end:]

          # Auto-find next available date on client service selection.
          if 'MAX_DAYS_TO_SEARCH = 90' not in s:
              choose_start = s.find('  const chooseService = async (\n    service: any\n  ) => {')
              if choose_start >= 0:
                  choose_end = s.find('  const chooseTime =', choose_start)
                  if choose_end < 0:
                      raise SystemExit('chooseService end marker not found')
                  new_choose = '''  const chooseService = async (
    service: any
  ) => {
    setSelected(service);
    setSelectedTime('');
    setSlots([]);
    setSlotsLoading(true);
    setError('');

    try {
      const startDate = new Date(`${day}T12:00:00`);
      const MAX_DAYS_TO_SEARCH = 90;

      for (let offset = 0; offset < MAX_DAYS_TO_SEARCH; offset += 1) {
        const candidate = new Date(startDate);
        candidate.setDate(startDate.getDate() + offset);

        const candidateDay = [
          candidate.getFullYear(),
          String(candidate.getMonth() + 1).padStart(2, '0'),
          String(candidate.getDate()).padStart(2, '0')
        ].join('-');

        const response = await fetch(
          API +
            `/businesses/${business.id}/availability?service_id=${service.id}&day=${candidateDay}`
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data?.detail ||
            t('client.availabilityError')
          );
        }

        const candidateSlots = Array.isArray(data?.slots)
          ? data.slots
          : [];

        if (candidateSlots.length > 0) {
          setDay(candidateDay);
          setSlots(candidateSlots);
          return;
        }
      }

      setSlots([]);
    } catch (e) {
      console.error(
        'FIND NEXT AVAILABILITY ERROR:',
        e
      );
      setSlots([]);
      setError(t('client.availabilityError'));
    } finally {
      setSlotsLoading(false);
    }
  };

'''
                  s = s[:choose_start] + new_choose + s[choose_end:]

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/main.tsx
          git commit -m 'feat: map picker and next availability [bookly-ui-fix]' || exit 0
          git push

      - name: Validate build
        continue-on-error: true
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Remove temporary workflow
        if: always()
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          if [ -f .github/workflows/fix-service-i18n.yml ]; then
            git rm .github/workflows/fix-service-i18n.yml
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: remove temporary Bookly UI workflow [bookly-ui-fix]'
            git push
          fi
