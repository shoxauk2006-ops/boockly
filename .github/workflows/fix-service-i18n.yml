name: Fix service i18n

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[service-i18n-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch translations
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          main = Path('frontend/src/main.tsx')
          s = main.read_text(encoding='utf-8')

          old_label = """          <span>\n            Увеличить лимит услуг\n          </span>\n"""
          new_label = """          <span>\n            {t(\n              'owner.increaseServiceLimit',\n              'Увеличить лимит услуг'\n            )}\n          </span>\n"""
          if old_label in s:
              s = s.replace(old_label, new_label, 1)

          replacements = [
              ("<li>{t('owner.upToServices', 'До')} {currentServicesLimit} {t('owner.services', 'услуг')}</li>", "<li>{t('owner.servicesLimitText', '{limit} услуг').replace('{limit}', String(currentServicesLimit))}</li>"),
              ("<li>{t('owner.upToServices', 'До')} 10 {t('owner.services', 'услуг')}</li>", "<li>{t('owner.servicesLimitText', '{limit} услуг').replace('{limit}', '10')}</li>"),
              ("<span>\n  {t('owner.upToServices', 'До')} {option.limit} {t('owner.services', 'услуг')}\n                                {' '}\n", "<span>\n  {t('owner.servicesLimitText', '{limit} услуг').replace('{limit}', String(option.limit))}\n"),
              ("          >\n            {t('owner.upToServices', 'До')} {inactiveSelectedServiceLimit} {t('owner.services', 'услуг')}\n          </p>", "          >\n            {t('owner.servicesLimitText', '{limit} услуг').replace('{limit}', String(inactiveSelectedServiceLimit))}\n          </p>"),
          ]
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new)

          main.write_text(s, encoding='utf-8')

          i18n = Path('frontend/src/i18n.ts')
          text = i18n.read_text(encoding='utf-8')
          values = {
              'ru': 'До {limit} услуг',
              'en': 'Up to {limit} services',
              'uz': '{limit} ta gacha xizmat',
              'tr': '{limit} hizmete kadar',
              'ar': 'حتى {limit} خدمة',
          }
          for lang, value in values.items():
              pattern = re.compile(rf"(const {lang}: TranslationMap = \{{.*?)(\n\}};)", re.S)
              m = pattern.search(text)
              if not m:
                  raise SystemExit(f'missing language map: {lang}')
              section = m.group(1)
              if "'owner.servicesLimitText'" not in section:
                  section += f"\n  'owner.servicesLimitText': '{value}',"
              text = text[:m.start(1)] + section + text[m.end(1):]
          i18n.write_text(text, encoding='utf-8')
          PY

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/main.tsx frontend/src/i18n.ts
          git commit -m "Fix service limit translations [service-i18n-fix] [language-switch-fix]"
          git push
          git rm .github/workflows/fix-service-i18n.yml
          git commit -m "Remove temporary service i18n workflow [service-i18n-fix] [language-switch-fix]"
          git push
