name: Integrate specialists into client booking

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply specialist integration
        run: python scripts/integrate_specialists.py

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app.py frontend/src/main.tsx
          git diff --cached --check
          git diff --cached --stat
          git commit -m "feat: integrate specialists into client booking"
          git push

      - name: Remove temporary patch files
        if: always()
        run: |
          git rm -f scripts/integrate_specialists.py .github/workflows/integrate-specialists-client.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary specialist integration files" || true
          git push || true
