name: I18n client batch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message == 'Trigger i18n client batch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add only missing client translations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('frontend/src/i18n.ts')
          s = p.read_text(encoding='utf-8')
          blocks = {
          'uz': {
            'client.slugError':'Biznes havolasida slug mavjud emas.','client.businessInactive':'Bu biznes hozir faol emas.','client.businessNotFound':'Biznes topilmadi. Havola eskirgan yoki slug noto‘g‘ri bo‘lishi mumkin.','client.serverError':'Server xatosi:','client.businessDataError':'Server biznes ma’lumotlarini qaytarmadi.','client.saveBusinessError':'Saqlangan bizneslarni o‘zgartirib bo‘lmadi','client.availabilityError':'Bo‘sh vaqtni yuklab bo‘lmadi','client.enterName':'Ismingizni kiriting.','client.enterPhone':'Telefon raqamingizni kiriting.','client.bookingError':'Vaqtni band qilib bo‘lmadi.','client.bookingSuccess':'✅ Bron muvaffaqiyatli yaratildi!','client.bookingRetry':'Bronni bajarib bo‘lmadi. Yana bir bor urinib ko‘ring.','client.loadingBusiness':'Biznes yuklanmoqda...','client.openError':'Sahifani ochib bo‘lmadi','client.retry':'Qayta urinish','client.removeSaved':'Saqlanganlardan olib tashlash','client.noSavedBusinesses':'Hali saqlangan bizneslar yo‘q.','client.noSlots':'Bu sana uchun bo‘sh vaqt yo‘q.','client.bookingLoading':'Bron qilinmoqda...','client.savedBusiness':'Saqlangan','client.location':'Joylashuvni ochish','client.services':'Xizmatlar','client.phone':'Telefon raqami','client.name':'Ismingiz','client.yourData':'Ma’lumotlaringiz','client.myBookings':'Bronlarim','client.bookingCancelled':'Bron bekor qilindi','client.cancelBookingError':'Bronni bekor qilib bo‘lmadi','client.connectionError':'Ulanish xatosi'
          },
          'tr': {
            'client.slugError':'İşletme bağlantısında slug bulunmuyor.','client.businessInactive':'Bu işletme şu anda aktif değil.','client.businessNotFound':'İşletme bulunamadı. Bağlantı eski olabilir veya slug yanlış olabilir.','client.serverError':'Sunucu hatası:','client.businessDataError':'Sunucu işletme verilerini göndermedi.','client.saveBusinessError':'Kayıtlı işletmeler değiştirilemedi','client.availabilityError':'Müsait zamanlar yüklenemedi','client.enterName':'Adınızı girin.','client.enterPhone':'Telefon numaranızı girin.','client.bookingError':'Zaman rezerve edilemedi.','client.bookingSuccess':'✅ Rezervasyon başarıyla oluşturuldu!','client.bookingRetry':'Rezervasyon tamamlanamadı. Lütfen tekrar deneyin.','client.loadingBusiness':'İşletme yükleniyor...','client.openError':'Sayfa açılamadı','client.retry':'Tekrar dene','client.removeSaved':'Kayıtlılardan kaldır','client.noSavedBusinesses':'Henüz kayıtlı işletme yok.','client.noSlots':'Bu tarih için müsait zaman yok.','client.bookingLoading':'Rezerve ediliyor...','client.savedBusiness':'Kaydedildi','client.location':'Konumu aç','client.services':'Hizmetler','client.phone':'Telefon numarası','client.name':'Adınız','client.yourData':'Bilgileriniz','client.myBookings':'Rezervasyonlarım','client.bookingCancelled':'Rezervasyon iptal edildi','client.cancelBookingError':'Rezervasyon iptal edilemedi','client.connectionError':'Bağlantı hatası'
          },
          'ar': {
            'client.slugError':'رابط النشاط لا يحتوي على slug.','client.businessInactive':'هذا النشاط غير نشط حاليًا.','client.businessNotFound':'لم يتم العثور على النشاط. قد يكون الرابط قديمًا أو يحتوي على slug غير صحيح.','client.serverError':'خطأ في الخادم:','client.businessDataError':'لم يُرجع الخادم بيانات النشاط.','client.saveBusinessError':'تعذر تعديل الأنشطة المحفوظة','client.availabilityError':'تعذر تحميل الأوقات المتاحة','client.enterName':'أدخل اسمك.','client.enterPhone':'أدخل رقم هاتفك.','client.bookingError':'تعذر حجز الوقت.','client.bookingSuccess':'✅ تم إنشاء الحجز بنجاح!','client.bookingRetry':'تعذر إتمام الحجز. حاول مرة أخرى.','client.loadingBusiness':'جارٍ تحميل النشاط...','client.openError':'تعذر فتح الصفحة','client.retry':'إعادة المحاولة','client.removeSaved':'إزالة من المحفوظة','client.noSavedBusinesses':'لا توجد أنشطة محفوظة بعد.','client.noSlots':'لا توجد أوقات متاحة لهذا التاريخ.','client.bookingLoading':'جارٍ الحجز...','client.savedBusiness':'تم الحفظ','client.location':'فتح الموقع','client.services':'الخدمات','client.phone':'رقم الهاتف','client.name':'اسمك','client.yourData':'بياناتك','client.myBookings':'حجوزاتي','client.bookingCancelled':'تم إلغاء الحجز','client.cancelBookingError':'تعذر إلغاء الحجز','client.connectionError':'خطأ في الاتصال'
          }
          }
          for lang, values in blocks.items():
              m = re.search(rf"const {lang}: TranslationMap = \{{(.*?)\n\}};", s, re.S)
              if not m:
                  raise SystemExit(f'Missing {lang} block')
              body = m.group(1)
              additions = []
              for key, value in values.items():
                  if f"'{key}'" not in body:
                      additions.append(f"  '{key}':'{value}',")
              if additions:
                  body = body.rstrip() + "\n" + "\n".join(additions)
                  s = s[:m.start(1)] + body + s[m.end(1):]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Build frontend
        run: |
          npm install --prefix frontend --no-audit --no-fund
          npm run build --prefix frontend
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'bookly-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend/src/i18n.ts
          git commit -m 'i18n: complete client translations'
          git rm .github/workflows/i18n-client-batch.yml .i18n-client-batch-trigger
          git add .github/workflows/i18n-client-batch.yml .i18n-client-batch-trigger || true
          git commit -m 'chore: remove temporary i18n client workflow'
          git push
