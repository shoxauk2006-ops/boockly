name: Restore inactive subscription limit selector

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch subscription component
        shell: python
        run: |
          from pathlib import Path

          path = Path('frontend/src/main.tsx')
          text = path.read_text(encoding='utf-8')

          state_marker = "  const [subscriptionActionLoading, setSubscriptionActionLoading] =\n    useState(false);"
          state_insert = state_marker + "\n  const [inactiveLimitOptionsOpen, setInactiveLimitOptionsOpen] =\n    useState(false);\n  const [inactiveSelectedServiceLimit, setInactiveSelectedServiceLimit] =\n    useState(10);"

          if 'inactiveLimitOptionsOpen' not in text:
              if text.count(state_marker) != 1:
                  raise SystemExit('Subscription state marker not found exactly once')
              text = text.replace(state_marker, state_insert, 1)

          old = '''      <button
        className="primary full"
        onClick={() => checkout('paddle', business.id)}
      >
        {t('owner.openAccess', 'Открыть доступ')}
      </button>
'''

          new = '''      <div
        style={{
          marginTop: 20,
          paddingTop: 20,
          borderTop: '1px solid #eee'
        }}
      >
        <button
          type="button"
          onClick={() =>
            setInactiveLimitOptionsOpen(
              !inactiveLimitOptionsOpen
            )
          }
          style={{
            width: '100%',
            padding: '8px 0',
            border: 'none',
            background: 'transparent',
            color: '#111',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'space-between',
            fontSize: 16,
            fontWeight: 600,
            cursor: 'pointer'
          }}
        >
          <span>
            {t(
              'owner.increaseServiceLimit',
              'Увеличить лимит услуг'
            )}
          </span>
          <span style={{ fontSize: 20 }}>
            {inactiveLimitOptionsOpen ? '⌃' : '›'}
          </span>
        </button>

        {inactiveLimitOptionsOpen && (
          <div
            style={{
              display: 'grid',
              gap: 10,
              marginTop: 12
            }}
          >
            {[
              { limit: 20, price: '$4.99' },
              { limit: 30, price: '$7.99' },
              { limit: 50, price: '$11.99' },
              { limit: 100, price: '$19.99' }
            ].map(option => (
              <button
                key={option.limit}
                type="button"
                className="subscription-manage-button"
                onClick={() =>
                  setInactiveSelectedServiceLimit(option.limit)
                }
                style={{
                  display: 'flex',
                  justifyContent: 'space-between',
                  alignItems: 'center',
                  width: '100%',
                  border:
                    inactiveSelectedServiceLimit === option.limit
                      ? '2px solid #111'
                      : undefined
                }}
              >
                <span>
                  {t('owner.upToServices', 'До')} {option.limit} {t('owner.services', 'услуг')}
                </span>
                <strong>
                  {option.price} {t('owner.perMonth', '/ месяц')}
                </strong>
              </button>
            ))}
          </div>
        )}

        {inactiveSelectedServiceLimit > 10 && (
          <p
            className="muted"
            style={{ margin: '10px 0 0' }}
          >
            {t('owner.upToServices', 'До')} {inactiveSelectedServiceLimit} {t('owner.services', 'услуг')}
          </p>
        )}
      </div>

      <button
        className="primary full"
        onClick={() =>
          checkout(
            'paddle',
            business.id,
            inactiveSelectedServiceLimit
          )
        }
      >
        {t('owner.openAccess', 'Открыть доступ')}
      </button>
'''

          if old not in text:
              raise SystemExit('Inactive subscription payment button block not found exactly')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Verify source
        shell: bash
        run: |
          grep -q "inactiveLimitOptionsOpen" frontend/src/main.tsx
          grep -q "inactiveSelectedServiceLimit" frontend/src/main.tsx
          grep -q "owner.increaseServiceLimit" frontend/src/main.tsx
          grep -q "inactiveSelectedServiceLimit" frontend/src/main.tsx

      - name: Commit source and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/restore-inactive-subscription-limit.yml
          git add frontend/src/main.tsx .github/workflows/restore-inactive-subscription-limit.yml
          git commit -m "Restore inactive subscription limit selector"
          git push
