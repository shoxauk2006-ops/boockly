name: Remove Apple sign-in from account page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-apple-now.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Apple button and handler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('frontend/public/account-core.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="socials"><button class="social" id="googleBtn" type="button"><span>G</span> Continue with Google</button><button class="social" id="appleBtn" type="button"><span>●</span> Continue with Apple</button></div>'
          new='<div class="socials" style="grid-template-columns:1fr"><button class="social" id="googleBtn" type="button"><span>G</span> Continue with Google</button></div>'
          if old not in s:
              raise SystemExit('Apple button markup not found')
          s=s.replace(old,new,1)
          old_handler="document.getElementById('googleBtn').onclick=function(){err('Google sign-in will be enabled after OAuth provider configuration. Email registration is available now.')};document.getElementById('appleBtn').onclick=function(){err('Apple sign-in will be enabled after OAuth provider configuration. Email registration is available now.')};"
          new_handler="document.getElementById('googleBtn').onclick=function(){location.href=api+'/account/oauth/google/start'};"
          if old_handler not in s:
              raise SystemExit('Apple handler block not found')
          s=s.replace(old_handler,new_handler,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/public/account-core.html .github/workflows/remove-apple-now.yml
          git commit -m 'fix: remove Apple sign-in from account form [remove-apple-now]' || exit 0
          git push
