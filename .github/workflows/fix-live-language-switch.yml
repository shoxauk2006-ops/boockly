name: Apply temporary Bookly timezone patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[bookly-ui-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply timezone changes
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          # ---------- frontend ----------
          p = Path('frontend/src/main.tsx')
          s = p.read_text(encoding='utf-8')

          marker = "const getLocale = () =>\n  LOCALE_MAP[getStoredLanguage()] || 'en-US';\n"
          helper = marker + """
const getClientTimeZone = () => {
  try {
    return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
  } catch {
    return 'UTC';
  }
};

const getClientLocalDateKey = () => {
  const now = new Date();
  return [
    now.getFullYear(),
    String(now.getMonth() + 1).padStart(2, '0'),
    String(now.getDate()).padStart(2, '0')
  ].join('-');
};
"""
          if 'const getClientTimeZone = () =>' not in s:
              if marker not in s: raise SystemExit('locale marker not found')
              s = s.replace(marker, helper, 1)

          old = """  const [day, setDay] = useState(
    new Date()
      .toISOString()
      .slice(0, 10)
  );
"""
          new = """  const clientTimeZone = getClientTimeZone();

  const [day, setDay] = useState(
    getClientLocalDateKey()
  );
"""
          if old in s:
              s = s.replace(old, new, 1)
          elif 'const clientTimeZone = getClientTimeZone();' not in s:
              raise SystemExit('client day marker not found')

          s = s.replace(
              "`/businesses/${business.id}/availability?service_id=${service.id}&day=${selectedDay}`",
              "`/businesses/${business.id}/availability?service_id=${service.id}&day=${selectedDay}&time_zone=${encodeURIComponent(clientTimeZone)}`"
          )
          s = s.replace(
              "`/businesses/${business.id}/availability?service_id=${service.id}&day=${candidateDay}`",
              "`/businesses/${business.id}/availability?service_id=${service.id}&day=${candidateDay}&time_zone=${encodeURIComponent(clientTimeZone)}`"
          )

          old = """              day,
              start:
                selectedTime
            })
"""
          new = """              day,
              start:
                selectedTime,
              client_timezone:
                clientTimeZone
            })
"""
          if old not in s: raise SystemExit('booking payload marker not found')
          s = s.replace(old, new, 1)

          my_marker = "function MyBookings({t}:{t:(key:string,fallback?:string)=>string}) {\n  const [items, setItems] ="
          if my_marker in s and 'const myBookingsTimeZone = getClientTimeZone();' not in s:
              s = s.replace(my_marker, """function MyBookings({t}:{t:(key:string,fallback?:string)=>string}) {
  const myBookingsTimeZone = getClientTimeZone();

  const formatBookingDate = (item: any) => {
    if (!item?.start_at_utc) return item?.day || '';
    try {
      return new Intl.DateTimeFormat(getLocale(), {
        timeZone: myBookingsTimeZone,
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }).format(new Date(`${item.start_at_utc}Z`));
    } catch {
      return item?.day || '';
    }
  };

  const formatBookingTime = (item: any) => {
    if (!item?.start_at_utc || !item?.end_at_utc) {
      return `${item?.start?.slice(0, 5) || ''} – ${item?.end?.slice(0, 5) || ''}`;
    }
    try {
      const opts: Intl.DateTimeFormatOptions = {
        timeZone: myBookingsTimeZone,
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      };
      const start = new Intl.DateTimeFormat(getLocale(), opts).format(new Date(`${item.start_at_utc}Z`));
      const end = new Intl.DateTimeFormat(getLocale(), opts).format(new Date(`${item.end_at_utc}Z`));
      return `${start} – ${end}`;
    } catch {
      return `${item?.start?.slice(0, 5) || ''} – ${item?.end?.slice(0, 5) || ''}`;
    }
  };

  const [items, setItems] =""", 1)

          s = s.replace(
              "                📅 {item.day}\n",
              "                📅 {formatBookingDate(item)}\n",
              1,
          )
          old_time = """                🕐{' '}
                {item.start?.slice(
                  0,
                  5
                )}
                {' – '}
                {item.end?.slice(
                  0,
                  5
                )}
"""
          if old_time in s:
              s = s.replace(old_time, "                🕐 {formatBookingTime(item)}\n", 1)

          p.write_text(s, encoding='utf-8')

          # ---------- backend ----------
          p = Path('backend/app.py')
          s = p.read_text(encoding='utf-8')

          old = '        now = datetime.now()\n        today = now.date()\n'
          new = '        business_zone = _bookly_zone(business.timezone)\n        now = datetime.now(business_zone).replace(tzinfo=None)\n        today = now.date()\n'
          if old in s: s = s.replace(old, new, 1)

          old = '        today = datetime.now().date()\n\n        db.query(BlockedSlot).filter(\n'
          new = '        today = datetime.now(_bookly_zone(b.timezone)).date()\n\n        db.query(BlockedSlot).filter(\n'
          if old in s: s = s.replace(old, new, 1)

          old = '''        now_tashkent = datetime.now(
            ZoneInfo("Asia/Tashkent")
        ).replace(tzinfo=None)
'''
          new = '''        now_business = datetime.now(
            _bookly_zone(business.timezone)
        ).replace(tzinfo=None)
'''
          if old in s: s = s.replace(old, new, 1)
          s = s.replace('if start_dt <= now_tashkent:', 'if start_dt <= now_business:', 1)

          marker = '''                "day": booking.day.isoformat(),
                "start": booking.start.strftime("%H:%M"),
                "end": booking.end.strftime("%H:%M"),
                "status": booking.status
'''
          repl = '''                "day": booking.day.isoformat(),
                "start": booking.start.strftime("%H:%M"),
                "end": booking.end.strftime("%H:%M"),
                "start_at_utc": booking.start_at_utc.isoformat() if booking.start_at_utc else None,
                "end_at_utc": booking.end_at_utc.isoformat() if booking.end_at_utc else None,
                "status": booking.status
'''
          if marker in s: s = s.replace(marker, repl, 1)

          p.write_text(s, encoding='utf-8')
          PY
          python3 -m py_compile backend/app.py
          cd frontend
          npm ci --silent
          npm run build
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/main.tsx backend/app.py
          git diff --cached --check
          git commit -m 'Apply timezone display fixes [bookly-ui-patch]'
          git push
