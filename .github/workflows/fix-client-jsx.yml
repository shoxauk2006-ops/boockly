name: Fix client JSX build

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix specialist booking JSX
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/main.tsx')
          s = p.read_text()

          start = s.find('          {(!specialists.length || selectedSpecialist) && (')
          if start < 0:
              raise SystemExit('Specialist booking opening not found')

          opening = '          {(!specialists.length || selectedSpecialist) && (\n            <div className="card">'
          if opening not in s[start:]:
              raise SystemExit('Expected specialist booking opening not found')

          s = s.replace(opening,
                        '          {(!specialists.length || selectedSpecialist) && (\n            <>\n              <div className="card">', 1)

          bad = '          </div>\n        )}\n\n        </>\n      )}\n\n    </section>'
          good = '          </div>\n            </>\n          )}\n\n        </>\n      )}\n\n    </section>'
          if bad not in s[start:]:
              raise SystemExit('Expected specialist booking closing boundary not found')

          s = s.replace(bad, good, 1)
          p.write_text(s)
          PY

      - name: Verify frontend build
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/main.tsx .github/workflows/fix-client-jsx.yml
          git commit -m "fix: correct specialist booking JSX wrapper"
          git rm .github/workflows/fix-client-jsx.yml
          git commit -m "chore: remove temporary JSX fix workflow"
          git push