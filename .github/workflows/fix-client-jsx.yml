name: Fix client JSX build

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix specialist booking JSX
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/main.tsx')
          s = p.read_text()

          start = s.find('          {(!specialists.length || selectedSpecialist) && (')
          if start < 0:
              raise SystemExit('Specialist booking opening not found')

          opening_end = s.find('\n', start)
          next_line_end = s.find('\n', opening_end + 1)
          next_line = s[opening_end + 1:next_line_end]
          if '<>' not in s[opening_end + 1:next_line_end + 1]:
              s = s[:opening_end + 1] + '            <>\n' + s[opening_end + 1:]

          # Close the fragment immediately before the conditional expression's closing )}.
          boundary = s.find('\n        </>\n      )}\n\n    </section>', start)
          if boundary < 0:
              raise SystemExit('Outer Client section boundary not found')

          prefix = s[:boundary]
          closing = '          </div>\n        )}'
          pos = prefix.rfind(closing)
          if pos < 0:
              raise SystemExit('Specialist booking closing div not found')

          replacement = '          </div>\n            </>\n          )}'
          s = prefix[:pos] + prefix[pos:].replace(closing, replacement, 1) + s[boundary:]
          p.write_text(s)
          PY

      - name: Verify frontend build
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/main.tsx .github/workflows/fix-client-jsx.yml
          git commit -m "fix: correct specialist booking JSX wrapper"
          git rm .github/workflows/fix-client-jsx.yml
          git commit -m "chore: remove temporary JSX fix workflow"
          git push