name: Fix client JSX build

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix adjacent JSX elements
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/main.tsx')
          s = p.read_text()

          opening = '''          {(!specialists.length || selectedSpecialist) && (\n            <div className="card">'''
          wrapped_opening = '''          {(!specialists.length || selectedSpecialist) && (\n            <div className="client-booking-flow">\n            <div className="card">'''

          if opening in s:
              s = s.replace(opening, wrapped_opening, 1)
          elif 'client-booking-flow' not in s:
              raise SystemExit('Specialist booking opening pattern not found')

          closing = '''          </div>\n        )}\n\n        </>\n      )}\n\n    </section>'''
          wrapped_closing = '''          </div>\n          </div>\n        )}\n\n        </>\n      )}\n\n    </section>'''

          if closing in s:
              s = s.replace(closing, wrapped_closing, 1)
          elif wrapped_closing not in s:
              raise SystemExit('Specialist booking closing pattern not found')

          p.write_text(s)
          PY

      - name: Verify frontend build
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/main.tsx .github/workflows/fix-client-jsx.yml
          git commit -m "fix: wrap specialist booking flow in JSX container"
          git rm .github/workflows/fix-client-jsx.yml
          git commit -m "chore: remove temporary JSX fix workflow"
          git push