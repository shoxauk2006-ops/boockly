name: Fix client JSX build

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix specialist booking JSX
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('frontend/src/main.tsx')
          s = p.read_text()

          marker = '          {(!specialists.length || selectedSpecialist) && ('
          start = s.find(marker)
          if start < 0:
              raise SystemExit('Specialist booking opening not found')

          # The conditional renders three sibling blocks (date, time, booking form),
          # so they must be wrapped in a fragment.
          after = s[start:]
          opening_pattern = re.escape(marker) + r'\n\s*<div className="card">'
          fixed, count = re.subn(
              opening_pattern,
              marker + '\n            <>\n              <div className="card">',
              after,
              count=1,
          )
          if count != 1:
              raise SystemExit('Specialist booking fragment opening was not repaired')

          # Remove the stray div immediately before this conditional closes and
          # replace it with the fragment close. Keep the outer Client fragment intact.
          closing_pattern = r'\n\s*</div>\n\s*\)}\n\n\s*</>\n\s*\)}\n\n\s*</section>'
          fixed2, count = re.subn(
              closing_pattern,
              '\n            </>\n          )}\n\n        </>\n      )}\n\n    </section>',
              fixed,
              count=1,
          )
          if count != 1:
              raise SystemExit('Specialist booking fragment closing was not repaired')

          s = s[:start] + fixed2
          p.write_text(s)
          PY

      - name: Verify repaired JSX
        working-directory: frontend
        run: |
          grep -n -A125 -B5 "(!specialists.length || selectedSpecialist)" src/main.tsx
          npm install
          npm run build

      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/main.tsx .github/workflows/fix-client-jsx.yml
          git commit -m "fix: repair specialist booking JSX"
          git rm .github/workflows/fix-client-jsx.yml
          git commit -m "chore: remove temporary JSX fix workflow"
          git push