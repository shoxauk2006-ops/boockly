name: Bookly client photo fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply client business photo styling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/style.css')
          s = p.read_text()

          marker = '/* Bookly client business photo polish */'
          if marker in s:
              raise SystemExit('Photo styling already applied')

          s += '''\n\n/* Bookly client business photo polish */\n#bookly-personal-shell .bookly-business-card img {\n  width: 72px !important;\n  height: 72px !important;\n  display: block;\n  object-fit: cover;\n  object-position: center;\n  border: 0 !important;\n  border-radius: 16px !important;\n  box-shadow: none !important;\n  background: #f3f4f6;\n}\n'''

          p.write_text(s)
          PY

      - name: Commit change and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bookly-photo-fix.yml
          git add frontend/src/style.css
          git commit -m "Polish client business photo"
          git push
