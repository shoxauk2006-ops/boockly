name: oneoff-timezone-refactor
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UTC timezone backend refactor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app.py')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              'from datetime import date, time, datetime, timedelta',
              'from datetime import date, time, datetime, timedelta, timezone'
          )
          text = text.replace(
              'from typing import Optional\n',
              'from typing import Optional\nfrom zoneinfo import ZoneInfo\n'
          )

          old = '''class BlockedSlot(Base):\n    __tablename__ = "blocked_slots"\n    id: Mapped[int] = mapped_column(Integer, primary_key=True)\n    business_id: Mapped[int] = mapped_column(ForeignKey("businesses.id"), index=True)\n    day: Mapped[date] = mapped_column(Date)\n    start: Mapped[time] = mapped_column(Time)\n    end: Mapped[time] = mapped_column(Time)\n    reason: Mapped[str] = mapped_column(String(255), default="")\n'''
          new = '''class BlockedSlot(Base):\n    __tablename__ = "blocked_slots"\n    id: Mapped[int] = mapped_column(Integer, primary_key=True)\n    business_id: Mapped[int] = mapped_column(ForeignKey("businesses.id"), index=True)\n    day: Mapped[date] = mapped_column(Date)\n    start: Mapped[time] = mapped_column(Time)\n    end: Mapped[time] = mapped_column(Time)\n    start_at_utc: Mapped[Optional[datetime]] = mapped_column(DateTime, nullable=True, index=True)\n    end_at_utc: Mapped[Optional[datetime]] = mapped_column(DateTime, nullable=True, index=True)\n    reason: Mapped[str] = mapped_column(String(255), default="")\n'''
          if old not in text:
              raise SystemExit('BlockedSlot model marker not found')
          text = text.replace(old, new, 1)

          old = '''    day: Mapped[date] = mapped_column(Date)\n    start: Mapped[time] = mapped_column(Time)\n    end: Mapped[time] = mapped_column(Time)\n\n    status: Mapped[str] = mapped_column(String(20), default="confirmed")\n'''
          new = '''    day: Mapped[date] = mapped_column(Date)\n    start: Mapped[time] = mapped_column(Time)\n    end: Mapped[time] = mapped_column(Time)\n    start_at_utc: Mapped[Optional[datetime]] = mapped_column(DateTime, nullable=True, index=True)\n    end_at_utc: Mapped[Optional[datetime]] = mapped_column(DateTime, nullable=True, index=True)\n    client_timezone: Mapped[str] = mapped_column(String(64), default="UTC")\n\n    status: Mapped[str] = mapped_column(String(20), default="confirmed")\n'''
          if old not in text:
              raise SystemExit('Booking time marker not found')
          text = text.replace(old, new, 1)

          old = '''@app.post("/admin/blocks")\ndef admin_block(x:BlockIn,x_telegram_init_data:str=Header(default="")):\n    user=telegram_user(x_telegram_init_data)\n    if x.start>=x.end:raise HTTPException(400,"Invalid time range")\n    with SessionLocal() as db:\n        b=owner_business(db,int(user["id"]))\n        if not b:raise HTTPException(400,"Create business first")\n        z=BlockedSlot(business_id=b.id,**x.model_dump());db.add(z);db.commit();db.refresh(z);return z\n'''
          new = '''@app.post("/admin/blocks")\ndef admin_block(x:BlockIn,x_telegram_init_data:str=Header(default="")):\n    user=telegram_user(x_telegram_init_data)\n    if x.start>=x.end:raise HTTPException(400,"Invalid time range")\n    with SessionLocal() as db:\n        b=owner_business(db,int(user["id"]))\n        if not b:raise HTTPException(400,"Create business first")\n        start_local = datetime.combine(x.day, x.start, tzinfo=_bookly_zone(b.timezone))\n        end_local = datetime.combine(x.day, x.end, tzinfo=_bookly_zone(b.timezone))\n        z=BlockedSlot(\n            business_id=b.id,\n            **x.model_dump(),\n            start_at_utc=_bookly_to_utc(start_local),\n            end_at_utc=_bookly_to_utc(end_local),\n        )\n        db.add(z);db.commit();db.refresh(z);return z\n'''
          if old not in text:
              raise SystemExit('admin_block marker not found')
          text = text.replace(old, new, 1)

          old = '''def is_free(db,business_id:int,day:date,st:time,en:time):\n    overlap=db.query(Booking).filter(Booking.business_id==business_id,Booking.day==day,Booking.status=="confirmed",Booking.start<en,Booking.end>st).first()\n    blocked=db.query(BlockedSlot).filter(BlockedSlot.business_id==business_id,BlockedSlot.day==day,BlockedSlot.start<en,BlockedSlot.end>st).first()\n    return not overlap and not blocked\n'''
          new = '''def _bookly_zone(name: str | None):\n    try:\n        return ZoneInfo(name or "Asia/Tashkent")\n    except Exception:\n        return ZoneInfo("Asia/Tashkent")\n\n\ndef _bookly_to_utc(value: datetime) -> datetime:\n    if value.tzinfo is None:\n        raise ValueError("Timezone-aware datetime required")\n    return value.astimezone(timezone.utc).replace(tzinfo=None)\n\n\ndef _bookly_from_utc(value: datetime | None, zone: str) -> datetime | None:\n    if value is None:\n        return None\n    aware = value.replace(tzinfo=timezone.utc)\n    return aware.astimezone(_bookly_zone(zone))\n\n\ndef _bookly_utc_overlap_exists(db, business_id: int, start_at_utc: datetime, end_at_utc: datetime):\n    booking = db.query(Booking).filter(\n        Booking.business_id == business_id,\n        Booking.status == "confirmed",\n        Booking.start_at_utc.is_not(None),\n        Booking.start_at_utc < end_at_utc,\n        Booking.end_at_utc > start_at_utc\n    ).first()\n    if booking:\n        return True\n\n    blocked = db.query(BlockedSlot).filter(\n        BlockedSlot.business_id == business_id,\n        BlockedSlot.start_at_utc.is_not(None),\n        BlockedSlot.start_at_utc < end_at_utc,\n        BlockedSlot.end_at_utc > start_at_utc\n    ).first()\n    return bool(blocked)\n\n\ndef is_free(db,business_id:int,day:date,st:time,en:time, timezone_name: str | None = None):\n    zone = _bookly_zone(timezone_name or "Asia/Tashkent")\n    start_local = datetime.combine(day, st, tzinfo=zone)\n    end_local = datetime.combine(day, en, tzinfo=zone)\n    start_at_utc = _bookly_to_utc(start_local)\n    end_at_utc = _bookly_to_utc(end_local)\n\n    if _bookly_utc_overlap_exists(db, business_id, start_at_utc, end_at_utc):\n        return False\n\n    # Legacy rows created before the UTC migration.\n    overlap=db.query(Booking).filter(Booking.business_id==business_id,Booking.day==day,Booking.status=="confirmed",Booking.start<en,Booking.end>st,Booking.start_at_utc.is_(None)).first()\n    blocked=db.query(BlockedSlot).filter(BlockedSlot.business_id==business_id,BlockedSlot.day==day,BlockedSlot.start<en,BlockedSlot.end>st,BlockedSlot.start_at_utc.is_(None)).first()\n    return not overlap and not blocked\n'''
          if old not in text:
              raise SystemExit('is_free marker not found')
          text = text.replace(old, new, 1)

          marker = 'Base.metadata.create_all(engine)\n\ndef ensure_subscription_schema():'
          insert = '''Base.metadata.create_all(engine)\n\ndef ensure_timezone_schema():\n    """Add UTC timestamp columns and migrate legacy local date/time values."""\n    with engine.begin() as conn:\n        inspector = inspect(conn)\n        dialect = engine.dialect.name\n        timestamp_type = "TIMESTAMP" if dialect == "postgresql" else "DATETIME"\n\n        if "bookings" in inspector.get_table_names():\n            columns = {c["name"] for c in inspector.get_columns("bookings")}\n            for column_name in ("start_at_utc", "end_at_utc", "client_timezone"):\n                if column_name not in columns:\n                    column_definition = (\n                        f"{timestamp_type}" if column_name != "client_timezone"\n                        else "VARCHAR(64) DEFAULT 'UTC'"\n                    )\n                    conn.execute(text(f"ALTER TABLE bookings ADD COLUMN {column_name} {column_definition}"))\n\n        if "blocked_slots" in inspector.get_table_names():\n            columns = {c["name"] for c in inspector.get_columns("blocked_slots")}\n            for column_name in ("start_at_utc", "end_at_utc"):\n                if column_name not in columns:\n                    conn.execute(text(f"ALTER TABLE blocked_slots ADD COLUMN {column_name} {timestamp_type}"))\n\n    # Use ORM only after columns exist.\n    with SessionLocal() as db:\n        bookings = db.query(Booking).filter(Booking.start_at_utc.is_(None)).all()\n        for booking in bookings:\n            business = db.get(Business, booking.business_id)\n            if not business:\n                continue\n            zone = _bookly_zone(business.timezone)\n            booking.start_at_utc = _bookly_to_utc(datetime.combine(booking.day, booking.start, tzinfo=zone))\n            booking.end_at_utc = _bookly_to_utc(datetime.combine(booking.day, booking.end, tzinfo=zone))\n            if not booking.client_timezone:\n                booking.client_timezone = "UTC"\n\n        blocks = db.query(BlockedSlot).filter(BlockedSlot.start_at_utc.is_(None)).all()\n        for block in blocks:\n            business = db.get(Business, block.business_id)\n            if not business:\n                continue\n            zone = _bookly_zone(business.timezone)\n            block.start_at_utc = _bookly_to_utc(datetime.combine(block.day, block.start, tzinfo=zone))\n            block.end_at_utc = _bookly_to_utc(datetime.combine(block.day, block.end, tzinfo=zone))\n\n        db.commit()\n\n\nensure_timezone_schema()\n\ndef ensure_subscription_schema():'''
          if marker not in text:
              raise SystemExit('schema insertion marker not found')
          text = text.replace(marker, insert, 1)

          old = '''class BookingIn(BaseModel):\n    business_id: int\n    service_id: int\n    client_telegram_id: int = 0\n    client_name: str = "Telegram user"\n    client_phone: str = ""\n    day: date\n    start: time\n'''
          new = '''class BookingIn(BaseModel):\n    business_id: int\n    service_id: int\n    client_telegram_id: int = 0\n    client_name: str = "Telegram user"\n    client_phone: str = ""\n    day: date\n    start: time\n    start_at_utc: Optional[datetime] = None\n    client_timezone: str = "UTC"\n'''
          if old not in text:
              raise SystemExit('BookingIn marker not found')
          text = text.replace(old, new, 1)

          # Admin-created booking now writes UTC timestamps too.
          old = '''        booking = Booking(\n            business_id=business.id,\n            service_id=service.id,\n            client_telegram_id=0,\n            client_name=x.client_name.strip(),\n            client_phone=x.client_phone.strip(),\n            day=x.day,\n            start=x.start,\n            end=end_dt.time(),\n            status="confirmed"\n        )\n'''
          new = '''        business_zone = _bookly_zone(business.timezone)\n        start_local = datetime.combine(x.day, x.start, tzinfo=business_zone)\n        end_local = start_local + timedelta(minutes=service.duration_min)\n\n        booking = Booking(\n            business_id=business.id,\n            service_id=service.id,\n            client_telegram_id=0,\n            client_name=x.client_name.strip(),\n            client_phone=x.client_phone.strip(),\n            day=x.day,\n            start=x.start,\n            end=end_dt.time(),\n            start_at_utc=_bookly_to_utc(start_local),\n            end_at_utc=_bookly_to_utc(end_local),\n            client_timezone=business.timezone,\n            status="confirmed"\n        )\n'''
          if old not in text:
              raise SystemExit('admin booking model marker not found')
          text = text.replace(old, new, 1)

          # Replace availability endpoint with UTC-aware implementation.
          start_marker = '@app.get("/businesses/{business_id}/availability")\ndef availability('
          start = text.find(start_marker)
          end = text.find('\n@app.post("/bookings")', start)
          if start == -1 or end == -1:
              raise SystemExit('availability endpoint bounds not found')

          new_endpoint = r'''@app.get("/businesses/{business_id}/availability")
def availability(
    business_id: int,
    service_id: int,
    day: date,
    time_zone: Optional[str] = None
):
    with SessionLocal() as db:
        b = db.get(Business, business_id)
        s = db.get(Service, service_id)

        if not b or not s or s.business_id != business_id or not s.active:
            raise HTTPException(404, "Not found")

        business_zone_name = b.timezone or "Asia/Tashkent"
        client_zone_name = time_zone or business_zone_name
        business_zone = _bookly_zone(business_zone_name)
        client_zone = _bookly_zone(client_zone_name)

        # Requested day belongs to the client. Check adjacent business dates
        # because timezone conversion can cross midnight.
        business_days = [
            day - timedelta(days=1),
            day,
            day + timedelta(days=1),
        ]

        bookings = db.query(Booking.start_at_utc, Booking.end_at_utc, Booking.day, Booking.start, Booking.end).filter(
            Booking.business_id == business_id,
            Booking.status == "confirmed"
        ).all()

        blocked_slots = db.query(BlockedSlot.start_at_utc, BlockedSlot.end_at_utc, BlockedSlot.day, BlockedSlot.start, BlockedSlot.end).filter(
            BlockedSlot.business_id == business_id
        ).all()

        now_business = datetime.now(business_zone)
        slots = []
        step = s.duration_min

        for business_day in business_days:
            work_windows = get_work_windows(db, business_id, business_day)

            for win_start, win_end in work_windows:
                cursor = datetime.combine(business_day, win_start, tzinfo=business_zone)
                endday = datetime.combine(business_day, win_end, tzinfo=business_zone)

                while cursor + timedelta(minutes=s.duration_min) <= endday:
                    slot_end = cursor + timedelta(minutes=s.duration_min)

                    if business_day == now_business.date() and cursor <= now_business:
                        cursor += timedelta(minutes=step)
                        continue

                    start_utc = _bookly_to_utc(cursor)
                    end_utc = _bookly_to_utc(slot_end)

                    booking_overlap = False
                    for booking_start_utc, booking_end_utc, legacy_day, legacy_start, legacy_end in bookings:
                        if booking_start_utc is not None and booking_end_utc is not None:
                            if booking_start_utc < end_utc and booking_end_utc > start_utc:
                                booking_overlap = True
                                break
                        elif legacy_day == business_day and legacy_start < slot_end.time() and legacy_end > cursor.time():
                            booking_overlap = True
                            break

                    blocked_overlap = False
                    for block_start_utc, block_end_utc, legacy_day, legacy_start, legacy_end in blocked_slots:
                        if block_start_utc is not None and block_end_utc is not None:
                            if block_start_utc < end_utc and block_end_utc > start_utc:
                                blocked_overlap = True
                                break
                        elif legacy_day == business_day and legacy_start < slot_end.time() and legacy_end > cursor.time():
                            blocked_overlap = True
                            break

                    if not booking_overlap and not blocked_overlap:
                        client_start = cursor.astimezone(client_zone)
                        client_end = slot_end.astimezone(client_zone)
                        if client_start.date() == day:
                            if time_zone:
                                slots.append({
                                    "start_at_utc": cursor.astimezone(timezone.utc).isoformat().replace("+00:00", "Z"),
                                    "end_at_utc": slot_end.astimezone(timezone.utc).isoformat().replace("+00:00", "Z"),
                                    "date": client_start.date().isoformat(),
                                    "start": client_start.strftime("%H:%M"),
                                    "end": client_end.strftime("%H:%M"),
                                })
                            else:
                                slots.append(client_start.strftime("%H:%M"))

                    cursor += timedelta(minutes=step)

        return {"slots": slots}
'''
          text = text[:start] + new_endpoint + text[end:]

          # Make create_booking prefer UTC slot timestamps and persist both UTC and local business values.
          start_marker = '@app.post("/bookings")\ndef create_booking('
          start = text.find(start_marker)
          end = text.find('\n@app.post("/bookings/{booking_id}/cancel")', start)
          if start == -1 or end == -1:
              raise SystemExit('create_booking bounds not found')
          block = text[start:end]

          old = '''        end = (\n            datetime.combine(x.day, x.start)\n            + timedelta(minutes=s.duration_min)\n        ).time()\n\n        if not is_free(\n            db,\n            x.business_id,\n            x.day,\n            x.start,\n            end\n        ):\n'''
          new = '''        business_zone = _bookly_zone(b.timezone)\n\n        if x.start_at_utc is not None:\n            if x.start_at_utc.tzinfo is None:\n                raise HTTPException(400, "start_at_utc must include timezone")\n            start_utc_aware = x.start_at_utc.astimezone(timezone.utc)\n            end_utc_aware = start_utc_aware + timedelta(minutes=s.duration_min)\n            local_start = start_utc_aware.astimezone(business_zone)\n            local_end = end_utc_aware.astimezone(business_zone)\n            local_day = local_start.date()\n            local_start_time = local_start.time().replace(tzinfo=None)\n            local_end_time = local_end.time().replace(tzinfo=None)\n        else:\n            local_day = x.day\n            local_start_time = x.start\n            local_start = datetime.combine(local_day, local_start_time, tzinfo=business_zone)\n            end_local = local_start + timedelta(minutes=s.duration_min)\n            local_end = end_local\n            local_end_time = end_local.time()\n            start_utc_aware = local_start.astimezone(timezone.utc)\n            end_utc_aware = end_local.astimezone(timezone.utc)\n\n        if _bookly_utc_overlap_exists(\n            db,\n            x.business_id,\n            start_utc_aware.replace(tzinfo=None),\n            end_utc_aware.replace(tzinfo=None)\n        ):\n            raise HTTPException(\n                409,\n                "This time is no longer available"\n            )\n\n        if x.start_at_utc is None and not is_free(\n            db,\n            x.business_id,\n            local_day,\n            local_start_time,\n            local_end_time,\n            business_zone_name := b.timezone\n        ):\n'''
          if old not in block:
              raise SystemExit('create booking time calculation marker not found')
          block = block.replace(old, new, 1)

          old = '''        booking = Booking(\n            **x.model_dump(),\n            end=end\n        )\n'''
          new = '''        booking = Booking(\n            business_id=x.business_id,\n            service_id=x.service_id,\n            client_telegram_id=x.client_telegram_id,\n            client_name=x.client_name,\n            client_phone=x.client_phone,\n            day=local_day,\n            start=local_start_time,\n            end=local_end_time,\n            start_at_utc=start_utc_aware.replace(tzinfo=None),\n            end_at_utc=end_utc_aware.replace(tzinfo=None),\n            client_timezone=x.client_timezone or "UTC",\n        )\n'''
          if old not in block:
              raise SystemExit('create booking model marker not found')
          block = block.replace(old, new, 1)

          # Client notification uses the client's timezone.
          old = '''                    f"📅 {booking.day.isoformat()}\\n"\n                    f"🕐 {booking.start.strftime('%H:%M')}–"\n                    f"{booking.end.strftime('%H:%M')}\\n"'''
          new = '''                    f"📅 {_bookly_from_utc(booking.start_at_utc, booking.client_timezone).strftime('%Y-%m-%d')}\\n"\n                    f"🕐 {_bookly_from_utc(booking.start_at_utc, booking.client_timezone).strftime('%H:%M')}–"\n                    f"{_bookly_from_utc(booking.end_at_utc, booking.client_timezone).strftime('%H:%M')}\\n"'''
          if old not in block:
              raise SystemExit('client notification marker not found')
          block = block.replace(old, new, 1)

          text = text[:start] + block + text[end:]

          # Client-side cancellation owner notification remains business-local.
          path.write_text(text, encoding='utf-8')
          PY

          python -m py_compile backend/app.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app.py
          git commit -m 'Implement UTC booking timezone foundation'
          git push

      - name: Remove one-off workflow
        run: |
          rm -f .github/workflows/oneoff-timezone-refactor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove one-off timezone refactor workflow' || true
          git push || true
