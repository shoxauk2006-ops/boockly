name: Fix client specialist flow

on:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite client specialist flow
        shell: python
        run: |
          from pathlib import Path

          path = Path('frontend/src/main.tsx')
          text = path.read_text(encoding='utf-8')

          old = '''          setServices(\n            data.services || []\n          );'''
          new = '''          setServices(\n            data.services || []\n          );\n\n          try {\n            const specialistsResponse = await fetch(\n              API + `/businesses/${data.business.id}/specialists`\n            );\n\n            if (specialistsResponse.ok) {\n              const specialistsData = await specialistsResponse.json();\n              setSpecialists(\n                Array.isArray(specialistsData)\n                  ? specialistsData.filter((item: any) => item?.active !== false)\n                  : []\n              );\n            } else {\n              setSpecialists([]);\n            }\n          } catch (specialistsError) {\n            console.error('CLIENT SPECIALISTS LOAD ERROR:', specialistsError);\n            setSpecialists([]);\n          }'''
          if old not in text:
              raise SystemExit('initial specialist insertion marker not found')
          if new not in text:
              text = text.replace(old, new, 1)

          start = text.index('  const chooseService = async (service: any) => {')
          end = text.index('\n  const chooseTime = (', start)
          replacement = '''  const chooseService = async (service: any) => {\n    if (!business) return;\n\n    setSelected(service);\n    setSelectedTime('');\n    setSlots([]);\n    setError('');\n    setSlotsLoading(true);\n\n    try {\n      await findFirstAvailableDay(service, selectedSpecialist);\n    } catch (e) {\n      console.error('SERVICE AVAILABILITY ERROR:', e);\n      setSlots([]);\n      setError(t('client.availabilityError'));\n    } finally {\n      setSlotsLoading(false);\n    }\n  };\n\n  const chooseSpecialist = (specialist: any) => {\n    setSelectedSpecialist(specialist);\n    setSelected(null);\n    setSelectedTime('');\n    setSlots([]);\n    setDay(getClientLocalDateKey());\n    setError('');\n  };\n'''
          text = text[:start] + replacement + text[end:]

          ui_start = text.index("      <h2>\n        {t('client.services')}")
          ui_end = text.index('\n\n    </section>', ui_start)
          ui = '''      {specialists.length > 0 ? (\n        <>\n          <h2>{t('client.chooseSpecialist', 'Выберите специалиста')}</h2>\n          {!selectedSpecialist ? (\n            <div className="card">\n              <div style={{ display: 'grid', gap: 10 }}>\n                {specialists.map((specialist) => (\n                  <button type="button" key={specialist.id} className="full" onClick={() => chooseSpecialist(specialist)} style={{ display: 'flex', alignItems: 'center', gap: 12, textAlign: 'left' }}>\n                    {specialist.photo ? (\n                      <img src={specialist.photo} alt={specialist.name} style={{ width: 52, height: 52, borderRadius: '50%', objectFit: 'cover', flexShrink: 0 }} />\n                    ) : (\n                      <span style={{ width: 52, height: 52, borderRadius: '50%', background: '#f0f1f3', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 700, flexShrink: 0 }}>\n                        {String(specialist.name || '?').charAt(0).toUpperCase()}\n                      </span>\n                    )}\n                    <span style={{ display: 'grid', gap: 2 }}>\n                      <strong>{specialist.name}</strong>\n                      {specialist.position && <small style={{ opacity: 0.7 }}>{specialist.position}</small>}\n                    </span>\n                  </button>\n                ))}\n              </div>\n            </div>\n          ) : (\n            <>\n              <div className="card">\n                <button type="button" className="ghost full" onClick={() => { setSelectedSpecialist(null); setSelected(null); setSelectedTime(''); setSlots([]); setDay(getClientLocalDateKey()); }}>\n                  ← {t('client.chooseSpecialist', 'Выбрать специалиста')}\n                </button>\n                <p style={{ margin: '12px 0 0', fontWeight: 600 }}>{selectedSpecialist.name}</p>\n              </div>\n\n              <h2>{t('client.services')}</h2>\n              {(() => {\n                const specialistServices = selectedSpecialist.service_ids?.length\n                  ? services.filter((service: any) => selectedSpecialist.service_ids.includes(service.id))\n                  : services;\n                return specialistServices.length === 0 ? (\n                  <div className="card"><p>{t('client.noServices')}</p></div>\n                ) : specialistServices.map((service: any) => (\n                  <div className={selected?.id === service.id ? 'client-service-card selected' : 'client-service-card'} key={service.id}>\n                    <div className="client-service-info">\n                      <strong>{service.name}</strong>\n                      <div className="client-service-meta">{money(service.price, service.currency)}<span>·</span>{service.duration_min} {t('owner.minutes')}</div>\n                      {service.description && <p>{service.description}</p>}\n                    </div>\n                    <button className="client-service-button" onClick={() => chooseService(service)}>{t('client.chooseService')}</button>\n                  </div>\n                ));\n              })()}\n            </>\n          )}\n        </>\n      ) : (\n        <>\n          <h2>{t('client.services')}</h2>\n          {services.length === 0 ? (\n            <div className="card"><p>{t('client.noServices')}</p></div>\n          ) : services.map((service: any) => (\n            <div className={selected?.id === service.id ? 'client-service-card selected' : 'client-service-card'} key={service.id}>\n              <div className="client-service-info">\n                <strong>{service.name}</strong>\n                <div className="client-service-meta">{money(service.price, service.currency)}<span>·</span>{service.duration_min} {t('owner.minutes')}</div>\n                {service.description && <p>{service.description}</p>}\n              </div>\n              <button className="client-service-button" onClick={() => chooseService(service)}>{t('client.chooseService')}</button>\n            </div>\n          ))}\n        </>\n      )}\n\n      {selected && (\n        <>\n          <div className="card">\n            <h2>{t('client.chooseDate')}</h2>\n            <input type="date" min={getClientLocalDateKey()} value={day} onChange={async e => { const newDay = e.target.value; setDay(newDay); setSelectedTime(''); await loadSlots(selected, newDay, selectedSpecialist); }} />\n          </div>\n\n          <div className="card">\n            <h2>{t('client.chooseTime')}</h2>\n            {slotsLoading ? <p className="muted">{t('owner.loadingSlots')}</p> : slots.length > 0 ? (\n              <div className="slots">{slots.map(time => <button key={time} className={selectedTime === time ? 'selected' : ''} onClick={() => chooseTime(time)}>{time}</button>)}</div>\n            ) : <p>{t('client.noSlots')}</p>}\n          </div>\n\n          {selectedTime && (\n            <div id="booking-form" className="card">\n              <h2>{t('client.yourData')}</h2>\n              <div className="success">\n                <b>{selected.name}</b>\n                <br />\n                {selectedSpecialist?.name && <>{selectedSpecialist.name}<br /></>}\n                {day} · {selectedTime}\n              </div>\n              <input type="text" placeholder={t('client.name')} value={clientName} onChange={e => setClientName(e.target.value)} />\n              <PhoneInput value={phone} onChange={setPhone} placeholder={t('client.phone')} />\n              <button className="primary full" disabled={bookingLoading} onClick={submitBooking}>\n                {bookingLoading ? t('client.bookingLoading') : t('client.confirmBooking')}\n              </button>\n            </div>\n          )}\n        </>\n      )}'''
          text = text[:ui_start] + ui + text[ui_end:]
          path.write_text(text, encoding='utf-8')

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
          if [ -f tsconfig.json ]; then npx tsc --noEmit; fi

      - name: Commit verified fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/main.tsx
          git commit -m "fix: correct client specialist booking order" || true
          git push
          git rm .github/workflows/fix-client-specialist-flow.yml
          git commit -m "chore: remove temporary specialist flow workflow"
          git push
