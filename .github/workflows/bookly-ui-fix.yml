name: Bookly UI fix

on:
  push:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix UI strings
        shell: python
        run: |
          from pathlib import Path

          path = Path('frontend/src/main.tsx')
          text = path.read_text(encoding='utf-8')

          old = '''        <p className="muted">\n          {message}\n        </p>'''
          new = '''        <p className="muted">\n          {message.replace(/\\\\n/g, '\\n')}\n        </p>'''
          if old in text:
              text = text.replace(old, new)

          text = text.replace(
              '>Как работает Bookly</button>',
              ">{t('info.howBooklyWorks')}</button>"
          )
          text = text.replace(
              '>Правила и контакты</button>',
              ">{t('info.rulesAndContacts')}</button>"
          )

          path.write_text(text, encoding='utf-8')

      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/main.tsx
          git rm .github/workflows/bookly-ui-fix.yml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix Bookly UI translations and line breaks"
          git push
