name: _tmp_apply_utc
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Complete UTC backend refactor
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('backend/app.py')
          s = p.read_text(encoding='utf-8')

          # 1) Client booking payload carries the client's IANA timezone.
          old = '''class BookingIn(BaseModel):\n    business_id: int\n    service_id: int\n    client_telegram_id: int = 0\n    client_name: str = "Telegram user"\n    client_phone: str = ""\n    day: date\n    start: time\n'''
          new = '''class BookingIn(BaseModel):\n    business_id: int\n    service_id: int\n    client_telegram_id: int = 0\n    client_name: str = "Telegram user"\n    client_phone: str = ""\n    day: date\n    start: time\n    client_timezone: str = "UTC"\n'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'client_timezone: str = "UTC"' not in s:
              raise SystemExit('BookingIn marker not found')

          # 2) Availability: build slots in business timezone, return them in client timezone.
          start_marker = '@app.get("/businesses/{business_id}/availability")\ndef availability('
          a = s.find(start_marker)
          b = s.find('\n@app.post("/bookings")', a)
          if a == -1 or b == -1:
              raise SystemExit('availability bounds not found')
          endpoint = '''@app.get("/businesses/{business_id}/availability")\ndef availability(\n    business_id: int,\n    service_id: int,\n    day: date,\n    time_zone: Optional[str] = None\n):\n    with SessionLocal() as db:\n        b = db.get(Business, business_id)\n        s = db.get(Service, service_id)\n\n        if not b or not s or s.business_id != business_id or not s.active:\n            raise HTTPException(404, "Not found")\n\n        business_zone = _bookly_zone(b.timezone)\n        client_zone = _bookly_zone(time_zone or b.timezone)\n        now_business = datetime.now(business_zone)\n\n        bookings = db.query(\n            Booking.start_at_utc,\n            Booking.end_at_utc,\n            Booking.day,\n            Booking.start,\n            Booking.end\n        ).filter(\n            Booking.business_id == business_id,\n            Booking.status == "confirmed"\n        ).all()\n\n        blocked_slots = db.query(\n            BlockedSlot.start_at_utc,\n            BlockedSlot.end_at_utc,\n            BlockedSlot.day,\n            BlockedSlot.start,\n            BlockedSlot.end\n        ).filter(\n            BlockedSlot.business_id == business_id\n        ).all()\n\n        slots = []\n        seen = set()\n\n        # One client-local day can overlap adjacent business-local days.\n        for business_day in (\n            day - timedelta(days=1),\n            day,\n            day + timedelta(days=1)\n        ):\n            for win_start, win_end in get_work_windows(\n                db,\n                business_id,\n                business_day\n            ):\n                cursor = datetime.combine(\n                    business_day,\n                    win_start,\n                    tzinfo=business_zone\n                )\n                endday = datetime.combine(\n                    business_day,\n                    win_end,\n                    tzinfo=business_zone\n                )\n\n                while cursor + timedelta(minutes=s.duration_min) <= endday:\n                    slot_end = cursor + timedelta(minutes=s.duration_min)\n\n                    if business_day == now_business.date() and cursor <= now_business:\n                        cursor += timedelta(minutes=s.duration_min)\n                        continue\n\n                    start_utc = _bookly_to_utc(cursor)\n                    end_utc = _bookly_to_utc(slot_end)\n                    occupied = False\n\n                    for bs, be, legacy_day, legacy_start, legacy_end in bookings:\n                        if bs is not None and be is not None:\n                            if bs < end_utc and be > start_utc:\n                                occupied = True\n                                break\n                        elif (\n                            legacy_day == business_day\n                            and legacy_start < slot_end.time()\n                            and legacy_end > cursor.time()\n                        ):\n                            occupied = True\n                            break\n\n                    if not occupied:\n                        for bs, be, legacy_day, legacy_start, legacy_end in blocked_slots:\n                            if bs is not None and be is not None:\n                                if bs < end_utc and be > start_utc:\n                                    occupied = True\n                                    break\n                            elif (\n                                legacy_day == business_day\n                                and legacy_start < slot_end.time()\n                                and legacy_end > cursor.time()\n                            ):\n                                occupied = True\n                                break\n\n                    if not occupied:\n                        client_local = start_utc.replace(\n                            tzinfo=timezone.utc\n                        ).astimezone(client_zone)\n                        if client_local.date() == day:\n                            value = client_local.strftime("%H:%M")\n                            if value not in seen:\n                                seen.add(value)\n                                slots.append(value)\n\n                    cursor += timedelta(minutes=s.duration_min)\n\n        slots.sort()\n        return {"slots": slots}\n'''
          s = s[:a] + endpoint + s[b:]

          # 3) Availability checks use UTC. Keep legacy fallback for unmigrated rows.
          a = s.find('def is_free(db,business_id:int,day:date,st:time,en:time,timezone_name: str | None = None):')
          if a == -1:
              a = s.find('def is_free(db, business_id: int, day: date, st: time, en: time, timezone_name: str | None = None):')
          if a == -1:
              raise SystemExit('is_free function not found')
          b = s.find('\n@app.get("/businesses/{slug}")', a)
          if b == -1:
              raise SystemExit('is_free end not found')
          helper = '''def is_free(db, business_id: int, day: date, st: time, en: time, timezone_name: str | None = None):\n    zone = _bookly_zone(timezone_name or "Asia/Tashkent")\n    start_at_utc = _bookly_to_utc(datetime.combine(day, st, tzinfo=zone))\n    end_at_utc = _bookly_to_utc(datetime.combine(day, en, tzinfo=zone))\n\n    booking = db.query(Booking).filter(\n        Booking.business_id == business_id,\n        Booking.status == "confirmed",\n        Booking.start_at_utc.is_not(None),\n        Booking.end_at_utc.is_not(None),\n        Booking.start_at_utc < end_at_utc,\n        Booking.end_at_utc > start_at_utc,\n    ).first()\n    if booking:\n        return False\n\n    blocked = db.query(BlockedSlot).filter(\n        BlockedSlot.business_id == business_id,\n        BlockedSlot.start_at_utc.is_not(None),\n        BlockedSlot.end_at_utc.is_not(None),\n        BlockedSlot.start_at_utc < end_at_utc,\n        BlockedSlot.end_at_utc > start_at_utc,\n    ).first()\n    if blocked:\n        return False\n\n    legacy_booking = db.query(Booking).filter(\n        Booking.business_id == business_id,\n        Booking.day == day,\n        Booking.status == "confirmed",\n        Booking.start_at_utc.is_(None),\n        Booking.start < en,\n        Booking.end > st,\n    ).first()\n    legacy_block = db.query(BlockedSlot).filter(\n        BlockedSlot.business_id == business_id,\n        BlockedSlot.day == day,\n        BlockedSlot.start_at_utc.is_(None),\n        BlockedSlot.start < en,\n        BlockedSlot.end > st,\n    ).first()\n    return not legacy_booking and not legacy_block\n'''
          s = s[:a] + helper + s[b:]

          # 4) Client booking: selected time is in client timezone. Store exact UTC instant,
          # while keeping day/start/end in business timezone for admin UI compatibility.
          a = s.find('@app.post("/bookings")\ndef create_booking(')
          b = s.find('\n@app.post("/bookings/{booking_id}/cancel")', a)
          if a == -1 or b == -1:
              raise SystemExit('create_booking bounds not found')
          block = s[a:b]

          pattern = re.compile(
              r'        end = \(.*?'
              r'        if not is_free\(.*?'
              r'        \):\n',
              re.S
          )
          replacement = '''        client_zone = _bookly_zone(x.client_timezone)\n        selected_local = datetime.combine(\n            x.day,\n            x.start,\n            tzinfo=client_zone\n        )\n        start_at_utc = _bookly_to_utc(selected_local)\n        end_at_utc = start_at_utc + timedelta(minutes=s.duration_min)\n\n        business_zone = _bookly_zone(b.timezone)\n        business_start = start_at_utc.replace(\n            tzinfo=timezone.utc\n        ).astimezone(business_zone)\n        business_end = end_at_utc.replace(\n            tzinfo=timezone.utc\n        ).astimezone(business_zone)\n\n        if not is_free(\n            db,\n            b.id,\n            business_start.date(),\n            business_start.time(),\n            business_end.time(),\n            b.timezone\n        ):\n'''
          block2, n = pattern.subn(replacement, block, count=1)
          if n != 1:
              raise SystemExit('create booking time block not found')

          ctor_pattern = re.compile(
              r'        booking_data = x\.model_dump\(\)\n'
              r'        booking = Booking\(\n.*?'
              r'        \)\n',
              re.S
          )
          ctor_replacement = '''        booking = Booking(\n            business_id=x.business_id,\n            service_id=x.service_id,\n            client_telegram_id=x.client_telegram_id,\n            client_name=x.client_name,\n            client_phone=x.client_phone,\n            day=business_start.date(),\n            start=business_start.time(),\n            end=business_end.time(),\n            start_at_utc=start_at_utc,\n            end_at_utc=end_at_utc,\n            client_timezone=x.client_timezone,\n            status="confirmed"\n        )\n'''
          block3, n = ctor_pattern.subn(ctor_replacement, block2, count=1)
          if n != 1:
              raise SystemExit('create booking constructor not found')
          s = s[:a] + block3 + s[b:]

          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile backend/app.py
          git config user.name "bookly-bot"
          git config user.email "bookly-bot@users.noreply.github.com"
          git add backend/app.py
          git diff --cached --check
          git commit -m "Make booking availability and storage timezone aware"
          git push origin main
