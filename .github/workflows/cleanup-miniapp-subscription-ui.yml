name: Cleanup Mini App subscription UI

on:
  push:
    paths:
      - '.github/workflows/cleanup-miniapp-subscription-ui.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove obsolete Mini App subscription controls
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('frontend/src/main.tsx')
          text = path.read_text(encoding='utf-8')

          # The current file contains an orphaned legacy limit-management block
          # left after the old Mini App subscription UI was removed.
          pattern = re.compile(
              r"\n\s*const nextPrice = priceByLimit\[limit\];.*?\n\s*const load = async \(\) => \{",
              re.S,
          )
          text, removed = pattern.subn("\n  const load = async () => {", text, count=1)
          if removed != 1:
              raise SystemExit(f'Expected exactly one legacy limit block, found {removed}')

          # Remove the now-useless client-side subscription-limit refresh.
          pattern = re.compile(
              r"\n\s*// Загружаем актуальный лимит подписки с сервера\.\n\s*try \{\n\s*const businessResponse = await fetch\(\n\s*API \+ '/admin/business',\n\s*\{ headers: headers\(\) \}\n\s*\);\n\n\s*if \(businessResponse\.ok\) \{\n\s*const businessData =\n\s*await businessResponse\.json\(\);\n\n\s*\n\s*\}\n\s*\} catch \(error\) \{\n\s*console\.error\(\n\s*'LOAD SERVICE LIMIT ERROR:',\n\s*error\n\s*\);\n\s*\}\n",
              re.S,
          )
          text, removed_refresh = pattern.subn("\n", text, count=1)
          if removed_refresh != 1:
              raise SystemExit(f'Expected exactly one obsolete service-limit refresh, found {removed_refresh}')

          forbidden = [
              '/admin/subscription/preview-limit',
              '/admin/subscription/change-limit',
              'confirmServiceLimitChange',
              'priceByLimit',
              'newServiceLimit',
              'limitPreview',
              'setLimitPreview',
              'setLimitModalOpen',
              'setSavingServiceLimit',
              'setLimitSaving',
          ]
          leftovers = [item for item in forbidden if item in text]
          if leftovers:
              raise SystemExit('Legacy Mini App subscription references remain: ' + ', '.join(leftovers))

          path.write_text(text, encoding='utf-8')

      - name: Commit cleanup and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/main.tsx
          git commit -m "Remove obsolete Mini App subscription controls"
          git push
          rm -f .github/workflows/cleanup-miniapp-subscription-ui.yml
          git add .github/workflows/cleanup-miniapp-subscription-ui.yml
          git commit -m "Remove one-time cleanup workflow"
          git push
