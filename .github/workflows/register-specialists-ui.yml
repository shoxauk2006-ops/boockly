name: Register specialists UI

on:
  push:
    paths:
      - 'frontend/src/Specialists.tsx'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch main.tsx
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/main.tsx')
          text = path.read_text()

          import_marker = "import './style.css';"
          import_add = "import Specialists from './Specialists';"
          if import_add not in text:
              if import_marker not in text:
                  raise SystemExit('style import marker not found')
              text = text.replace(import_marker, import_marker + "\n" + import_add, 1)

          render_marker = "      {tab === 'services' && ("
          render_add = """      {tab === 'specialists' && (\n        <Specialists\n          services={services}\n          reload={load}\n          t={t}\n        />\n      )}\n\n"""
          if "{tab === 'specialists' && (" not in text:
              if render_marker not in text:
                  raise SystemExit('services render marker not found')
              text = text.replace(render_marker, render_add + render_marker, 1)

          more_marker = "      <button\n        className=\"admin-more-item\"\n        onClick={() => setTab('hours')}"
          more_add = """      <button\n        className=\"admin-more-item\"\n        onClick={() => setTab('specialists')}\n      >\n        <span>{t('nav.specialists', 'Специалисты')}</span>\n        <b>→</b>\n      </button>\n\n"""
          if "setTab('specialists')" not in text:
              if more_marker not in text:
                  raise SystemExit('more menu marker not found')
              text = text.replace(more_marker, more_add + more_marker, 1)

          path.write_text(text)
          PY
          python -m py_compile frontend/src/main.tsx 2>/dev/null || true
      - name: Commit UI registration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/main.tsx
          git commit -m 'Add specialists section to admin' || exit 0
          git push
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/register-specialists-ui.yml
          git add .github/workflows/register-specialists-ui.yml
          git commit -m 'Remove temporary specialists UI workflow' || exit 0
          git push
