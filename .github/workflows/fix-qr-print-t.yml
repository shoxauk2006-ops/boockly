name: Fix QR print white screen

on:
  push:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix undefined translator in QrPrintCard
        shell: python
        run: |
          from pathlib import Path

          path = Path('frontend/src/main.tsx')
          text = path.read_text(encoding='utf-8')

          old = "alt={t('owner.qrBookingAlt', 'QR-код для записи')}"
          new = 'alt="QR-код для записи"'

          if old not in text:
              raise SystemExit('Expected QR print alt expression was not found')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/main.tsx
          git rm .github/workflows/fix-qr-print-t.yml
          git commit -m "Fix QR print white screen"
          git push
