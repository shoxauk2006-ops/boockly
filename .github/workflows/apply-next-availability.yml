name: Apply next availability fix

on:
  push:
    paths:
      - '.github/workflows/apply-next-availability.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch client availability behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/main.tsx')
          text = path.read_text(encoding='utf-8')

          old = '''  const chooseService = async (\n    service: any\n  ) => {\n    setSelected(service);\n    setSelectedTime('');\n\n    await loadSlots(\n      service,\n      day\n    );\n  };'''

          new = '''  const chooseService = async (\n    service: any\n  ) => {\n    setSelected(service);\n    setSelectedTime('');\n    setSlots([]);\n    setSlotsLoading(true);\n    setError('');\n\n    try {\n      // Start from the currently selected day and automatically move\n      // forward until the first day with at least one real free slot.\n      // This prevents an empty today/tomorrow from looking like a bug.\n      const startDate = new Date(`${day}T12:00:00`);\n      const MAX_DAYS_TO_SEARCH = 90;\n\n      for (let offset = 0; offset < MAX_DAYS_TO_SEARCH; offset += 1) {\n        const candidate = new Date(startDate);\n        candidate.setDate(startDate.getDate() + offset);\n\n        const candidateDay = [\n          candidate.getFullYear(),\n          String(candidate.getMonth() + 1).padStart(2, '0'),\n          String(candidate.getDate()).padStart(2, '0')\n        ].join('-');\n\n        const response = await fetch(\n          API +\n            `/businesses/${business.id}/availability?service_id=${service.id}&day=${candidateDay}`\n        );\n\n        const data = await response.json();\n\n        if (!response.ok) {\n          throw new Error(\n            data?.detail ||\n            t('client.availabilityError')\n          );\n        }\n\n        const candidateSlots = Array.isArray(data?.slots)\n          ? data.slots\n          : [];\n\n        if (candidateSlots.length > 0) {\n          setDay(candidateDay);\n          setSlots(candidateSlots);\n          return;\n        }\n      }\n\n      // No availability in the search window. Keep the selected day\n      // and show the normal empty-state message.\n      setSlots([]);\n    } catch (e) {\n      console.error(\n        'FIND NEXT AVAILABILITY ERROR:',\n        e\n      );\n      setSlots([]);\n      setError(t('client.availabilityError'));\n    } finally {\n      setSlotsLoading(false);\n    }\n  };'''

          if old not in text:
              raise SystemExit('Client chooseService block not found')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          print('Patched frontend/src/main.tsx')
          PY

      - name: Verify patch
        run: |
          grep -n "MAX_DAYS_TO_SEARCH" frontend/src/main.tsx
          grep -n "FIND NEXT AVAILABILITY ERROR" frontend/src/main.tsx

      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/main.tsx .github/workflows/apply-next-availability.yml
          git commit -m "Automatically select next available booking day" || exit 0
          git push

      - name: Remove one-time workflow
        if: success()
        run: |
          rm -f .github/workflows/apply-next-availability.yml
          git add .github/workflows/apply-next-availability.yml
          git commit -m "Remove one-time availability patch workflow" || exit 0
          git push
