name: Temporary i18n entry repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Repair entries
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('frontend/src/i18n.ts')
          text = p.read_text(encoding='utf-8')

          keys = [
              'owner.increaseServiceLimitConfirm',
              'owner.decreaseServiceLimitConfirm',
              'owner.scheduledLimitChangeTitle',
              'owner.scheduledLimitChangeDescription',
          ]

          for key in keys:
              text = text.replace(
                  '\\n  ' + key + ':',
                  '\n  ' + repr(key) + ':'
              )

          if '\\n  owner.increaseServiceLimitConfirm:' in text:
              raise SystemExit('Unquoted increase key remains')
          if '\\n  owner.decreaseServiceLimitConfirm:' in text:
              raise SystemExit('Unquoted decrease key remains')
          if '\\n  owner.scheduledLimitChangeTitle:' in text:
              raise SystemExit('Unquoted title key remains')
          if '\\n  owner.scheduledLimitChangeDescription:' in text:
              raise SystemExit('Unquoted description key remains')

          p.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/i18n.ts
          git commit -m "Fix subscription translation entries" || exit 0
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          if [ -f .github/workflows/tmp-fix-i18n-entries.yml ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm .github/workflows/tmp-fix-i18n-entries.yml
            git commit -m "Remove temporary i18n repair workflow"
            git push
          fi
