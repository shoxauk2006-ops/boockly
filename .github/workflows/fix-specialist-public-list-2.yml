name: Add public specialist list endpoint

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[specialist-list-fix-2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Insert endpoint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/app.py')
          s = p.read_text(encoding='utf-8')
          marker = '@app.get("/businesses/{slug}")'
          if '@app.get("/businesses/{business_id}/specialists")' in s:
              print('specialist endpoint already exists')
          else:
              endpoint = '''@app.get("/businesses/{business_id}/specialists")
          def business_specialists(business_id: int, service_id: Optional[int] = None):
              with SessionLocal() as db:
                  business = db.get(Business, business_id)
                  if not business:
                      raise HTTPException(404, "Not found")

                  query = db.query(Specialist).filter(
                      Specialist.business_id == business_id,
                      Specialist.active == True
                  )

                  if service_id is not None:
                      service = db.get(Service, service_id)
                      if not service or service.business_id != business_id or not service.active:
                          raise HTTPException(404, "Not found")
                      query = query.join(
                          SpecialistService,
                          SpecialistService.specialist_id == Specialist.id
                      ).filter(SpecialistService.service_id == service_id)

                  rows = query.order_by(Specialist.id.asc()).all()
                  result = []
                  for item in rows:
                      service_ids = [
                          int(row[0])
                          for row in db.query(SpecialistService.service_id)
                          .filter(SpecialistService.specialist_id == item.id)
                          .all()
                      ]
                      result.append({
                          "id": item.id,
                          "name": item.name,
                          "position": item.position or "",
                          "description": item.description or "",
                          "photo": item.photo or "",
                          "service_ids": service_ids,
                      })
                  return result

          '''
              if marker not in s:
                  raise SystemExit('business slug endpoint marker not found')
              s = s.replace(marker, endpoint + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Validate backend
        run: python3 -m py_compile backend/app.py backend/specialists_api.py backend/paddle_app.py

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app.py
          git commit -m 'fix: add public specialist list endpoint [specialist-list-fix-2]'
          git push

      - name: Remove workflow
        if: always()
        run: |
          git fetch origin main
          git reset --hard origin/main
          if [ -f .github/workflows/fix-specialist-public-list-2.yml ]; then
            git rm .github/workflows/fix-specialist-public-list-2.yml
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: remove specialist list workflow [specialist-list-fix-2]'
            git push
          fi
