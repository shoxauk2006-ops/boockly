# --- Bookly OAuth (Google / Apple) ---
OAUTH_STATE_SECONDS = 600
OAUTH_HANDOFF_SECONDS = 600
BOOKLY_FRONTEND_URL = os.getenv(
    "BOOKLY_FRONTEND_URL",
    "https://boockly-73y5ili9l-shoxauk2006-4950s-projects.vercel.app",
).rstrip("/")
BOOKLY_PUBLIC_API_URL = os.getenv(
    "BOOKLY_PUBLIC_API_URL",
    "https://boockly-3.onrender.com",
).rstrip("/")


def _oauth_redirect(provider: str) -> str:
    return f"{BOOKLY_PUBLIC_API_URL}/account/oauth/{provider}/callback"


def _oauth_frontend_error() -> RedirectResponse:
    return RedirectResponse(f"{BOOKLY_FRONTEND_URL}/account.html?oauth_error=1", status_code=303)


def _oauth_form_post(url: str, data: dict[str, str]) -> dict:
    payload = urllib.parse.urlencode(data).encode("utf-8")
    req = urllib.request.Request(
        url,
        data=payload,
        headers={"Content-Type": "application/x-www-form-urlencoded"},
        method="POST",
    )
    try:
        with urllib.request.urlopen(req, timeout=20) as response:
            return json.loads(response.read().decode("utf-8"))
    except Exception as exc:
        raise HTTPException(502, f"OAuth provider request failed: {exc}")


def _oauth_get_json(url: str, headers: dict[str, str] | None = None) -> dict:
    req = urllib.request.Request(url, headers=headers or {}, method="GET")
    try:
        with urllib.request.urlopen(req, timeout=20) as response:
            return json.loads(response.read().decode("utf-8"))
    except Exception as exc:
        raise HTTPException(502, f"OAuth provider request failed: {exc}")


def _oauth_new_account(db, email: str) -> BooklyAccount:
    account = BooklyAccount(
        email=email,
        password_hash=_hash_password(secrets.token_urlsafe(32)),
    )
    db.add(account)
    db.flush()
    slug = f"account-{account.id}-{secrets.token_hex(4)}"
    business = Business(owner_telegram_id=-account.id, name="My Business", slug=slug)
    db.add(business)
    db.flush()
    db.execute(
        text("UPDATE businesses SET account_id = :account_id WHERE id = :business_id"),
        {"account_id": account.id, "business_id": business.id},
    )
    account.business_id = business.id
    return account


def _oauth_finish(provider: str, subject: str, email: str) -> tuple[str, bool]:
    email = (email or "").strip().lower()
    subject = (subject or "").strip()
    if not subject or not email or "@" not in email:
        raise HTTPException(400, "OAuth account did not provide a valid identity")
    field = BooklyAccount.google_sub if provider == "google" else BooklyAccount.apple_sub
    with SessionLocal() as db:
        account = db.query(BooklyAccount).filter(field == subject).first()
        is_new = False
        if not account:
            account = db.query(BooklyAccount).filter(BooklyAccount.email == email).first()
            if account:
                setattr(account, "google_sub" if provider == "google" else "apple_sub", subject)
            else:
                account = _oauth_new_account(db, email)
                setattr(account, "google_sub" if provider == "google" else "apple_sub", subject)
                is_new = True
        raw = secrets.token_urlsafe(40)
        db.add(BooklyOAuthHandoff(
            token_hash=hashlib.sha256(raw.encode("utf-8")).hexdigest(),
            account_id=account.id,
            expires_at=datetime.utcnow() + timedelta(seconds=OAUTH_HANDOFF_SECONDS),
        ))
        db.commit()
        return raw, is_new


@app.get("/account/oauth/google/start")
def account_oauth_google_start(response: object = None):
    client_id = os.getenv("GOOGLE_CLIENT_ID", "").strip()
    client_secret = os.getenv("GOOGLE_CLIENT_SECRET", "").strip()
    if not client_id or not client_secret:
        raise HTTPException(503, "Google OAuth is not configured")
    state = secrets.token_urlsafe(32)
    params = {
        "client_id": client_id,
        "redirect_uri": _oauth_redirect("google"),
        "response_type": "code",
        "scope": "openid email profile",
        "state": state,
        "access_type": "online",
        "prompt": "select_account",
    }
    target = "https://accounts.google.com/o/oauth2/v2/auth?" + urllib.parse.urlencode(params)
    out = RedirectResponse(target, status_code=303)
    out.set_cookie("bookly_oauth_state_google", state, max_age=OAUTH_STATE_SECONDS, httponly=True, secure=True, samesite="lax")
    return out


@app.get("/account/oauth/google/callback")
def account_oauth_google_callback(request: Request):
    client_id = os.getenv("GOOGLE_CLIENT_ID", "").strip()
    client_secret = os.getenv("GOOGLE_CLIENT_SECRET", "").strip()
    state = request.query_params.get("state", "")
    code = request.query_params.get("code", "")
    if not client_id or not client_secret or not code or not hmac.compare_digest(state, request.cookies.get("bookly_oauth_state_google", "")):
        return _oauth_frontend_error()
    tokens = _oauth_form_post("https://oauth2.googleapis.com/token", {
        "client_id": client_id,
        "client_secret": client_secret,
        "code": code,
        "grant_type": "authorization_code",
        "redirect_uri": _oauth_redirect("google"),
    })
    access_token = tokens.get("access_token")
    if not access_token:
        return _oauth_frontend_error()
    profile = _oauth_get_json(
        "https://openidconnect.googleapis.com/v1/userinfo",
        {"Authorization": f"Bearer {access_token}"},
    )
    if not profile.get("sub") or not profile.get("email") or not profile.get("email_verified", False):
        return _oauth_frontend_error()
    raw, _ = _oauth_finish("google", str(profile["sub"]), str(profile["email"]))
    out = RedirectResponse(f"{BOOKLY_FRONTEND_URL}/account.html?oauth_code={urllib.parse.quote(raw)}", status_code=303)
    out.delete_cookie("bookly_oauth_state_google")
    return out


@app.get("/account/oauth/apple/start")
def account_oauth_apple_start():
    client_id = os.getenv("APPLE_CLIENT_ID", "").strip()
    if not client_id:
        raise HTTPException(503, "Apple OAuth is not configured")
    state = secrets.token_urlsafe(32)
    nonce = secrets.token_urlsafe(32)
    params = {
        "client_id": client_id,
        "redirect_uri": _oauth_redirect("apple"),
        "response_type": "code",
        "response_mode": "form_post",
        "scope": "name email",
        "state": state,
        "nonce": nonce,
    }
    target = "https://appleid.apple.com/auth/authorize?" + urllib.parse.urlencode(params)
    out = RedirectResponse(target, status_code=303)
    out.set_cookie("bookly_oauth_state_apple", state, max_age=OAUTH_STATE_SECONDS, httponly=True, secure=True, samesite="lax")
    out.set_cookie("bookly_oauth_nonce_apple", nonce, max_age=OAUTH_STATE_SECONDS, httponly=True, secure=True, samesite="lax")
    return out


@app.post("/account/oauth/apple/callback")
def account_oauth_apple_callback(
    request: Request,
    code: str = Form(default=""),
    state: str = Form(default=""),
    user: str = Form(default=""),
):
    client_id = os.getenv("APPLE_CLIENT_ID", "").strip()
    team_id = os.getenv("APPLE_TEAM_ID", "").strip()
    key_id = os.getenv("APPLE_KEY_ID", "").strip()
    private_key = os.getenv("APPLE_PRIVATE_KEY", "").replace("\\n", "\n").strip()
    saved_state = request.cookies.get("bookly_oauth_state_apple", "")
    if not client_id or not team_id or not key_id or not private_key or not code or not hmac.compare_digest(state, saved_state):
        return _oauth_frontend_error()
    now = int(time_module.time())
    client_secret = jwt.encode(
        {"iss": team_id, "iat": now, "exp": now + 15552000, "aud": "https://appleid.apple.com", "sub": client_id},
        private_key,
        algorithm="ES256",
        headers={"kid": key_id},
    )
    tokens = _oauth_form_post("https://appleid.apple.com/auth/token", {
        "client_id": client_id,
        "client_secret": client_secret,
        "code": code,
        "grant_type": "authorization_code",
        "redirect_uri": _oauth_redirect("apple"),
    })
    id_token = tokens.get("id_token")
    if not id_token:
        return _oauth_frontend_error()
    try:
        jwks = jwt.PyJWKClient("https://appleid.apple.com/auth/keys")
        signing_key = jwks.get_signing_key_from_jwt(id_token)
        claims = jwt.decode(
            id_token,
            signing_key.key,
            algorithms=["RS256"],
            audience=client_id,
            issuer="https://appleid.apple.com",
            options={"require": ["sub", "iss", "aud", "exp", "iat"]},
        )
        expected_nonce = request.cookies.get("bookly_oauth_nonce_apple", "")
        if expected_nonce and claims.get("nonce") != expected_nonce:
            return _oauth_frontend_error()
    except Exception:
        return _oauth_frontend_error()
    email = str(claims.get("email") or "").strip().lower()
    if not email and user:
        try:
            supplied = json.loads(user)
            email = str(supplied.get("email") or "").strip().lower()
        except Exception:
            pass
    if not email:
        return _oauth_frontend_error()
    raw, _ = _oauth_finish("apple", str(claims["sub"]), email)
    out = RedirectResponse(f"{BOOKLY_FRONTEND_URL}/account.html?oauth_code={urllib.parse.quote(raw)}", status_code=303)
    out.delete_cookie("bookly_oauth_state_apple")
    out.delete_cookie("bookly_oauth_nonce_apple")
    return out


class OAuthExchangeIn(BaseModel):
    code: str = Field(min_length=20, max_length=200)


@app.post("/account/oauth/exchange")
def account_oauth_exchange(x: OAuthExchangeIn):
    token_hash = hashlib.sha256(x.code.encode("utf-8")).hexdigest()
    with SessionLocal() as db:
        handoff = (
            db.query(BooklyOAuthHandoff)
            .filter(BooklyOAuthHandoff.token_hash == token_hash)
            .filter(BooklyOAuthHandoff.expires_at > datetime.utcnow())
            .filter(BooklyOAuthHandoff.used_at.is_(None))
            .first()
        )
        if not handoff:
            raise HTTPException(400, "Invalid or expired OAuth handoff")
        handoff.used_at = datetime.utcnow()
        token = _new_session(db, handoff.account_id)
        account = db.get(BooklyAccount, handoff.account_id)
        db.commit()
        return {"ok": True, "token": token, "account": {"id": account.id, "email": account.email, "business_id": account.business_id}, "next": "choose_plan" if account and account.created_at >= handoff.created_at else "account"}
'''
