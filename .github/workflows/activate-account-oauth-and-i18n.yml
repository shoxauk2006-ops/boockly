            function apply(){var l=lang(),x=D[l];document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';text({'Sign in':x.signin,'Create account':x.create,'Continue with Google':x.google,'Continue with Apple':x.apple,'or continue with email':x.orEmail,'Email':x.email,'Password':x.password,'By continuing, you agree to use Bookly for legitimate business activity and accept our terms.':x.terms,'Bookly workspace':x.heroKicker,'Run your bookings from one place.':x.heroTitle,'Create your account, choose a plan, and set up your business in a few simple steps.':x.heroText});attrs({'you@example.com':x.emailPh,'At least 8 characters':x.passwordPh});oauth('google');oauth('apple');exchange()}
