name: Bookly cancel UI fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply exact cancellation fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('frontend/src/main.tsx')
          s = main.read_text()

          replacements = [
              (
                  """  const [cancelling, setCancelling] =\n    useState(false);\n""",
                  """  const [cancelling, setCancelling] =\n    useState(false);\n\n  const [cancelled, setCancelled] =\n    useState(x.status === 'cancelled');\n"""
              ),
              (
                  """  const canCancel =\n    x.status ===\n      'confirmed' &&\n    bookingDateTime >\n      nowTashkent;\n""",
                  """  const canCancel =\n    !cancelled &&\n    x.status ===\n      'confirmed' &&\n    bookingDateTime >\n      nowTashkent;\n"""
              ),
              (
                  """        alert(\n          t(\n            'owner.bookingCancelled'\n          )\n        );\n""",
                  """        setCancelled(true);\n\n        alert(\n          t(\n            'owner.bookingCancelled'\n          )\n        );\n"""
              ),
              (
                  """        <em>\n          {x.status ===\n            'confirmed'\n            ? (\n              canCancel\n                ? t(\n                    'owner.confirmed'\n                  )\n                : t(\n                    'owner.completed'\n                  )\n            )\n            : x.status ===\n                'cancelled'\n              ? t(\n                  'owner.cancelled'\n                )\n              : x.status}\n        </em>\n""",
                  """        <em>\n          {cancelled\n            ? t(\n                'owner.cancelled'\n              )\n            : x.status ===\n              'confirmed'\n              ? (\n                canCancel\n                  ? t(\n                      'owner.confirmed'\n                    )\n                  : t(\n                      'owner.completed'\n                    )\n              )\n              : x.status}\n        </em>\n"""
              ),
              (
                  """            {cancelling\n              ? t(\n                  'owner.cancelling'\n                )\n              : t(\n                  'owner.cancel'\n                )}\n""",
                  """            {cancelling ? (\n              <>\n                <span\n                  style={{\n                    display: 'inline-block',\n                    width: 14,\n                    height: 14,\n                    border: '2px solid rgba(255,255,255,0.35)',\n                    borderTopColor: '#fff',\n                    borderRadius: '50%',\n                    animation: 'bookly-spin .8s linear infinite',\n                    marginRight: 8,\n                    verticalAlign: '-2px'\n                  }}\n                />\n                {t(\n                  'owner.cancelling'\n                )}\n              </>\n            ) : t(\n                'owner.cancel'\n              )}\n"""
              ),
          ]

          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'main.tsx target count must be 1, got {count}: {old[:80]!r}')
              s = s.replace(old, new, 1)

          main.write_text(s)

          app = Path('backend/app.py')
          b = app.read_text()
          old_phone = '''                        "❌ <b>Ваша запись отменена</b>\\n\\n"\n                        f"📅 {booking.day.isoformat()}\\n"\n                        f"🕐 {booking.start.strftime('%H:%M')}–"\n                        f"{booking.end.strftime('%H:%M')}\\n\\n"\n                        "Пожалуйста, свяжитесь с бизнесом, "\n                        "если хотите выбрать другое время."\n                    ),'''
          new_phone = '''                        "❌ <b>Ваша запись отменена бизнесом</b>\\n\\n"\n                        f"📅 {booking.day.isoformat()}\\n"\n                        f"🕐 {booking.start.strftime('%H:%M')}–"\n                        f"{booking.end.strftime('%H:%M')}\\n"\n                        f"📞 {business.phone or 'Номер телефона не указан'}\\n\\n"\n                        "Пожалуйста, свяжитесь с бизнесом, "\n                        "если хотите выбрать другое время."\n                    ),'''
          count = b.count(old_phone)
          if count != 1:
              raise SystemExit(f'app.py phone target count must be 1, got {count}')
          app.write_text(b.replace(old_phone, new_phone, 1))
          PY

      - name: Validate changes
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('frontend/src/main.tsx').read_text()
          assert "const [cancelled, setCancelled]" in s
          assert "!cancelled &&" in s
          assert "setCancelled(true);" in s
          assert "bookly-spin .8s linear infinite" in s
          b = Path('backend/app.py').read_text()
          assert "Ваша запись отменена бизнесом" in b
          assert "business.phone" in b
          print('Validation OK')
          PY

      - name: Commit changes and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bookly-cancel-fix.yml
          git add frontend/src/main.tsx backend/app.py
          git commit -m "Fix booking cancellation UI safely"
          git push
