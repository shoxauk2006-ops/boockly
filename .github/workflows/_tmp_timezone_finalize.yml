name: _tmp_timezone_finalize
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply client timezone display and business local reporting
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          fp = Path('frontend/src/main.tsx')
          s = fp.read_text(encoding='utf-8')

          # Add client timezone/date helpers once.
          marker = "const getLocale = () =>\n  LOCALE_MAP[getStoredLanguage()] || 'en-US';\n"
          helper = marker + """
const getClientTimeZone = () => {
  try {
    return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
  } catch {
    return 'UTC';
  }
};

const getClientLocalDateKey = () => {
  const now = new Date();
  return [
    now.getFullYear(),
    String(now.getMonth() + 1).padStart(2, '0'),
    String(now.getDate()).padStart(2, '0')
  ].join('-');
};
"""
          if 'const getClientTimeZone = () =>' not in s:
              if marker not in s:
                  raise SystemExit('frontend locale marker not found')
              s = s.replace(marker, helper, 1)

          # Client initial date must be local browser date, not UTC date.
          old = """  const [day, setDay] = useState(
    new Date()
      .toISOString()
      .slice(0, 10)
  );
"""
          new = """  const clientTimeZone = getClientTimeZone();

  const [day, setDay] = useState(
    getClientLocalDateKey()
  );
"""
          if old in s:
              s = s.replace(old, new, 1)
          elif 'const clientTimeZone = getClientTimeZone();' not in s:
              raise SystemExit('client day marker not found')

          # All availability requests carry the browser/device timezone.
          s = s.replace(
              "`/businesses/${business.id}/availability?service_id=${service.id}&day=${selectedDay}`",
              "`/businesses/${business.id}/availability?service_id=${service.id}&day=${selectedDay}&time_zone=${encodeURIComponent(clientTimeZone)}`",
          )
          s = s.replace(
              "`/businesses/${business.id}/availability?service_id=${service.id}&day=${candidateDay}`",
              "`/businesses/${business.id}/availability?service_id=${service.id}&day=${candidateDay}&time_zone=${encodeURIComponent(clientTimeZone)}`",
          )

          # Booking request carries the same client timezone.
          old = """              day,
              start:
                selectedTime
            })
"""
          new = """              day,
              start:
                selectedTime,
              client_timezone: clientTimeZone
            })
"""
          if old not in s:
              raise SystemExit('submit booking payload marker not found')
          s = s.replace(old, new, 1)

          # My Bookings: prefer exact UTC instant returned by backend and render it locally.
          old = """function MyBookings({t}:{t:(key:string,fallback?:string)=>string}) {
  const [items, setItems] =
"""
          new = """function MyBookings({t}:{t:(key:string,fallback?:string)=>string}) {
  const myBookingsTimeZone = getClientTimeZone();

  const formatBookingDate = (item: any) => {
    if (!item?.start_at_utc) {
      return item?.day || '';
    }
    try {
      return new Intl.DateTimeFormat(getLocale(), {
        timeZone: myBookingsTimeZone,
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }).format(new Date(`${item.start_at_utc}Z`));
    } catch {
      return item?.day || '';
    }
  };

  const formatBookingTime = (item: any) => {
    if (!item?.start_at_utc || !item?.end_at_utc) {
      return `${item?.start?.slice(0, 5) || ''} – ${item?.end?.slice(0, 5) || ''}`;
    }
    try {
      const start = new Intl.DateTimeFormat(getLocale(), {
        timeZone: myBookingsTimeZone,
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).format(new Date(`${item.start_at_utc}Z`));
      const end = new Intl.DateTimeFormat(getLocale(), {
        timeZone: myBookingsTimeZone,
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).format(new Date(`${item.end_at_utc}Z`));
      return `${start} – ${end}`;
    } catch {
      return `${item?.start?.slice(0, 5) || ''} – ${item?.end?.slice(0, 5) || ''}`;
    }
  };

  const [items, setItems] =
"""
          if old not in s:
              raise SystemExit('MyBookings function marker not found')
          s = s.replace(old, new, 1)

          s = s.replace(
              "                📅 {item.day}\n",
              "                📅 {formatBookingDate(item)}\n",
              1,
          )
          old_time = """                🕐{' '}
                {item.start?.slice(
                  0,
                  5
                )}
                {' – '}
                {item.end?.slice(
                  0,
                  5
                )}
"""
          new_time = """                🕐 {formatBookingTime(item)}
"""
          if old_time not in s:
              raise SystemExit('MyBookings time render marker not found')
          s = s.replace(old_time, new_time, 1)

          fp.write_text(s, encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('backend/app.py')
          s = p.read_text(encoding='utf-8')

          # Admin statistics use the business timezone, never server local timezone.
          old = '        now = datetime.now()\n        today = now.date()\n'
          new = '        business_zone = _bookly_zone(business.timezone)\n        now = datetime.now(business_zone).replace(tzinfo=None)\n        today = now.date()\n'
          if old in s:
              s = s.replace(old, new, 1)
          elif 'business_zone = _bookly_zone(business.timezone)' not in s:
              raise SystemExit('statistics time marker not found')

          # Admin block cleanup uses business local date.
          old = '        today = datetime.now().date()\n\n        db.query(BlockedSlot).filter(\n'
          new = '        today = datetime.now(_bookly_zone(b.timezone)).date()\n\n        db.query(BlockedSlot).filter(\n'
          if old in s:
              s = s.replace(old, new, 1)

          # Admin-created booking past-time check uses business timezone.
          old = """        now_tashkent = datetime.now(
            ZoneInfo("Asia/Tashkent")
        ).replace(tzinfo=None)
"""
          new = """        now_business = datetime.now(
            _bookly_zone(business.timezone)
        ).replace(tzinfo=None)
"""
          if old in s:
              s = s.replace(old, new, 1)
          old2 = '        if start_dt <= now_tashkent:\n'
          new2 = '        if start_dt <= now_business:\n'
          if old2 in s:
              s = s.replace(old2, new2, 1)

          # Clean redundant local calculation in create_booking.
          redundant = """        business_zone = _bookly_zone(b.timezone)
        start_local = datetime.combine(x.day, x.start, tzinfo=business_zone)
        end_local = start_local + timedelta(minutes=s.duration_min)

"""
          s = s.replace(redundant, '', 1)

          # /my/bookings returns exact UTC timestamps; client renders them in its timezone.
          marker = '''                "day": booking.day.isoformat(),
                "start": booking.start.strftime("%H:%M"),
                "end": booking.end.strftime("%H:%M"),
                "status": booking.status
'''
          replacement = '''                "day": booking.day.isoformat(),
                "start": booking.start.strftime("%H:%M"),
                "end": booking.end.strftime("%H:%M"),
                "start_at_utc": booking.start_at_utc.isoformat() if booking.start_at_utc else None,
                "end_at_utc": booking.end_at_utc.isoformat() if booking.end_at_utc else None,
                "status": booking.status
'''
          if marker in s:
              s = s.replace(marker, replacement, 1)

          # Client cancellation notification should be shown in the client's timezone.
          marker = '            telegram_api(\n                "sendMessage",\n                {\n                    "chat_id": booking.client_telegram_id,'
          pos = s.find(marker)
          if pos != -1:
              end_pos = s.find('\n            )', pos)
              if end_pos != -1:
                  segment = s[pos:end_pos]
                  if 'booking.day.isoformat()' in segment and 'booking.start.strftime' in segment:
                      insert_after = '                    "text": (\n'
                      helper_text = '''                    "text": (\n                        "❌ <b>Ваша запись отменена бизнесом</b>\\n\\n"\n                        f"📅 {_bookly_from_utc(booking.start_at_utc, booking.client_timezone).date().isoformat() if booking.start_at_utc else booking.day.isoformat()}\\n"\n                        f"🕐 {_bookly_from_utc(booking.start_at_utc, booking.client_timezone).strftime('%H:%M') if booking.start_at_utc else booking.start.strftime('%H:%M')}–"\n                        f"{_bookly_from_utc(booking.end_at_utc, booking.client_timezone).strftime('%H:%M') if booking.end_at_utc else booking.end.strftime('%H:%M')}\\n"\n                        f"📞 {business.phone or 'Номер телефона не указан'}\\n\\n"\n                        "Пожалуйста, свяжитесь с бизнесом, "\n                        "если хотите выбрать другое время."\n                    ),\n'''
                      segment = re.sub(
                          r'                    "text": \(.*?                    \),\n',
                          helper_text,
                          segment,
                          count=1,
                          flags=re.S,
                      )
                      s = s[:pos] + segment + s[end_pos:]

          # Client booking success notification is localized by telegram_api but time values must be client-local.
          marker = '        telegram_api(\n            "sendMessage",\n            {\n                "chat_id": booking.client_telegram_id,'
          pos = s.find(marker)
          if pos != -1:
              end_pos = s.find('\n        )', pos)
              if end_pos != -1:
                  segment = s[pos:end_pos]
                  helper_text = '''                "text": (\n                    "✅ <b>Вы успешно записаны!</b>\\n\\n"\n                    f"💈 {s.name}\\n"\n                    f"📅 {_bookly_from_utc(booking.start_at_utc, booking.client_timezone).date().isoformat() if booking.start_at_utc else booking.day.isoformat()}\\n"\n                    f"🕐 {_bookly_from_utc(booking.start_at_utc, booking.client_timezone).strftime('%H:%M') if booking.start_at_utc else booking.start.strftime('%H:%M')}–"\n                    f"{_bookly_from_utc(booking.end_at_utc, booking.client_timezone).strftime('%H:%M') if booking.end_at_utc else booking.end.strftime('%H:%M')}\\n"\n                    f"📞 Ваш номер: {booking.client_phone}\\n"\n                    f"☎️ Связаться: {b.phone or 'номер не указан'}\\n"\n                    f"📍 {b.address or 'Адрес не указан'}\\n\\n"\n                    "Ждём вас!"\n                ),\n'''
                  segment = re.sub(
                      r'                "text": \(.*?                \),\n',
                      helper_text,
                      segment,
                      count=1,
                      flags=re.S,
                  )
                  s = s[:pos] + segment + s[end_pos:]

          p.write_text(s, encoding='utf-8')
          PY

          python -m py_compile backend/app.py
          cd frontend
          npm ci --silent
          npm run build
          git config user.name "bookly-bot"
          git config user.email "bookly-bot@users.noreply.github.com"
          git add frontend/src/main.tsx backend/app.py
          git diff --cached --check
          git commit -m "Complete client and business timezone display"
          git push origin main
