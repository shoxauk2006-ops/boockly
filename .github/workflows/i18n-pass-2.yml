name: i18n pass 2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    if: github.event.head_commit.message == 'Trigger i18n pass 2'
    steps:
      - uses: actions/checkout@v4
      - name: Apply second i18n cleanup
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          main = Path('frontend/src/main.tsx')
          i18n = Path('frontend/src/i18n.ts')
          trigger = Path('.i18n-pass-2-trigger')
          s = main.read_text(encoding='utf-8')

          # Remaining hardcoded UI labels.
          s = s.replace(
              "{hour === 1\n          ? 'час'\n          : hour < 5\n            ? 'часа'\n            : 'часов'}",
              "{hour === 1\n          ? t('owner.hourOne', 'час')\n          : hour < 5\n            ? t('owner.hourFew', 'часа')\n            : t('owner.hours', 'часов')}"
          )
          s = s.replace(
              "<strong>\n        Выберите часовой пояс\n      </strong>",
              "<strong>\n        {t('owner.chooseTimezone', 'Выберите часовой пояс')}\n      </strong>"
          )
          s = s.replace(
              "<strong>\n        Выберите часовой пояс\n      </strong>",
              "<strong>\n        {t('owner.chooseTimezone', 'Выберите часовой пояс')}\n      </strong>"
          )

          # Full day names used by the create-business form.
          day_repl = {
              'Понедельник': "t('days.monFull', 'Понедельник')",
              'Вторник': "t('days.tueFull', 'Вторник')",
              'Среда': "t('days.wedFull', 'Среда')",
              'Четверг': "t('days.thuFull', 'Четверг')",
              'Пятница': "t('days.friFull', 'Пятница')",
              'Суббота': "t('days.satFull', 'Суббота')",
              'Воскресенье': "t('days.sunFull', 'Воскресенье')",
          }
          for ru, expr in day_repl.items():
              s = s.replace(f"name: '{ru}'", f"name: {expr}")

          # Ensure remaining schedule error is localized.
          s = s.replace("throw new Error(\n        'Не удалось добавить график'\n      );", "throw new Error(\n        t('owner.addScheduleError', 'Не удалось добавить график')\n      );")
          s = s.replace("e?.message ||\n        'Не удалось добавить график'", "e?.message ||\n        t('owner.addScheduleError', 'Не удалось добавить график')")

          # Remaining subscription confirmation/error messages.
          s = re.sub(
              r"const confirmed = await confirmAsync\(\n\s*`Увеличить лимит до \$\{newLimit\} услуг\?\\n\\n` \+\n\s*`Сейчас к оплате: \\\$\$\{[\s\S]*?\}/мес\.`\n\s*\);",
              "const confirmed = await confirmAsync(\n        t('owner.increaseServiceLimitConfirm', 'Увеличить лимит до {limit} услуг?\\n\\nСейчас к оплате: {now}\\nСо следующего продления: {next}/мес.')\n          .replace('{limit}', String(newLimit))\n          .replace('{now}', `$${(Number(immediateAmount) / 100).toFixed(2)}`)\n          .replace('{next}', `$${recurringTotal !== null ? (Number(recurringTotal) / 100).toFixed(2) : nextPrice.toFixed(2)}`)\n      );",
              s,
              count=1
          )
          s = s.replace(
              "'Отменить дополнительный пакет?\\n\\n' +\n      'Пакет останется доступен до конца оплаченного периода.\\n' +\n      'Со следующего продления останется базовый лимит 10 услуг.'",
              "t('owner.cancelPackageConfirm', 'Отменить дополнительный пакет?\\n\\nПакет останется доступен до конца оплаченного периода.\\nСо следующего продления останется базовый лимит 10 услуг.')"
          )
          s = s.replace(
              "'Возобновить дополнительный пакет?\\n\\n' +\n      'Пакет продолжит действовать и останется в подписке со следующего продления.'",
              "t('owner.resumePackageConfirm', 'Возобновить дополнительный пакет?\\n\\nПакет продолжит действовать и останется в подписке со следующего продления.')"
          )
          s = s.replace("data?.detail ||\n          'Не удалось запланировать отмену пакета'", "data?.detail ||\n          t('owner.cancelPackageScheduleError', 'Не удалось запланировать отмену пакета')")
          s = s.replace("e?.message ||\n        'Не удалось отменить пакет'", "e?.message ||\n        t('owner.cancelPackageError', 'Не удалось отменить пакет')")
          s = s.replace("data?.detail ||\n          'Не удалось возобновить пакет'", "data?.detail ||\n          t('owner.resumePackageError', 'Не удалось возобновить пакет')")
          s = s.replace("e?.message ||\n        'Не удалось возобновить пакет'", "e?.message ||\n        t('owner.resumePackageError', 'Не удалось возобновить пакет')")

          s = s.replace(") : (\n                      'Возобновить пакет'\n                    )", ") : (\n                      t('owner.resumePackage', 'Возобновить пакет')\n                    )")
          s = s.replace("}) : (\n                      'Отменить пакет'\n                    )", "}) : (\n                      t('owner.cancelPackage', 'Отменить пакет')\n                    )")

          # Localize the QR hint that was still a raw string in JSX.
          s = s.replace(
              ": 'Клиенты могут сканировать и сразу перейти к записи'",
              ": t('owner.clientQrHint', 'Клиенты могут сканировать и сразу перейти к записи')"
          )

          # Localize the remaining 'up to N services' list item.
          s = s.replace(
              "<li>До {currentServicesLimit} услуг</li>",
              "<li>{t('owner.upToServices', 'До')} {currentServicesLimit} {t('owner.services', 'услуг')}</li>"
          )

          main.write_text(s, encoding='utf-8')

          # Add full-day and any remaining second-pass keys to each locale.
          src = i18n.read_text(encoding='utf-8')
          additions = {
            'ru': {
              'days.monFull':'Понедельник','days.tueFull':'Вторник','days.wedFull':'Среда','days.thuFull':'Четверг','days.friFull':'Пятница','days.satFull':'Суббота','days.sunFull':'Воскресенье'
            },
            'en': {
              'days.monFull':'Monday','days.tueFull':'Tuesday','days.wedFull':'Wednesday','days.thuFull':'Thursday','days.friFull':'Friday','days.satFull':'Saturday','days.sunFull':'Sunday'
            },
            'uz': {
              'days.monFull':'Dushanba','days.tueFull':'Seshanba','days.wedFull':'Chorshanba','days.thuFull':'Payshanba','days.friFull':'Juma','days.satFull':'Shanba','days.sunFull':'Yakshanba'
            },
            'tr': {
              'days.monFull':'Pazartesi','days.tueFull':'Salı','days.wedFull':'Çarşamba','days.thuFull':'Perşembe','days.friFull':'Cuma','days.satFull':'Cumartesi','days.sunFull':'Pazar'
            },
            'ar': {
              'days.monFull':'الاثنين','days.tueFull':'الثلاثاء','days.wedFull':'الأربعاء','days.thuFull':'الخميس','days.friFull':'الجمعة','days.satFull':'السبت','days.sunFull':'الأحد'
            }
          }

          def has_key(block,key):
              return re.search(r"['\"]"+re.escape(key)+r"['\"]\\s*:", block) is not None
          for locale,vals in additions.items():
              start=src.find(f"const {locale}: TranslationMap = {{")
              if start<0: raise SystemExit(f'missing {locale}')
              if locale=='ru': end=src.find('\n};\n\nconst en:',start)
              elif locale=='en': end=src.find('\n};\n\nconst uz:',start)
              elif locale=='uz': end=src.find('\n};\nconst tr:',start)
              elif locale=='tr': end=src.find('\n};\nconst ar:',start)
              else: end=src.find('\n};\n\nexport const translations:',start)
              if end<0: raise SystemExit(f'no end {locale}')
              block=src[start:end]
              inserts=[]
              for k,v in vals.items():
                  if not has_key(block,k): inserts.append(f"  '{k}': {v!r},")
              if inserts: src=src[:end]+'\n'+'\n'.join(inserts)+src[end:]
          i18n.write_text(src,encoding='utf-8')
          if trigger.exists(): trigger.unlink()
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "bookly-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/i18n-pass-2.yml .i18n-pass-2-trigger
          git add frontend/src/main.tsx frontend/src/i18n.ts .github/workflows/i18n-pass-2.yml .i18n-pass-2-trigger
          git commit -m "Apply second i18n cleanup pass"
          git push