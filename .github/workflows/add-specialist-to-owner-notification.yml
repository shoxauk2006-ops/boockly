name: Add specialist to owner notification
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[specialist-notification]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch notification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/app.py')
          s = p.read_text()
          old = '''def notify_owner_new_booking(db, booking, service):\n    business=db.get(Business, booking.business_id)\n    if not business:\n        return\n    text=(\n        "🔔 <b>Новая запись в Bookly</b>\\n\\n"\n        f"👤 {booking.client_name}\\n"\n        f"📞 {booking.client_phone or 'номер не передан'}\\n"\n        f"💈 {service.name}\\n"\n        f"📅 {booking.day.isoformat()}\\n"\n        f"🕐 {booking.start.strftime('%H:%M')}–{booking.end.strftime('%H:%M')}\\n"\n        f"🆔 #{booking.id}"\n    )\n    telegram_api("sendMessage", {"chat_id":business.owner_telegram_id,"text":text,"parse_mode":"HTML"})\n'''
          new = '''def notify_owner_new_booking(db, booking, service):\n    business = db.get(Business, booking.business_id)\n    if not business:\n        return\n\n    specialist = None\n    if getattr(booking, "specialist_id", None) is not None:\n        specialist = db.get(Specialist, booking.specialist_id)\n\n    lines = [\n        "🔔 <b>Новая запись в Bookly</b>",\n        "",\n        f"👤 {booking.client_name}",\n        f"📞 {booking.client_phone or 'номер не передан'}",\n        f"💈 {service.name}",\n    ]\n\n    if specialist and specialist.name:\n        lines.append(f"👨‍💼 Специалист: {specialist.name}")\n\n    lines.extend([\n        f"📅 {booking.day.isoformat()}",\n        f"🕐 {booking.start.strftime('%H:%M')}–{booking.end.strftime('%H:%M')}",\n        f"🆔 #{booking.id}",\n    ])\n\n    telegram_api(\n        "sendMessage",\n        {\n            "chat_id": business.owner_telegram_id,\n            "text": "\\n".join(lines),\n            "parse_mode": "HTML",\n        },\n    )\n'''
          if old not in s:
              raise SystemExit('notify_owner_new_booking block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 -m py_compile backend/app.py
      - name: Commit and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/app.py .github/workflows/add-specialist-to-owner-notification.yml
          git commit -m 'fix: include specialist in owner booking notification [specialist-notification]'
          git push
          git rm .github/workflows/add-specialist-to-owner-notification.yml
          git commit -m 'chore: remove temporary specialist notification workflow [specialist-notification]'
          git push
