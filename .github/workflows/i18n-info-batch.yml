name: I18n info batch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message == 'Trigger info i18n batch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add only info translations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('frontend/src/i18n.ts')
          s = p.read_text(encoding='utf-8')
          additions = {
              'uz': {
                  'info.howBooklyWorks':'Bookly qanday ishlaydi',
                  'info.forBusinessOwner':'Biznes egalari uchun',
                  'info.rulesAndContacts':'Qoidalar va kontaktlar',
                  'info.termsOfUse':'Foydalanish qoidalari',
                  'info.contacts':'Kontaktlar',
                  'info.contactDescription':'Bookly ishlashi bo‘yicha savollar yoki qoidabuzarliklar haqida xabar berish uchun:',
                  'info.stepCreateBusiness':'1. Biznesingizni yarating.',
                  'info.stepAddInfo':'2. Ma’lumot va surat qo‘shing.',
                  'info.stepAddServices':'3. Xizmatlar va narxlarni qo‘shing.',
                  'info.stepBookings':'6. Bronlarni boshqaring.',
                  'info.activationDescription':'Mijozlardan bron qabul qilishni boshlash uchun Bookly Pro obunasini faollashtiring. Faollashtirgandan so‘ng mijozlar havolasini olasiz va bronlarni qabul qilishni boshlashingiz mumkin.',
                  'info.proUnlocksClientPart':'Bookly Pro Bookly’ning mijozlar qismini ochadi:',
                  'info.clientPage':'Mijozlar sahifasi',
                  'info.clientLink':'Shaxsiy mijozlar havolasi',
                  'info.clientQr':'Mijozlar uchun QR-kod',
                  'info.onlineBookings':'Onlayn bronlar',
                  'info.bookingNotifications':'Yangi bronlar haqida bildirishnomalar',
                  'info.basePlanServices':'Asosiy tarifda 10 tagacha xizmat',
                  'info.withoutSubscription':'Obunasiz ham biznes yaratish va sozlash, xizmatlar qo‘shish, jadval, bloklar va bronlarni admin panelda boshqarish mumkin. Mijozlarni ulash va onlayn bronlarni qabul qilishni boshlash uchun obuna kerak.',
                  'info.rule1':'1. Bookly qonuniy foydalanish va odatiy tovarlar hamda xizmatlarni taqdim etish uchun mo‘ljallangan.',
                  'info.rule2':'2. Bookly’dan noqonuniy tovarlar yoki xizmatlar, giyohvand moddalar, qurol, firibgarlik, pornografiya, qimor va boshqa taqiqlangan faoliyat uchun foydalanish taqiqlanadi.',
                  'info.rule3':'3. Foydalanuvchi o‘z biznesi, tovarlari, xizmatlari, reklamasi va kontentining qonuniyligi uchun to‘liq javobgar.',
                  'info.rule4':'4. Bookly’dan mijozlarni aldash, spam yuborish, soxta bronlar yaratish yoki xizmatdan boshqa tarzda suiiste’mol qilish uchun foydalanish taqiqlanadi.',
                  'info.rule5':'5. Foydalanuvchilar amaldagi qonunlarga va shaxsiy ma’lumotlarni himoya qilish talablariga rioya qilishi shart.',
                  'info.rule6':'6. Ushbu qoidalarni buzgan biznes faoliyatini vaqtincha cheklashimiz yoki to‘liq bloklashimiz mumkin.',
                  'info.rule7':'7. Avval qo‘llangan cheklovni chetlab o‘tish uchun yangi biznes yoki akkaunt yaratish taqiqlanadi.',
                  'info.rule8':'8. Bookly funksiyalarini o‘zgartirish, xizmatni vaqtincha cheklash yoki xizmat ko‘rsatishni to‘xtatish huquqini saqlab qolamiz.',
                  'info.rule9':'9. Bookly uzluksiz yoki xatosiz ishlashini kafolatlamaymiz. Texnik nosozliklar, texnik xizmat va uchinchi tomon xizmatlaridagi uzilishlar yuz berishi mumkin.',
                  'info.rule10':'10. Bookly’dan foydalanish orqali foydalanuvchi ushbu qoidalarga rioya qilishga roziligini bildiradi.',
              },
              'tr': {
                  'info.howBooklyWorks':'Bookly nasıl çalışır',
                  'info.forBusinessOwner':'İşletme sahipleri için',
                  'info.rulesAndContacts':'Kurallar ve iletişim',
                  'info.termsOfUse':'Kullanım kuralları',
                  'info.contacts':'İletişim',
                  'info.contactDescription':'Bookly hakkında sorularınız veya ihlal bildirimleri için:',
                  'info.stepCreateBusiness':'1. İşletmenizi oluşturun.',
                  'info.stepAddInfo':'2. Bilgi ve fotoğraf ekleyin.',
                  'info.stepAddServices':'3. Hizmetleri ve fiyatları ekleyin.',
                  'info.stepBookings':'6. Rezervasyonları yönetin.',
                  'info.activationDescription':'Müşterilerden rezervasyon almaya başlamak için Bookly Pro aboneliğini etkinleştirin. Etkinleştirdikten sonra müşteri bağlantınızı alır ve rezervasyon kabul etmeye başlayabilirsiniz.',
                  'info.proUnlocksClientPart':'Bookly Pro, Bookly’nin müşteri tarafını açar:',
                  'info.clientPage':'Müşteri sayfası',
                  'info.clientLink':'Kişisel müşteri bağlantısı',
                  'info.clientQr':'Müşteri QR kodu',
                  'info.onlineBookings':'Online rezervasyonlar',
                  'info.bookingNotifications':'Yeni rezervasyon bildirimleri',
                  'info.basePlanServices':'Temel planda 10 hizmete kadar',
                  'info.withoutSubscription':'Abonelik olmadan işletmenizi oluşturabilir ve yapılandırabilir, hizmet ekleyebilir, programı, engellenen zamanları ve rezervasyonları yönetim panelinden yönetebilirsiniz. Müşterileri bağlamak ve online rezervasyon almaya başlamak için abonelik gerekir.',
                  'info.rule1':'1. Bookly, yasal kullanım ve olağan mal ve hizmetlerin sunulması için tasarlanmıştır.',
                  'info.rule2':'2. Bookly’nin yasa dışı mal veya hizmetler, uyuşturucular, silahlar, dolandırıcılık, pornografi, kumar ve diğer yasaklı faaliyetler için kullanılması yasaktır.',
                  'info.rule3':'3. Kullanıcı; işletmesinin, mallarının, hizmetlerinin, reklamlarının ve içeriğinin yasallığından tek başına sorumludur.',
                  'info.rule4':'4. Bookly müşterileri kandırmak, spam göndermek, sahte rezervasyonlar oluşturmak veya hizmeti başka şekilde kötüye kullanmak için kullanılamaz.',
                  'info.rule5':'5. Kullanıcılar yürürlükteki yasalara ve kişisel verilerin korunması gerekliliklerine uymalıdır.',
                  'info.rule6':'6. Bu kuralların ihlali halinde bir işletmenin kullanımını geçici olarak kısıtlayabilir veya tamamen engelleyebiliriz.',
                  'info.rule7':'7. Daha önce uygulanan bir kısıtlamayı aşmak için yeni bir işletme veya hesap oluşturmak yasaktır.',
                  'info.rule8':'8. Bookly özelliklerini değiştirme, hizmeti geçici olarak kısıtlama veya hizmet sunumunu durdurma hakkımız saklıdır.',
                  'info.rule9':'9. Bookly’nin kesintisiz veya hatasız çalışacağını garanti etmiyoruz. Teknik arızalar, bakım çalışmaları ve üçüncü taraf hizmet kesintileri yaşanabilir.',
                  'info.rule10':'10. Bookly’yi kullanarak kullanıcı bu kurallara uymayı kabul eder.',
              },
              'ar': {
                  'info.howBooklyWorks':'كيف يعمل Bookly',
                  'info.forBusinessOwner':'لأصحاب الأنشطة التجارية',
                  'info.rulesAndContacts':'القواعد وبيانات الاتصال',
                  'info.termsOfUse':'شروط الاستخدام',
                  'info.contacts':'بيانات الاتصال',
                  'info.contactDescription':'للاستفسارات حول Bookly أو للإبلاغ عن المخالفات:',
                  'info.stepCreateBusiness':'1. أنشئ نشاطك التجاري.',
                  'info.stepAddInfo':'2. أضف المعلومات والصورة.',
                  'info.stepAddServices':'3. أضف الخدمات والأسعار.',
                  'info.stepBookings':'6. أدر الحجوزات.',
                  'info.activationDescription':'لبدء استقبال الحجوزات من العملاء، فعّل اشتراك Bookly Pro. بعد التفعيل ستحصل على رابط العملاء ويمكنك البدء في استقبال الحجوزات.',
                  'info.proUnlocksClientPart':'يفتح Bookly Pro جانب العملاء في Bookly:',
                  'info.clientPage':'صفحة العملاء',
                  'info.clientLink':'رابط العملاء الشخصي',
                  'info.clientQr':'رمز QR للعملاء',
                  'info.onlineBookings':'الحجوزات عبر الإنترنت',
                  'info.bookingNotifications':'إشعارات الحجوزات الجديدة',
                  'info.basePlanServices':'حتى 10 خدمات في الخطة الأساسية',
                  'info.withoutSubscription':'بدون اشتراك، يمكنك إنشاء نشاطك التجاري وإعداده، وإضافة الخدمات، وإدارة الجدول والأوقات المحجوبة والحجوزات من لوحة الإدارة. يلزم الاشتراك لربط العملاء وبدء استقبال الحجوزات عبر الإنترنت.',
                  'info.rule1':'1. صُمم Bookly للاستخدام القانوني ولتقديم السلع والخدمات العادية.',
                  'info.rule2':'2. يُحظر استخدام Bookly للسلع أو الخدمات غير القانونية، والمخدرات، والأسلحة، والاحتيال، والمواد الإباحية، والمقامرة وغيرها من الأنشطة المحظورة.',
                  'info.rule3':'3. يتحمل المستخدم وحده مسؤولية قانونية نشاطه التجاري وسلعه وخدماته وإعلاناته ومحتواه.',
                  'info.rule4':'4. لا يجوز استخدام Bookly لخداع العملاء أو إرسال الرسائل المزعجة أو إنشاء حجوزات وهمية أو إساءة استخدام الخدمة بأي شكل آخر.',
                  'info.rule5':'5. يجب على المستخدمين الالتزام بالقوانين المعمول بها ومتطلبات حماية البيانات الشخصية.',
                  'info.rule6':'6. يحق لنا تقييد نشاط تجاري مؤقتًا أو حظره بالكامل عند مخالفة هذه القواعد.',
                  'info.rule7':'7. يُحظر إنشاء نشاط تجاري أو حساب جديد لتجاوز تقييد تم تطبيقه سابقًا.',
                  'info.rule8':'8. نحتفظ بالحق في تغيير ميزات Bookly أو تقييد الخدمة مؤقتًا أو إيقاف تقديمها.',
                  'info.rule9':'9. لا نضمن تشغيل Bookly دون انقطاع أو أخطاء. قد تحدث أعطال تقنية أو أعمال صيانة أو انقطاعات في خدمات الجهات الخارجية.',
                  'info.rule10':'10. باستخدام Bookly، يوافق المستخدم على الالتزام بهذه القواعد.',
              },
          }

          for locale, values in additions.items():
              m = re.search(rf"const {locale}: TranslationMap = \{{(?P<body>.*?)\n\}};", s, re.S)
              if not m:
                  raise SystemExit(f'Locale block not found: {locale}')
              body = m.group('body')
              for key in values:
                  if re.search(rf"['\"]{re.escape(key)}['\"]\s*:", body):
                      raise SystemExit(f'Key already present unexpectedly: {locale}.{key}')
              inserts = [f"  '{key}': {value!r}," for key, value in values.items()]
              block = m.group(0)
              replacement = block[:-3] + '\n' + '\n'.join(inserts) + '\n};'
              s = s[:m.start()] + replacement + s[m.end():]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Build frontend
        run: |
          npm install --prefix frontend --no-audit --no-fund
          npm run build --prefix frontend
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'bookly-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend/src/i18n.ts
          git commit -m 'i18n: translate info and rules for uz tr ar'
          git rm -f .github/workflows/i18n-info-batch.yml .info-i18n-trigger
          git add -u .github/workflows
          git commit -m 'chore: remove temporary info i18n workflow'
          git push
