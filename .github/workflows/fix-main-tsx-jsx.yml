name: Fix main.tsx JSX

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix missing JSX closing tag
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('frontend/src/main.tsx')
          s = p.read_text()

          old = "\n)}\n\n<nav className=\"admin-bottom-nav\">"
          new = "\n</div>\n)}\n\n<nav className=\"admin-bottom-nav\">"

          if old not in s:
              raise SystemExit('Expected JSX closing pattern not found')

          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one target, found {s.count(old)}')

          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/main.tsx
          git commit -m "Fix missing JSX closing tag" || exit 0
          git push
