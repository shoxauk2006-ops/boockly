name: Temporary client notification timezone fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[bookly-client-notification-timezone]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch backend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/app.py')
          s = p.read_text(encoding='utf-8')

          old = '''        # Уведомление клиенту
        telegram_api(
            "sendMessage",
            {
                "chat_id": booking.client_telegram_id,
                "text": (
                    "✅ <b>Вы успешно записаны!</b>\\n\\n"
                    f"💈 {s.name}\\n"
                    f"📅 {booking.day.isoformat()}\\n"
                    f"🕐 {booking.start.strftime('%H:%M')}–"
                    f"{booking.end.strftime('%H:%M')}\\n"
                    f"📞 Ваш номер: {booking.client_phone}\\n"
                    f"☎️ Связаться: {b.phone or 'номер не указан'}\\n"
                    f"📍 {b.address or 'Адрес не указан'}\\n\\n"
                    "Ждём вас!"
                ),
                "parse_mode": "HTML"
            }
        )'''

          new = '''        # Уведомление клиенту: показываем дату и время в timezone самого клиента.
        if booking.start_at_utc and booking.end_at_utc:
            client_display_start = _bookly_from_utc(
                booking.start_at_utc,
                booking.client_timezone or "UTC"
            )
            client_display_end = _bookly_from_utc(
                booking.end_at_utc,
                booking.client_timezone or "UTC"
            )
            display_day = (
                client_display_start.date().isoformat()
                if client_display_start
                else booking.day.isoformat()
            )
            display_start = (
                client_display_start.strftime('%H:%M')
                if client_display_start
                else booking.start.strftime('%H:%M')
            )
            display_end = (
                client_display_end.strftime('%H:%M')
                if client_display_end
                else booking.end.strftime('%H:%M')
            )
        else:
            display_day = booking.day.isoformat()
            display_start = booking.start.strftime('%H:%M')
            display_end = booking.end.strftime('%H:%M')

        telegram_api(
            "sendMessage",
            {
                "chat_id": booking.client_telegram_id,
                "text": (
                    "✅ <b>Вы успешно записаны!</b>\\n\\n"
                    f"💈 {s.name}\\n"
                    f"📅 {display_day}\\n"
                    f"🕐 {display_start}–"
                    f"{display_end}\\n"
                    f"📞 Ваш номер: {booking.client_phone}\\n"
                    f"☎️ Связаться: {b.phone or 'номер не указан'}\\n"
                    f"📍 {b.address or 'Адрес не указан'}\\n\\n"
                    "Ждём вас!"
                ),
                "parse_mode": "HTML"
            }
        )'''

          if old not in s:
              raise SystemExit('Target client notification block not found')

          if new in s:
              raise SystemExit('Patch already applied')

          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

          python3 -m py_compile backend/app.py

      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app.py
          git commit -m 'fix: show booking notification in client timezone [bookly-client-notification-timezone]'
          git rm .github/workflows/_tmp_client_notification_timezone.yml
          git commit -m 'chore: remove temporary client notification timezone workflow [bookly-client-notification-timezone]'
          git push