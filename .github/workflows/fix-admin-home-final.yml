name: Fix admin home final

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch admin navigation
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('frontend/src/main.tsx')
          text = path.read_text(encoding='utf-8')

          # The business card on the personal home must enter the normal admin home.
          old = """  onAdmin={() => {
    setAdminTab('businesses');
    setMode('admin');
  }}"""
          new = """  onAdmin={() => {
    setAdminTab('home');
    setMode('admin');
  }}"""
          if old not in text:
              raise SystemExit('PersonalHome onAdmin block not found')
          text = text.replace(old, new, 1)

          # The Businesses list is only a list. Creation itself belongs to the website.
          text = text.replace(
              "onClick={() => setBusinessPanel('create')}",
              "onClick={() => tg()?.openLink('https://boockly.vercel.app/landing.html')}",
          )

          # Remove the broken undefined createBusiness handler from the legacy create panel.
          text = text.replace("onClick={createBusiness}", "onClick={() => tg()?.openLink('https://boockly.vercel.app/landing.html')}")
          text = text.replace("onClick={\n                createBusiness\n              }", "onClick={() => tg()?.openLink('https://boockly.vercel.app/landing.html')}")
          text = text.replace("onClick={\n  createBusiness\n}", "onClick={() => tg()?.openLink('https://boockly.vercel.app/landing.html')}")

          # Any remaining direct createBusiness identifier in JSX would still crash during render.
          if 'createBusiness' in text:
              raise SystemExit('createBusiness identifier still exists in main.tsx')

          path.write_text(text, encoding='utf-8')

      - name: Disable policy script's admin auto-navigation
        shell: python
        run: |
          from pathlib import Path
          path = Path('frontend/public/miniapp-policy.js')
          text = path.read_text(encoding='utf-8')
          start = text.find('  function restoreAdminLanding() {')
          if start != -1:
              end = text.find('\n  function protectCreation()', start)
              if end == -1:
                  raise SystemExit('protectCreation marker not found')
              text = text[:start] + text[end + 1:]
          text = text.replace('    restoreAdminLanding();\n', '')
          path.write_text(text, encoding='utf-8')

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/main.tsx frontend/public/miniapp-policy.js
          git rm .github/workflows/fix-admin-home-final.yml
          git commit -m "fix: restore admin home and safe business creation entry"
          git push