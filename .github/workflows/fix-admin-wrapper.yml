name: Fix admin JSX wrapper

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove artificial admin wrapper
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/main.tsx')
          s = p.read_text()
          marker = "      <div className=\"admin-page\">"
          pos = s.find(marker)
          if pos < 0:
              raise SystemExit('admin-page wrapper not found')
          s = s[:pos] + s[pos + len(marker):]
          p.write_text(s)
          PY
      - name: Validate build
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/main.tsx
          git diff --cached --quiet || git commit -m 'fix: remove unmatched admin JSX wrapper'
          git push
