name: Finalize Telegram notification language

on:
  push:
    paths:
      - '.github/workflows/notification-language-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix final Telegram sender
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('backend/app.py')
          s = p.read_text(encoding='utf-8')

          start = s.rfind('def telegram_api(method: str, payload: dict):')
          end = s.find('\n\ndef notify_owner_new_booking', start)
          if start == -1 or end == -1:
              raise SystemExit('final telegram_api block not found')

          new_block = '''def telegram_api(method: str, payload: dict):
              """Telegram Bot API helper. Outgoing user-facing messages use the language selected in Bookly."""
              if not BOT_TOKEN:
                  return None

              if method == "sendMessage" and isinstance(payload, dict) and payload.get("chat_id"):
                  payload = dict(payload)
                  chat_id = int(payload["chat_id"])
                  request_lang = BOOKLY_REQUEST_LANGUAGE.get()
                  request_user_id = BOOKLY_REQUEST_USER_ID.get()
                  effective_lang = (
                      request_lang
                      if request_lang and request_user_id == chat_id
                      else _bookly_user_language(chat_id)
                  )
                  payload["text"] = _bookly_localize_outgoing_text(
                      str(payload.get("text", "")),
                      effective_lang
                  )

              data = json.dumps(payload).encode("utf-8")
              req = urllib_request.Request(
                  f"https://api.telegram.org/bot{BOT_TOKEN}/{method}",
                  data=data,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urllib_request.urlopen(req, timeout=8) as response:
                      return json.loads(response.read().decode("utf-8"))
              except (URLError, TimeoutError, ValueError):
                  return None
'''

          s = s[:start] + new_block.rstrip('\n') + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/notification-language-fix.yml
          git add backend/app.py .github/workflows/notification-language-fix.yml
          git commit -m "fix: use Bookly interface language for notifications"
          git push
