name: Patch client timezone copy
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[timezone-copy]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch main.tsx and i18n.ts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          
          p = Path('frontend/src/main.tsx')
          s = p.read_text()
          old = '''        <p\n  className="muted"\n  style={{\n    marginTop: 10,\n    marginBottom: 8,\n    fontSize: 13\n  }}\n>\n  {t('client.timezone')}{' '}\n  {business.timezone\n    ? formatGMTOffset(\n        getTimeZoneOffsetMinutes(\n          business.timezone\n        )\n      )\n    : 'GMT+0'}\n</p>\n  <p\n    className="muted"\n    style={{\n      marginBottom: 0\n    }}\n  >\n    {t('client.chooseServiceHint')}\n  </p>'''
          new = '''        <div className="client-timezone-info">\n          <p\n            className="muted"\n            style={{ marginTop: 10, marginBottom: 5, fontSize: 13 }}\n          >\n            {t('client.businessTimezone', 'Часовой пояс бизнеса')}: {business.timezone\n              ? formatGMTOffset(getTimeZoneOffsetMinutes(business.timezone))\n              : 'GMT+0'}\n          </p>\n          <p\n            className="muted"\n            style={{ marginBottom: 0, fontSize: 13 }}\n          >\n            {t(\n              'client.slotsShownInYourTimezone',\n              'Время свободных слотов отображается по вашему часовому поясу'\n            )}: {formatGMTOffset(getTimeZoneOffsetMinutes(getClientTimeZone()))}\n          </p>\n        </div>\n        <p\n          className="muted"\n          style={{ marginTop: 8, marginBottom: 0 }}\n        >\n          {specialists.length\n            ? t('client.chooseSpecialistHint', 'Выберите специалиста ниже, чтобы продолжить.')\n            : t('client.chooseServiceHint')}\n        </p>'''
          if old not in s:
              raise SystemExit('target block not found in main.tsx')
          p.write_text(s.replace(old, new, 1))

          p = Path('frontend/src/i18n.ts')
          s = p.read_text()
          old = "'client.saveBusiness': 'Сохранить бизнес', 'client.timezone': 'Часовой пояс',"
          new = "'client.saveBusiness': 'Сохранить бизнес', 'client.timezone': 'Часовой пояс', 'client.businessTimezone': 'Часовой пояс бизнеса', 'client.slotsShownInYourTimezone': 'Время свободных слотов отображается по вашему часовому поясу', 'client.chooseSpecialistHint': 'Выберите специалиста ниже, чтобы продолжить.',"
          if old not in s:
              raise SystemExit('target dictionary block not found in i18n.ts')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff -- frontend/src/main.tsx frontend/src/i18n.ts
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/main.tsx frontend/src/i18n.ts
          git commit -m 'fix: clarify client timezone copy [timezone-copy]'
          git push
      - name: Remove workflow
        if: always()
        run: |
          rm -f .github/workflows/patch-client-timezone-copy.yml
          git add .github/workflows/patch-client-timezone-copy.yml || true
          git commit -m 'chore: remove timezone copy workflow [timezone-copy]' || true
          git push || true
