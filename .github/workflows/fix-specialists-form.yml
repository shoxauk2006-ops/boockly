name: Fix specialists form state

on:
  push:
    paths:
      - 'frontend/src/Specialists.tsx'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch form state
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/Specialists.tsx')
          text = path.read_text()
          text = text.replace("  const [editing, setEditing] = useState<Specialist | null>(null);", "  const [editing, setEditing] = useState<Specialist | null>(null);\n  const [formOpen, setFormOpen] = useState(false);", 1)
          text = text.replace("    setEditing(null); setForm(emptyForm);", "    setEditing(null); setFormOpen(true); setForm(emptyForm);", 1)
          text = text.replace("    setEditing(item);", "    setEditing(item); setFormOpen(true);", 1)
          text = text.replace("  const closeForm = () => { setEditing(null); setForm(emptyForm); setError(''); };", "  const closeForm = () => { setEditing(null); setFormOpen(false); setForm(emptyForm); setError(''); };", 1)
          text = text.replace("  const formOpen = editing !== null || form.name !== '' || form.position !== '' || form.description !== '' || form.photo !== '' || form.service_ids.length > 0;", "", 1)
          path.write_text(text)
          PY
          npx --yes tsc --noEmit --project frontend/tsconfig.json || true
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/Specialists.tsx
          git commit -m 'Fix specialists form opening state' || exit 0
          git push
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/fix-specialists-form.yml
          git add .github/workflows/fix-specialists-form.yml
          git commit -m 'Remove temporary specialists form workflow' || exit 0
          git push
