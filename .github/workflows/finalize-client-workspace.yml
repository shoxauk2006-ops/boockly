name: Restore inactive subscription limit button

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch subscription UI
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('frontend/src/main.tsx')
          text = path.read_text(encoding='utf-8')

          state_marker = "  const [subscriptionModal, setSubscriptionModal] =\n    useState(false);"
          state_insert = state_marker + "\n  const [serviceLimitOptionsOpen, setServiceLimitOptionsOpen] =\n    useState(false);\n  const [selectedServiceLimit, setSelectedServiceLimit] =\n    useState(10);"

          if 'serviceLimitOptionsOpen' not in text:
              if text.count(state_marker) != 1:
                  raise SystemExit('Subscription state marker not found exactly once')
              text = text.replace(state_marker, state_insert, 1)

          marker = "'owner.payToUnlock'"
          marker_pos = text.index(marker)

          if 'Увеличить лимит услуг' not in text:
              after_marker = text[marker_pos:]
              checkout_match = re.search(
                  r"checkout\(\s*['\"]paddle['\"]\s*,\s*business\.id(?:\s*,\s*[^)]*)?\)",
                  after_marker
              )
              if not checkout_match:
                  raise SystemExit('Inactive Paddle checkout call not found')

              checkout_pos = marker_pos + checkout_match.start()
              button_start = text.rfind('<button', marker_pos, checkout_pos)
              if button_start < 0:
                  raise SystemExit('Inactive payment button start not found')

              block = '''<div
  style={{
    marginTop: 20,
    paddingTop: 20,
    borderTop: '1px solid #eee'
  }}
>
  <button
    type="button"
    onClick={() =>
      setServiceLimitOptionsOpen(
        !serviceLimitOptionsOpen
      )
    }
    style={{
      width: '100%',
      padding: '8px 0',
      border: 'none',
      background: 'transparent',
      color: '#111',
      display: 'flex',
      alignItems: 'center',
      justifyContent: 'space-between',
      fontSize: 16,
      fontWeight: 600,
      cursor: 'pointer'
    }}
  >
    <span>{t('owner.increaseServiceLimit')}</span>
    <span style={{ fontSize: 20 }}>
      {serviceLimitOptionsOpen ? '⌃' : '›'}
    </span>
  </button>

  {serviceLimitOptionsOpen && (
    <div
      style={{
        display: 'grid',
        gap: 10,
        marginTop: 12
      }}
    >
      {[
        { limit: 20, price: '$4.99' },
        { limit: 30, price: '$7.99' },
        { limit: 50, price: '$11.99' },
        { limit: 100, price: '$19.99' }
      ].map(option => (
        <button
          key={option.limit}
          type="button"
          className="subscription-manage-button"
          disabled={subscriptionActionLoading || changingServiceLimit}
          onClick={() =>
            setSelectedServiceLimit(option.limit)
          }
          style={{
            display: 'flex',
            justifyContent: 'space-between',
            alignItems: 'center',
            width: '100%'
          }}
        >
          <span>
            {t('owner.upToServices')} {option.limit} {t('owner.services')}
          </span>
          <strong>
            {option.price} {t('owner.perMonth')}
          </strong>
        </button>
      ))}
    </div>
  )}
</div>

'''
              text = text[:button_start] + block + text[button_start:]

          marker_pos = text.index(marker)
          after_marker = text[marker_pos:]
          match = re.search(
              r"checkout\(\s*['\"]paddle['\"]\s*,\s*business\.id(?:\s*,\s*[^)]*)?\)",
              after_marker
          )
          if not match:
              raise SystemExit('Inactive Paddle checkout call not found')

          absolute_start = marker_pos + match.start()
          absolute_end = marker_pos + match.end()
          text = (
              text[:absolute_start]
              + "checkout('paddle', business.id, selectedServiceLimit)"
              + text[absolute_end:]
          )

          path.write_text(text, encoding='utf-8')

      - name: Verify
        shell: bash
        run: |
          grep -q "serviceLimitOptionsOpen" frontend/src/main.tsx
          grep -q "Увеличить лимит услуг" frontend/src/main.tsx
          grep -q "selectedServiceLimit" frontend/src/main.tsx

      - name: Commit patch and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/finalize-client-workspace.yml
          rm -f .github/workflows/restore-inactive-limit-button.yml
          rm -f .github/restore-limit-trigger.txt
          git add frontend/src/main.tsx .github/workflows/finalize-client-workspace.yml .github/workflows/restore-inactive-limit-button.yml .github/restore-limit-trigger.txt
          git commit -m "Restore inactive subscription limit button"
          git push
