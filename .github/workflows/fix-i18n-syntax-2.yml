name: Fix i18n syntax 2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message == 'Trigger i18n syntax fix 2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair only businessReadyDescription separators
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/i18n.ts')
          lines = p.read_text(encoding='utf-8').splitlines()
          changed = 0
          for i, line in enumerate(lines):
              if "'owner.businessReadyDescription'" in line and not line.rstrip().endswith(','):
                  lines[i] = line + ','
                  changed += 1
          if changed != 5:
              raise SystemExit(f'Expected 5 locale separators, changed {changed}')
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Build frontend
        run: |
          npm install --prefix frontend --no-audit --no-fund
          npm run build --prefix frontend
      - name: Commit and remove temporary files
        run: |
          git config user.name 'bookly-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend/src/i18n.ts
          git commit -m 'fix: repair i18n separators'
          git rm .github/workflows/fix-i18n-syntax-2.yml .i18n-syntax-trigger-2
          git commit -m 'chore: remove temporary i18n repair files'
          git push
