name: Fix Telegram white screen
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch timezone startup computation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/main.tsx')
          s = p.read_text(encoding='utf-8')
          start = s.index('const TIMEZONE_BY_OFFSET =')
          end = s.index('\nfunction App(){', start)
          replacement = '''const TIMEZONE_BY_OFFSET = TIMEZONE_OPTIONS.map(([zone]) => {
  const offset = getTimeZoneOffsetMinutes(zone);
  return {
    zone,
    offset,
    label: `${formatGMTOffset(offset)} — ${getTimeZoneLabel(zone)}`
  };
});
'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/main.tsx
          git commit -m "Fix Mini App startup freeze from timezone initialization"
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-telegram-white-screen.yml
          git commit -m "Remove temporary Telegram white screen workflow"
          git push
