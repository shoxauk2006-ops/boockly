name: Bookly info i18n fix

on:
  push:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix hardcoded info tabs
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('frontend/src/main.tsx')
          text = path.read_text(encoding='utf-8')

          text = re.sub(
              r"(onClick=\{\(\) =>\s*setInfoSection\('help'\)\s*\}\s*>\s*)Как работает Bookly(\s*</button>)",
              r"\1{t('info.howBooklyWorks')}\2",
              text,
          )

          text = re.sub(
              r"(onClick=\{\(\) =>\s*setInfoSection\('rules'\)\s*\}\s*>\s*)Правила и контакты(\s*</button>)",
              r"\1{t('info.rulesAndContacts')}\2",
              text,
          )

          path.write_text(text, encoding='utf-8')

      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/main.tsx
          git rm .github/workflows/bookly-info-i18n-fix.yml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Translate Bookly info tabs"
          git push
