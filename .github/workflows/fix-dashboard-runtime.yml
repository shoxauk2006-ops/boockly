name: Fix Mini App dashboard runtime error

on:
  push:
    paths:
      - '.github/workflows/fix-dashboard-runtime.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix stale Dashboard references
        shell: python
        run: |
          from pathlib import Path

          path = Path('frontend/src/main.tsx')
          text = path.read_text(encoding='utf-8')

          marker = "function Dashboard({\n"
          if marker not in text:
              raise SystemExit('Dashboard function not found')

          insert_after = "}) {\n"
          start = text.index(marker)
          pos = text.index(insert_after, start) + len(insert_after)

          guard = "  // Legacy subscription UI was removed from the Mini App.\n  // Keep these values only as compatibility guards for stale JSX while the website owns billing.\n  const subscriptionLocked = false;\n  const showProModal = (_reason: string) => {};\n\n"

          if "const subscriptionLocked = false;" not in text:
              text = text[:pos] + guard + text[pos:]

          path.write_text(text, encoding='utf-8')

      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/main.tsx
          git commit -m "Fix Mini App dashboard runtime error"
          git push
          rm -f .github/workflows/fix-dashboard-runtime.yml
          git add .github/workflows/fix-dashboard-runtime.yml
          git commit -m "Remove one-time runtime fix workflow"
          git push
