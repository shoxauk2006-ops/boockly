name: Apply profile trial fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[trial-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch trial logic
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Missing expected block in {path}: {old[:120]!r}')
                  text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          patch('backend/paddle_original.py', [
              (
                  'from sqlalchemy import text\n',
                  'from sqlalchemy import inspect, text\n',
              ),
              (
                  '''PRICE_IDS = {\n    10: _env("BOOKLY_BASE_PRICE_ID"),\n    20: _env("SERVICE_ADDON_20_PRICE_ID"),\n    30: _env("SERVICE_ADDON_30_PRICE_ID"),\n    50: _env("SERVICE_ADDON_50_PRICE_ID"),\n    100: _env("SERVICE_ADDON_100_PRICE_ID"),\n}\n\nLIMITS = {10, 20, 30, 50, 100}\n''',
                  '''PRICE_IDS = {\n    10: _env("BOOKLY_BASE_PRICE_ID"),\n    20: _env("SERVICE_ADDON_20_PRICE_ID"),\n    30: _env("SERVICE_ADDON_30_PRICE_ID"),\n    50: _env("SERVICE_ADDON_50_PRICE_ID"),\n    100: _env("SERVICE_ADDON_100_PRICE_ID"),\n}\n\n# Paddle trials belong to a Price. A separate recurring Price without a\n# trial is required for profiles that already used the free trial.\nNO_TRIAL_BASE_PRICE_ID = _env("BOOKLY_BASE_NO_TRIAL_PRICE_ID")\n\nLIMITS = {10, 20, 30, 50, 100}\n\n\ndef _ensure_trial_schema() -> None:\n    with engine.begin() as conn:\n        inspector = inspect(conn)\n        if "telegram_user_languages" not in inspector.get_table_names():\n            return\n\n        columns = {\n            column["name"]\n            for column in inspector.get_columns(\n                "telegram_user_languages"\n            )\n        }\n\n        if "free_trial_used" not in columns:\n            conn.execute(\n                text(\n                    """\n                    ALTER TABLE telegram_user_languages\n                    ADD COLUMN free_trial_used BOOLEAN DEFAULT FALSE\n                    """\n                )\n            )\n\n\n_ensure_trial_schema()\n''',
              ),
              (
                  'def _event_already_processed(db, event_id: str) -> bool:\n',
                  '''def _profile_trial_used(db, owner_telegram_id: int) -> bool:\n    row = db.execute(\n        text(\n            """\n            SELECT free_trial_used\n            FROM telegram_user_languages\n            WHERE telegram_user_id = :owner_id\n            """\n        ),\n        {"owner_id": owner_telegram_id},\n    ).mappings().first()\n    return bool(row and row.get("free_trial_used"))\n\n\ndef _mark_profile_trial_used(db, owner_telegram_id: int) -> None:\n    row = db.execute(\n        text(\n            """\n            SELECT telegram_user_id\n            FROM telegram_user_languages\n            WHERE telegram_user_id = :owner_id\n            """\n        ),\n        {"owner_id": owner_telegram_id},\n    ).first()\n\n    if row:\n        db.execute(\n            text(\n                """\n                UPDATE telegram_user_languages\n                SET free_trial_used = TRUE\n                WHERE telegram_user_id = :owner_id\n                """\n            ),\n            {"owner_id": owner_telegram_id},\n        )\n    else:\n        db.execute(\n            text(\n                """\n                INSERT INTO telegram_user_languages(\n                    telegram_user_id,\n                    language,\n                    free_trial_used\n                )\n                VALUES (\n                    :owner_id,\n                    'en',\n                    TRUE\n                )\n                """\n            ),\n            {"owner_id": owner_telegram_id},\n        )\n\n\ndef _trial_available_for_profile(db, owner_telegram_id: int) -> bool:\n    existing_trial = (\n        db.query(Subscription)\n        .filter(\n            Subscription.owner_telegram_id == owner_telegram_id,\n            Subscription.status == "trialing",\n        )\n        .first()\n    )\n\n    if existing_trial:\n        _mark_profile_trial_used(db, owner_telegram_id)\n        return False\n\n    return not _profile_trial_used(db, owner_telegram_id)\n\n\ndef _event_already_processed(db, event_id: str) -> bool:\n''',
              ),
              (
                  '@app.post("/admin/subscription/checkout-token")\n',
                  '''@app.get("/admin/subscription/trial-status")\ndef subscription_trial_status(\n    x_telegram_init_data: str = Header(default=""),\n):\n    user = telegram_user(x_telegram_init_data)\n    owner_id = int(user["id"])\n\n    with SessionLocal() as db:\n        trial_available = _trial_available_for_profile(db, owner_id)\n        db.commit()\n        return {"trial_available": trial_available}\n\n\n@app.post("/admin/subscription/checkout-token")\n''',
              ),
              (
                  '''        if not business:\n            raise HTTPException(\n                404,\n                "Business not found",\n            )\n\n        return {\n            "token": _create_checkout_token(\n                business.id,\n                owner_id,\n            )\n        }\n''',
                  '''        if not business:\n            raise HTTPException(\n                404,\n                "Business not found",\n            )\n\n        trial_available = _trial_available_for_profile(\n            db,\n            owner_id,\n        )\n\n        if not trial_available and not NO_TRIAL_BASE_PRICE_ID:\n            raise HTTPException(\n                500,\n                "Bookly regular Price ID is not configured",\n            )\n\n        token = _create_checkout_token(\n            business.id,\n            owner_id,\n        )\n        db.commit()\n\n        return {\n            "token": token,\n            "trial_available": trial_available,\n        }\n''',
              ),
              (
                  '''            if subscription.status == "trialing":\n                subscription.active = True\n\n            subscription.expires_at = (\n''',
                  '''            if subscription.status == "trialing":\n                subscription.active = True\n                _mark_profile_trial_used(\n                    db,\n                    int(business.owner_telegram_id),\n                )\n\n            subscription.expires_at = (\n''',
              ),
          ])

          patch('frontend/src/paddle-env-bridge.ts', [
              (
                  'const prices: Record<number, string> = {\n',
                  'const prices: Record<number | \'noTrialBase\', string> = {\n',
              ),
              (
                  '''  10: isLive\n    ? import.meta.env.VITE_PADDLE_LIVE_BOOKLY_BASE_PRICE_ID\n    : import.meta.env.VITE_PADDLE_SANDBOX_BOOKLY_BASE_PRICE_ID,\n  20: isLive\n''',
                  '''  10: isLive\n    ? import.meta.env.VITE_PADDLE_LIVE_BOOKLY_BASE_PRICE_ID\n    : import.meta.env.VITE_PADDLE_SANDBOX_BOOKLY_BASE_PRICE_ID,\n  noTrialBase: isLive\n    ? import.meta.env.VITE_PADDLE_LIVE_BOOKLY_BASE_NO_TRIAL_PRICE_ID\n    : import.meta.env.VITE_PADDLE_SANDBOX_BOOKLY_BASE_NO_TRIAL_PRICE_ID,\n  20: isLive\n''',
              ),
          ])

          patch('frontend/src/main.tsx', [
              (
                  '''const paddlePrices = (\n  window as any\n).__booklyPaddlePrices as Record<number, string> | undefined;\n''',
                  '''const paddlePrices = (\n  window as any\n).__booklyPaddlePrices as\n  | (Record<number, string> & {\n      noTrialBase?: string;\n    })\n  | undefined;\n''',
              ),
              (
                  '''const items = [\n  {\n    priceId: paddlePrices[10],\n    quantity: 1\n  }\n];\n\nif (\n  servicesLimit > 10 &&\n  paddlePrices[servicesLimit]\n) {\n  items.push({\n    priceId: paddlePrices[servicesLimit],\n    quantity: 1\n  });\n}\n\n''',
                  '',
              ),
              (
                  '''const tokenData =\n  await tokenResponse.json().catch(\n    () => null\n  );\n\nif (\n  !tokenResponse.ok ||\n  !tokenData?.token\n) {\n  throw new Error(\n    tokenData?.detail ||\n    t(\n      'owner.paymentPreparationError',\n      'Не удалось подготовить оплату'\n    )\n  );\n}\n\nwindow.Paddle.Checkout.open({\n  items,\n  customData: {\n  checkout_token:\n    tokenData.token\n}\n  });\n''',
                  '''const tokenData =\n  await tokenResponse.json().catch(\n    () => null\n  );\n\nif (\n  !tokenResponse.ok ||\n  !tokenData?.token\n) {\n  throw new Error(\n    tokenData?.detail ||\n    t(\n      'owner.paymentPreparationError',\n      'Не удалось подготовить оплату'\n    )\n  );\n}\n\nconst trialAvailable =\n  Boolean(tokenData.trial_available);\n\nconst basePriceId =\n  trialAvailable\n    ? paddlePrices[10]\n    : paddlePrices.noTrialBase;\n\nif (!basePriceId) {\n  throw new Error(\n    trialAvailable\n      ? t(\n          'owner.paddleConfigError',\n          'Платёжная система ещё не настроена.'\n        )\n      : t(\n          'owner.paddleRegularPriceError',\n          'Не настроена обычная цена подписки.'\n        )\n  );\n}\n\nconst checkoutItems = [\n  {\n    priceId: basePriceId,\n    quantity: 1\n  }\n];\n\nif (\n  servicesLimit > 10 &&\n  paddlePrices[servicesLimit]\n) {\n  checkoutItems.push({\n    priceId: paddlePrices[servicesLimit],\n    quantity: 1\n  });\n}\n\nwindow.Paddle.Checkout.open({\n  items: checkoutItems,\n  customData: {\n    checkout_token:\n      tokenData.token\n  }\n});\n''',
              ),
              (
                  '''  const [subscriptionActionLoading, setSubscriptionActionLoading] =\n    useState(false);\n  const [inactiveLimitOptionsOpen, setInactiveLimitOptionsOpen] =\n''',
                  '''  const [subscriptionActionLoading, setSubscriptionActionLoading] =\n    useState(false);\n  const [trialAvailable, setTrialAvailable] =\n    useState<boolean | null>(null);\n  const [inactiveLimitOptionsOpen, setInactiveLimitOptionsOpen] =\n''',
              ),
              (
                  '  const cancelSubscription = async () => {\n',
                  '''  useEffect(() => {\n    let cancelled = false;\n\n    const loadTrialStatus = async () => {\n      try {\n        const response = await fetch(\n          API + '/admin/subscription/trial-status',\n          { headers: headers() }\n        );\n\n        const data = await response.json().catch(\n          () => null\n        );\n\n        if (!cancelled && response.ok) {\n          setTrialAvailable(\n            Boolean(data?.trial_available)\n          );\n        }\n      } catch (error) {\n        console.error(\n          'BOOKLY TRIAL STATUS ERROR:',\n          error\n        );\n      }\n    };\n\n    loadTrialStatus();\n\n    return () => {\n      cancelled = true;\n    };\n  }, [business?.id]);\n\n  const cancelSubscription = async () => {\n''',
              ),
              (
                  '''        <div\n  style={{\n    marginTop: 16,\n    padding: '13px 14px',\n    borderRadius: 12,\n    background: '#f8f9fa',\n    border: '1px solid #e5e7eb',\n    fontSize: 14,\n    lineHeight: 1.45\n  }}\n>\n  <strong>\n    {t(\n      'owner.freeTrialTitle',\n      '7 дней бесплатно'\n    )}\n  </strong>\n\n  <div style={{ marginTop: 5 }}>\n    {t(\n      'owner.freeTrialToday',\n      'Попробуйте Bookly бесплатно в течение 7 дней. Сегодня списание — $0.'\n    )}\n  </div>\n\n  <div style={{ marginTop: 5 }}>\n    {t(\n      'owner.freeTrialAfter',\n      'После окончания пробного периода подписка автоматически продлится за $7.99/месяц, если её не отменить.'\n    )}\n  </div>\n\n  <div\n    style={{\n      marginTop: 6,\n      fontSize: 13,\n      opacity: 0.7\n    }}\n  >\n    {t(\n      'owner.freeTrialCancel',\n      'Отмена в любой момент.'\n    )}\n  </div>\n</div>\n\n<button\n  type="button"\n  className="primary full"\n  style={{ marginTop: 10 }}\n  onClick={() =>\n    checkout(\n      'paddle',\n      business.id,\n      inactiveSelectedServiceLimit\n    )\n  }\n>\n  {t(\n    'owner.startFreeTrial',\n    'Начать 7-дневный бесплатный период'\n  )}\n</button>''',
                  '''        {trialAvailable !== false && (\n          <div\n            style={{\n              marginTop: 16,\n              padding: '13px 14px',\n              borderRadius: 12,\n              background: '#f8f9fa',\n              border: '1px solid #e5e7eb',\n              fontSize: 14,\n              lineHeight: 1.45\n            }}\n          >\n            <strong>\n              {t(\n                'owner.freeTrialTitle',\n                '7 дней бесплатно'\n              )}\n            </strong>\n\n            <div style={{ marginTop: 5 }}>\n              {t(\n                'owner.freeTrialToday',\n                'Попробуйте Bookly бесплатно в течение 7 дней. Сегодня списание — $0.'\n              )}\n            </div>\n\n            <div style={{ marginTop: 5 }}>\n              {t(\n                'owner.freeTrialAfter',\n                'После окончания пробного периода подписка автоматически продлится за $7.99/месяц, если её не отменить.'\n              )}\n            </div>\n\n            <div\n              style={{\n                marginTop: 6,\n                fontSize: 13,\n                opacity: 0.7\n              }}\n            >\n              {t(\n                'owner.freeTrialCancel',\n                'Отмена в любой момент.'\n              )}\n            </div>\n          </div>\n        )}\n\n        <button\n          type="button"\n          className="primary full"\n          style={{ marginTop: 10 }}\n          onClick={() =>\n            checkout(\n              'paddle',\n              business.id,\n              inactiveSelectedServiceLimit\n            )\n          }\n        >\n          {trialAvailable === false\n            ? t(\n                'owner.openAccess',\n                'Оплатить подписку'\n              )\n            : t(\n                'owner.startFreeTrial',\n                'Начать 7-дневный бесплатный период'\n              )}\n        </button>''',
              ),
          ])

          # Add the one new fallback translation key if it is not already present.
          p = Path('frontend/src/i18n.ts')
          text = p.read_text(encoding='utf-8')
          if "owner.paddleRegularPriceError" not in text:
              marker = "'owner.startFreeTrial'"
              idx = text.find(marker)
              if idx == -1:
                  raise SystemExit('Missing translation marker')
              line_end = text.find('\n', idx)
              text = text[:line_end] + "\n'owner.paddleRegularPriceError': 'Не настроена обычная цена подписки.'," + text[line_end:]
              p.write_text(text, encoding='utf-8')
          
          # Remove this one-time workflow after applying the fix.
          wf = Path('.github/workflows/apply-profile-trial-fix.yml')
          if wf.exists():
              wf.unlink()
          PY

      - name: Validate backend syntax
        run: python -m py_compile backend/paddle_original.py

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/paddle_original.py frontend/src/paddle-env-bridge.ts frontend/src/main.tsx frontend/src/i18n.ts .github/workflows/apply-profile-trial-fix.yml
          git diff --cached --quiet || git commit -m 'Enforce one free trial per profile [trial-fix]'
          git push origin main
