name: Fix Paddle cancellation state

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix Paddle scheduled cancellation state'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch paddle webhook
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("backend/paddle_app.py")
          text = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r'''(?ms)^            if \(\n                scheduled_action in \{"cancel", "pause"\}\n                and scheduled_effective_at\n            \):\n.*?^            else:\n'''
          )

          replacement = '''            if (
                scheduled_action in {"cancel", "pause"}
                and scheduled_effective_at
            ):
                if scheduled_action == "cancel":
                    # Paddle keeps the subscription status active until the
                    # scheduled cancellation takes effect. Bookly keeps
                    # access active too, but records that auto-renewal was
                    # cancelled so the UI does not show it as renewable.
                    subscription.status = "cancelled"
                    subscription.active = True
                else:
                    subscription.status = "active"
                    subscription.active = True

                subscription.cancel_at = (
                    scheduled_effective_at
                )

                subscription.expires_at = (
                    scheduled_effective_at
                )
            else:
'''

          new_text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(
                  f"Expected exactly one Paddle scheduled-change block, found {count}"
              )

          path.write_text(new_text, encoding="utf-8")

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/paddle_app.py
          git rm .github/workflows/fix-paddle-cancel.yml
          git commit -m "Fix Paddle scheduled cancellation state"
          git push
