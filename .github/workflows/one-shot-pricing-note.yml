name: one-shot-pricing-note
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-pricing-note.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add annual trial note
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/public/landing.html')
          s=p.read_text()
          old="set('pNote',d.trial+' '+(d.cancel||'Cancel anytime.'));set('pLimit',d.limit||d.upTo);"
          new="set('pNote',d.trial+' '+d.annual+' '+(d.cancel||'Cancel anytime.'));set('pLimit',d.limit||d.upTo);"
          if old not in s: raise SystemExit('Expected pricing note code not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/public/landing.html
          git rm .github/workflows/one-shot-pricing-note.yml
          git commit -m 'Clarify annual pricing trial terms'
          git push