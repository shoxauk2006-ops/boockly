name: one-shot-pricing-cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-pricing-cleanup.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update landing pricing copy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('frontend/public/landing.html')
          s = p.read_text()

          old_note = "set('pNote',d.trial+' '+d.annual+' '+(d.cancel||'Cancel anytime.'));"
          new_note = "set('pNote',d.trial+' '+(d.cancel||'Cancel anytime.'));"
          if old_note not in s:
              raise SystemExit('Expected pricing note code not found')
          s = s.replace(old_note, new_note, 1)

          old_up_to = "set('pUpTo',d.upTo);"
          new_up_to = "set('pUpTo',d.limit||d.upTo);"
          if old_up_to in s:
              s = s.replace(old_up_to, new_up_to, 1)
          elif "set('pUpTo',d.limit||d.upTo);" not in s:
              raise SystemExit('Expected pUpTo code not found')

          old_limit = "set('pLimit',d.limit||d.upTo);"
          new_limit = "set('pLimit','');"
          if old_limit not in s:
              raise SystemExit('Expected pLimit code not found')
          s = s.replace(old_limit, new_limit, 1)

          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/public/landing.html
          git rm .github/workflows/one-shot-pricing-cleanup.yml
          git commit -m 'Refine landing pricing copy'
          git push
