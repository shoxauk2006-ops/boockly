name: Fix service limit loader

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix service limit loader'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch frontend loader
        shell: python
        run: |
          from pathlib import Path

          frontend = Path('frontend/src/main.tsx')
          text = frontend.read_text(encoding='utf-8')

          old = '''      setBusiness(selected);\n      return selected;'''

          new = '''      // Загружаем актуальный лимит подписки с сервера.\n      try {\n        const businessResponse = await fetch(\n          API + '/admin/business',\n          { headers: headers() }\n        );\n\n        if (businessResponse.ok) {\n          const businessData =\n            await businessResponse.json();\n\n          const savedLimit = Number(\n            businessData?.services_limit\n          );\n\n          if (\n            Number.isInteger(savedLimit) &&\n            savedLimit >= 10\n          ) {\n            setServiceLimit(savedLimit);\n            setNewServiceLimit(savedLimit);\n          }\n        }\n      } catch (error) {\n        console.error(\n          'LOAD SERVICE LIMIT ERROR:',\n          error\n        );\n      }\n\n      setBusiness(selected);\n      return selected;'''

          if old not in text:
              raise SystemExit('Frontend loadBusinesses target not found')

          frontend.write_text(
              text.replace(old, new, 1),
              encoding='utf-8'
          )

      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-service-limit-persistence.yml
          git add frontend/src/main.tsx .github/workflows/fix-service-limit-persistence.yml
          git commit -m "Fix service limit loader"
          git push
