name: Patch timezone startup
on:
  push:
    paths:
      - .github/workflows/patch-timezone-startup.yml
jobs:
  patch:
    if: github.event.head_commit.message != 'Fix Mini App startup freeze from timezone initialization'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace expensive timezone initialization
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/main.tsx')
          s = p.read_text(encoding='utf-8')
          start = s.index('const TIMEZONE_BY_OFFSET =')
          end = s.index('\nfunction App(){', start)
          replacement = '''const TIMEZONE_BY_OFFSET = TIMEZONE_OPTIONS.map(([zone]) => {
            const offset = getTimeZoneOffsetMinutes(zone);
            return {
              zone,
              offset,
              label: `${formatGMTOffset(offset)} — ${getTimeZoneLabel(zone)}`
            };
          });
          '''
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/main.tsx
          git commit -m "Fix Mini App startup freeze from timezone initialization"
          git push
