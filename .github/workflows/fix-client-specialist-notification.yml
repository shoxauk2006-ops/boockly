name: Fix client specialist notification
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[client-specialist-notification]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch client confirmation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/app.py')
          s = p.read_text()

          if 'client_specialist_notification_marker' in s:
              raise SystemExit('already patched')

          success = '"text": (\n                    "✅ <b>Вы успешно записаны!</b>\\n\\n"\n                    f"💈 {s.name}\\n"'
          pos = s.rfind(success)
          if pos < 0:
              raise SystemExit('client success notification not found')

          block_start = s.rfind('        telegram_api(', 0, pos)
          if block_start < 0:
              raise SystemExit('client telegram_api call not found')

          specialist_code = '''        # client_specialist_notification_marker
        specialist = (
            db.get(Specialist, booking.specialist_id)
            if booking.specialist_id is not None
            else None
        )
        specialist_line = (
            f"👨‍💼 {specialist.name}\\n"
            if specialist and specialist.name
            else ""
        )

'''
          s = s[:block_start] + specialist_code + s[block_start:]

          pos = s.rfind(success)
          if pos < 0:
              raise SystemExit('client success notification disappeared')
          insert_at = pos + len(success)
          s = s[:insert_at] + '                    f"{specialist_line}"\n' + s[insert_at:]

          p.write_text(s)
          PY
          python3 -m py_compile backend/app.py
      - name: Commit patch and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/app.py .github/workflows/fix-client-specialist-notification.yml
          git commit -m 'fix: include specialist in client booking confirmation [client-specialist-notification]'
          git push
          git rm .github/workflows/fix-client-specialist-notification.yml
          git commit -m 'chore: remove client specialist notification workflow [client-specialist-notification]'
          git push
