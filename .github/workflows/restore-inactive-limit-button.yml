name: Restore inactive subscription limit button

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore limit selector
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('frontend/src/main.tsx')
          text = path.read_text(encoding='utf-8')

          state_marker = "  const [subscriptionModal, setSubscriptionModal] =\n  useState(false);"
          state_insert = state_marker + "\n  const [serviceLimitOptionsOpen, setServiceLimitOptionsOpen] =\n  useState(false);\n  const [selectedServiceLimit, setSelectedServiceLimit] =\n  useState(10);"
          if 'serviceLimitOptionsOpen' not in text:
              if text.count(state_marker) != 1:
                  raise SystemExit('Subscription state marker not found exactly once')
              text = text.replace(state_marker, state_insert, 1)

          marker = "'owner.payToUnlock'"
          marker_pos = text.index(marker)

          if 'Увеличить лимит услуг' not in text:
              section_start = text.rfind('<div', 0, marker_pos)
              if section_start < 0:
                  raise SystemExit('Inactive subscription section start not found')

              block = '''<div
  style={{
    marginTop: 20,
    paddingTop: 20,
    borderTop: '1px solid #eee'
  }}
>
  <button
    type="button"
    onClick={() =>
      setServiceLimitOptionsOpen(
        !serviceLimitOptionsOpen
      )
    }
    style={{
      width: '100%',
      padding: '8px 0',
      border: 'none',
      background: 'transparent',
      color: '#111',
      display: 'flex',
      alignItems: 'center',
      justifyContent: 'space-between',
      fontSize: 16,
      fontWeight: 600,
      cursor: 'pointer'
    }}
  >
    <span>{t('owner.increaseServiceLimit', 'Увеличить лимит услуг')}</span>
    <span style={{ fontSize: 20 }}>
      {serviceLimitOptionsOpen ? '⌃' : '›'}
    </span>
  </button>

  {serviceLimitOptionsOpen && (
    <div
      style={{
        display: 'grid',
        gap: 8,
        marginTop: 12
      }}
    >
      {[
        { limit: 20, addon: 4.99, total: 12.98 },
        { limit: 30, addon: 7.99, total: 15.98 },
        { limit: 50, addon: 11.99, total: 19.98 },
        { limit: 100, addon: 19.99, total: 27.98 }
      ].map(option => {
        const selected =
          selectedServiceLimit === option.limit;

        return (
          <button
            key={option.limit}
            type="button"
            onClick={() =>
              setSelectedServiceLimit(
                option.limit
              )
            }
            style={{
              width: '100%',
              padding: '13px 14px',
              borderRadius: 12,
              border: selected
                ? '2px solid #111'
                : '1px solid #ddd',
              background: selected
                ? '#f5f5f5'
                : '#fff',
              color: '#111',
              textAlign: 'left',
              cursor: 'pointer'
            }}
          >
            <div
              style={{
                display: 'flex',
                justifyContent: 'space-between',
                alignItems: 'center',
                gap: 12
              }}
            >
              <strong>
                До {option.limit} {t('owner.services', 'услуг')}
              </strong>
              <span style={{ fontWeight: 700 }}>
                {selected ? '✓' : '○'}
              </span>
            </div>
            <div
              className="muted"
              style={{ marginTop: 5 }}
            >
              +${option.addon.toFixed(2)} {t('owner.perMonth', '/ месяц')}
            </div>
            <div
              style={{
                marginTop: 3,
                fontSize: 13
              }}
            >
              {t('owner.total', 'Итого')}: ${option.total.toFixed(2)} {t('owner.perMonth', '/ месяц')}
            </div>
          </button>
        );
      })}
    </div>
  )}
</div>

'''
              text = text[:section_start] + block + text[section_start:]

          marker_pos = text.index(marker)
          after_marker = text[marker_pos:]
          match = re.search(r"checkout\(\s*['\"]paddle['\"]\s*,\s*business\.id(?:\s*,\s*[^)]*)?\)", after_marker)
          if not match:
              raise SystemExit('Inactive Paddle checkout call not found')

          old_call = match.group(0)
          new_call = "checkout('paddle', business.id, selectedServiceLimit)"
          absolute_start = marker_pos + match.start()
          absolute_end = marker_pos + match.end()
          text = text[:absolute_start] + new_call + text[absolute_end:]

          path.write_text(text, encoding='utf-8')
      
      - name: Verify source
        shell: bash
        run: |
          grep -q "serviceLimitOptionsOpen" frontend/src/main.tsx
          grep -q "Увеличить лимит услуг" frontend/src/main.tsx
          grep -q "selectedServiceLimit" frontend/src/main.tsx

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/restore-inactive-limit-button.yml
          git add frontend/src/main.tsx .github/workflows/restore-inactive-limit-button.yml
          git commit -m "Restore inactive subscription limit button"
          git push
