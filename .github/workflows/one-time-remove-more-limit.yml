name: Remove buggy More limit editor

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  remove-more-limit-editor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Remove More limit editor and modal
        shell: python
        run: |
          from pathlib import Path

          path = Path('frontend/src/main.tsx')
          text = path.read_text(encoding='utf-8')

          start = """        <div className=\"card\" style={{ marginTop: 16 }}>\n      <h3>Лимит услуг</h3>"""
          end = """\n         </div>\n  </div>\n</div>\n)}\n{limitModalOpen && limitPreview && ("""

          if start not in text:
              raise SystemExit('ERROR: More-tab limit editor start marker was not found')
          if end not in text:
              raise SystemExit('ERROR: More-tab limit editor end marker was not found')

          text = text.replace(start + text.split(start, 1)[1].split(end, 1)[0] + end,
                              "\n  </div>\n</div>\n)}\n{limitModalOpen && limitPreview && (", 1)

          modal_start = "{limitModalOpen && limitPreview && ("
          modal_end = "\n)}\n<nav className=\"admin-bottom-nav\">"

          if modal_start not in text:
              raise SystemExit('ERROR: limit modal start marker was not found')
          if modal_end not in text:
              raise SystemExit('ERROR: limit modal end marker was not found')

          before, rest = text.split(modal_start, 1)
          _, after = rest.split(modal_end, 1)
          text = before + "<nav className=\"admin-bottom-nav\">" + after

          path.write_text(text, encoding='utf-8')

      - name: Verify build source structure
        run: |
          grep -n "Лимит услуг" frontend/src/main.tsx || true
          if grep -q "limitModalOpen && limitPreview" frontend/src/main.tsx; then
            echo "ERROR: limit modal still exists"
            exit 1
          fi
          if grep -q "<input" frontend/src/main.tsx && grep -n "newServiceLimit" frontend/src/main.tsx; then
            echo "Note: old unused state remains, but the buggy input UI was removed."
          fi

      - name: Commit changes and remove this one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-remove-more-limit.yml
          git add frontend/src/main.tsx .github/workflows/one-time-remove-more-limit.yml
          git diff --cached --quiet && echo "No changes needed" && exit 0
          git commit -m "Remove service limit editor from More tab"
          git push