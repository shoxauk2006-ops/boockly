name: Fix main.tsx syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix malformed Subscription JSX
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/main.tsx')
          s = p.read_text()
          old = """          onClick={() =>\n            checkout(\n              'paddle',\n              business.id\n            )\n  return (\n"""
          new = """          onClick={() =>\n            checkout(\n              'paddle',\n              business.id\n            )\n          >\n            {t(\n              'owner.openAccess',\n              'Открыть доступ'\n            )}\n          </button>\n\n      </div>\n    );\n  }\n\n  return (\n"""
          if old not in s:
              print('Target syntax is already fixed or has changed; no edit needed.')
              raise SystemExit(0)
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/main.tsx
          git rm .github/workflows/fix-main-tsx.yml
          git commit -m "Fix Subscription JSX syntax" || exit 0
          git push
