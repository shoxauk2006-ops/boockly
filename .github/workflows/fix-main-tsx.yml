name: Repair main.tsx

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Remove temporary repair workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair duplicate function closure
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/main.tsx')
          s = p.read_text()
          old = "};\n  };\n\n  if (loading) {"
          new = "};\n\n  if (loading) {"
          if old not in s:
              raise SystemExit('Expected duplicate closure was not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/main.tsx
          git commit -m 'Fix main.tsx duplicate closure'
          git push
