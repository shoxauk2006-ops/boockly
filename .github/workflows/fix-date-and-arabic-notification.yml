name: Fix date and Arabic notifications

on:
  push:
    paths:
      - '.github/workflows/fix-date-and-arabic-notification.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch frontend date handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('frontend/src/main.tsx')
          s = p.read_text(encoding='utf-8')

          marker = "const localizedDays = (\n  t: (key: string, fallback?: string) => string\n) => ["
          if "const getTodayTashkent = () =>" not in s:
              helper = "const getTodayTashkent = () =>\n  new Intl.DateTimeFormat('en-CA', {\n    timeZone: 'Asia/Tashkent',\n    year: 'numeric',\n    month: '2-digit',\n    day: '2-digit'\n  }).format(new Date());\n\n"
              s = s.replace(marker, helper + marker, 1)

          s, count = re.subn(
              r"new Date\(\)\s*\.toISOString\(\)\s*\.slice\(\s*0\s*,\s*10\s*\)",
              "getTodayTashkent()",
              s,
          )
          print('Replaced UTC-based date expressions:', count)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Patch Telegram language routing and fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('backend/app.py')
          s = p.read_text(encoding='utf-8')

          old = '''        effective_lang = (\n            request_lang\n            if request_lang and request_user_id == chat_id\n            else _bookly_user_language(chat_id)\n        )'''
          new = '''        effective_lang = (\n            request_lang\n            or _bookly_user_language(chat_id)\n        )'''
          if old not in s:
              raise SystemExit('language selection block not found')
          s = s.replace(old, new, 1)

          old_send = '''    try:\n        with urllib_request.urlopen(req, timeout=8) as response:\n            return json.loads(response.read().decode("utf-8"))\n    except (URLError, TimeoutError, ValueError):\n        return None'''
          new_send = '''    try:\n        with urllib_request.urlopen(req, timeout=8) as response:\n            result = json.loads(response.read().decode("utf-8"))\n            if (\n                method == "sendMessage"\n                and isinstance(result, dict)\n                and result.get("ok") is False\n                and payload.get("parse_mode")\n            ):\n                retry_payload = dict(payload)\n                retry_payload.pop("parse_mode", None)\n                retry_data = json.dumps(retry_payload).encode("utf-8")\n                retry_req = urllib_request.Request(\n                    f"https://api.telegram.org/bot{BOT_TOKEN}/{method}",\n                    data=retry_data,\n                    headers={"Content-Type":"application/json"},\n                    method="POST",\n                )\n                with urllib_request.urlopen(retry_req, timeout=8) as retry_response:\n                    return json.loads(retry_response.read().decode("utf-8"))\n            return result\n    except (URLError, TimeoutError, ValueError) as exc:\n        print("TELEGRAM SEND ERROR:", repr(exc), flush=True)\n        return None'''
          if old_send not in s:
              raise SystemExit('Telegram send block not found')
          s = s.replace(old_send, new_send, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fixes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/main.tsx backend/app.py
          git rm -f .github/workflows/fix-date-and-arabic-notification.yml
          git commit -m "fix: use Tashkent date and selected notification language"
          git push
