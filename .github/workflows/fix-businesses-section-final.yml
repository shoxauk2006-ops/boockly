name: Fix businesses section navigation

on:
  push:
    paths:
      - '.github/workflows/fix-businesses-section-final.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply businesses navigation fix
        shell: python
        run: |
          from pathlib import Path
          p = Path('frontend/src/main.tsx')
          s = p.read_text(encoding='utf-8')
          original = s

          # Open the Businesses section instead of the create flow from the home card.
          old = """onAdmin={() => {
              setAdminTab('home');
              setMode('admin');
            }}"""
          new = """onAdmin={() => {
              setAdminTab('businesses');
              setMode('admin');
            }}"""
          if old in s:
              s = s.replace(old, new, 1)

          # If there are no businesses, keep the user in the Businesses section.
          old = """setBusiness(null);
        return null;"""
          new = """setBusiness(null);
        setBusinessPanel('list');
        return null;"""
          if old in s:
              s = s.replace(old, new, 1)

          # Only show the creation flow after the explicit Add Business action.
          old = """if (!business) {
    return ("""
          new = """if (!business && businessPanel !== 'create') {
    return ("""
          if old in s:
              s = s.replace(old, new, 1)

          # Make the empty/list view explicitly provide Add Business.
          marker = """if (!business && businessPanel !== 'create') {
    return ("""
          if marker in s and "Добавить бизнес" not in s[s.index(marker):s.index(marker)+5000]:
              start = s.index(marker)
              # Insert an Add Business card before the existing create-only branch.
              insert = """\n      <section className=\"card\" style={{marginTop: 16}}>\n        <h2>Мои бизнесы</h2>\n        <p className=\"muted\">У вас пока нет добавленных бизнесов.</p>\n        <button type=\"button\" className=\"primary full\" onClick={() => setBusinessPanel('create')}>\n          + Добавить бизнес\n        </button>\n      </section>\n"""
              # Place after the opening return container's first section only when safe.
              pos = s.find('</section>', start)
              if pos != -1:
                  s = s[:pos+10] + insert + s[pos+10:]

          # Home card should open Businesses, not directly offer creation.
          s = s.replace('>Создать бизнес</button>', '>Открыть</button>', 1)

          if s == original:
              raise SystemExit('No expected changes found; aborting without commit')

          p.write_text(s, encoding='utf-8')
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/main.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix businesses section navigation"
          git push
