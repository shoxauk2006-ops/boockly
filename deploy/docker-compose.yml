services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookly
      POSTGRES_USER: bookly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://bookly:${POSTGRES_PASSWORD}@db:5432/bookly
    depends_on:
      - db
    expose:
      - "8000"

  bot:
    build:
      context: ..
      dockerfile: Dockerfile.bot
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      - api

  worker:
    build:
      context: ..
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://bookly:${POSTGRES_PASSWORD}@db:5432/bookly
    depends_on:
      - db

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: ${PUBLIC_API_URL}
        VITE_BOT_USERNAME: ${BOT_USERNAME}
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - api

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
